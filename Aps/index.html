<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Digital Poin Santri</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- jsPDF & AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <!-- html2canvas untuk Download Kartu -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- SweetAlert2 untuk Notifikasi & Pop-up Keren -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; color: #0f172a; }
        [x-cloak] { display: none !important; }
        .mobile-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #ffffff;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body x-data="appState()" x-init="initApp()" class="antialiased selection:bg-emerald-500 selection:text-white">

<div class="mobile-container" x-cloak>

    <!-- 1. SPLASH SCREEN -->
    <div x-show="showSplash" 
         x-transition:leave="transition ease-in-out duration-700"
         x-transition:leave-start="opacity-100 transform scale-100"
         x-transition:leave-end="opacity-0 transform scale-105"
         class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-gradient-to-br from-emerald-50 via-white to-teal-50 text-slate-900 p-6 max-w-[480px] mx-auto">
        <div class="relative mb-6">
            <div class="absolute -inset-3 bg-gradient-to-r from-emerald-400 to-teal-400 rounded-full blur-xl opacity-30 animate-pulse"></div>
            <div class="relative w-28 h-28 bg-white rounded-full flex items-center justify-center border-4 border-emerald-500/20 shadow-2xl overflow-hidden animate-bounce">
                <template x-if="instansi.logo">
                    <img :src="instansi.logo" alt="Logo" class="w-full h-full object-cover bg-white">
                </template>
                <template x-if="!instansi.logo">
                    <i class="fa-solid fa-graduation-cap text-4xl text-emerald-600"></i>
                </template>
            </div>
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight text-center mb-1 text-slate-900 animate-pulse" x-text="instansi.nama || 'Sistem Digital Poin Santri'"></h1>
        <p class="text-emerald-700 text-xs font-semibold tracking-wide text-center mb-8 uppercase">Manajemen Prestasi & Reward Realtime</p>
        <div class="w-36 h-1.5 bg-slate-200 rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r from-emerald-500 to-teal-500 animate-[pulse_1s_infinite] w-full rounded-full"></div>
        </div>
    </div>

    <!-- 2. HALAMAN LOGIN -->
    <template x-if="!isLoggedIn">
        <div class="flex-1 flex flex-col justify-center px-6 py-12 bg-gradient-to-b from-emerald-50/50 via-white to-white">
            <div class="text-center mb-8">
                <div class="w-24 h-24 mx-auto mb-4 bg-white rounded-3xl flex items-center justify-center shadow-xl shadow-emerald-100 border border-slate-100 overflow-hidden">
                    <template x-if="instansi.logo">
                        <img :src="instansi.logo" alt="Logo" class="w-full h-full object-cover bg-white">
                    </template>
                    <template x-if="!instansi.logo">
                        <i class="fa-solid fa-mosque text-3xl text-emerald-600"></i>
                    </template>
                </div>
                <h2 class="text-xl font-bold text-slate-900 tracking-tight" x-text="instansi.nama || 'Pondok Pesantren'"></h2>
                <p class="text-xs text-slate-500 mt-1">Silakan masuk menggunakan akun resmi Anda</p>
            </div>

            <form @submit.prevent="handleLogin" class="space-y-4 bg-white p-7 rounded-3xl shadow-xl shadow-slate-100 border border-slate-100/80">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-user text-xs"></i></span>
                        <input type="text" x-model="loginForm.username" required placeholder="Masukkan username" 
                               class="w-full pl-10 pr-4 py-3 text-xs bg-slate-50/80 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-lock text-xs"></i></span>
                        <input type="password" x-model="loginForm.password" required placeholder="Masukkan password" 
                               class="w-full pl-10 pr-4 py-3 text-xs bg-slate-50/80 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                    </div>
                </div>
                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-semibold rounded-xl text-xs shadow-lg shadow-emerald-200 transition">
                    Masuk ke Sistem <i class="fa-solid fa-arrow-right ml-1.5"></i>
                </button>
            </form>
        </div>
    </template>

    <!-- 3. HALAMAN UTAMA APLIKASI -->
    <template x-if="isLoggedIn">
        <div class="flex-1 flex flex-col pb-16">
            
            <!-- HEADER -->
            <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-100 px-4 py-3 flex items-center justify-between shadow-xs">
                <div class="flex items-center space-x-2.5">
                    <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center font-bold text-sm shadow-sm border border-slate-200 overflow-hidden">
                        <template x-if="instansi.logo">
                            <img :src="instansi.logo" alt="Logo" class="w-full h-full object-cover bg-white">
                        </template>
                        <template x-if="!instansi.logo">
                            <i class="fa-solid fa-mosque text-emerald-600"></i>
                        </template>
                    </div>
                    <div>
                        <h1 class="text-xs font-bold text-slate-900 leading-tight tracking-tight" x-text="instansi.nama || 'Poin Santri'"></h1>
                        <span class="text-[10px] text-emerald-600 font-semibold uppercase tracking-wider" x-text="currentUser.role"></span>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button @click="openNotificationModal()" class="relative p-2.5 text-slate-600 hover:bg-slate-100 rounded-full transition">
                        <i class="fa-solid fa-bell text-sm"></i>
                        <!-- Titik merah notifikasi hanya tampil untuk admin -->
                        <template x-if="currentUser.role === 'admin' && unreadNotificationCount > 0">
                            <span class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-rose-500 rounded-full ring-2 ring-white animate-pulse"></span>
                        </template>
                    </button>
                    <button @click="logout()" class="p-2.5 text-rose-600 hover:bg-rose-50 rounded-full transition" title="Keluar">
                        <i class="fa-solid fa-power-off text-sm"></i>
                    </button>
                </div>
            </header>

            <!-- NAVIGASI TAB ATAS -->
            <nav class="bg-white border-b border-slate-100 flex justify-around sticky top-[57px] z-30 shadow-xs px-1 overflow-x-auto">
                <template x-for="tab in availableTabs" :key="tab.id">
                    <button @click="setActiveTab(tab.id)" 
                            :class="activeTab === tab.id ? 'text-emerald-600 border-b-2 border-emerald-600 bg-emerald-50/40' : 'text-slate-400 hover:text-slate-600 hover:bg-slate-50/50'"
                            class="flex-1 min-w-[50px] py-3 text-center transition flex flex-col items-center justify-center shrink-0">
                        <i :class="tab.icon" class="text-base mb-1"></i>
                        <span class="text-[9px] font-bold tracking-tight" x-text="tab.label"></span>
                    </button>
                </template>
            </nav>

            <!-- KONTEN UTAMA -->
            <main class="flex-1 p-4 space-y-4">

                <!-- TAB 1: DASBOR & LEADERBOARD -->
                <div x-show="activeTab === 'dashboard'" class="space-y-4">
                    <div class="bg-gradient-to-br from-emerald-900 via-slate-900 to-teal-950 rounded-3xl p-5 text-white shadow-xl flex justify-between items-center relative overflow-hidden">
                        <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/5 rounded-full blur-2xl"></div>
                        <div class="relative z-10">
                            <p class="text-[11px] text-emerald-300 font-medium tracking-wide uppercase mb-0.5">Waktu Real-Time (Supabase)</p>
                            <h2 class="text-2xl font-extrabold tracking-tight" x-text="currentTime"></h2>
                            <p class="text-xs text-slate-300 mt-1 font-medium" x-text="currentDate"></p>
                        </div>
                        <div class="relative z-10 w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center backdrop-blur-md border border-white/10">
                            <i class="fa-solid fa-clock text-xl text-emerald-200"></i>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0">
                                <i class="fa-solid fa-users text-sm"></i>
                            </div>
                            <div>
                                <span class="text-[11px] text-slate-400 font-semibold block leading-tight">Total Santri</span>
                                <h3 class="text-lg font-extrabold text-slate-800 mt-0.5" x-text="santriList.length"></h3>
                            </div>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-teal-50 text-teal-600 flex items-center justify-center shrink-0">
                                <i class="fa-solid fa-gift text-sm"></i>
                            </div>
                            <div>
                                <span class="text-[11px] text-slate-400 font-semibold block leading-tight">Reward Ready</span>
                                <h3 class="text-lg font-extrabold text-slate-800 mt-0.5" x-text="rewardList.length"></h3>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-xs font-bold text-slate-800 flex items-center uppercase tracking-wider">
                                <i class="fa-solid fa-trophy text-amber-500 mr-2 text-sm"></i> Papan Peringkat Santri
                            </h3>
                            <span class="text-[10px] bg-amber-50 text-amber-700 px-2.5 py-1 rounded-full font-bold">Top Poin</span>
                        </div>
                        <div class="space-y-2.5">
                            <template x-for="(s, index) in sortedSantriLeaderboard" :key="s.id">
                                <div class="flex items-center justify-between p-3 bg-slate-50/70 rounded-2xl border border-slate-100/80">
                                    <div class="flex items-center space-x-3">
                                        <!-- Warna nomor urut seragam -->
                                        <div class="w-7 h-7 rounded-xl flex items-center justify-center text-xs font-extrabold shadow-xs bg-slate-100 text-slate-700"
                                             x-text="index + 1">
                                        </div>
                                        <div>
                                            <h4 class="text-xs font-bold text-slate-800" x-text="s.nama"></h4>
                                            <div class="flex items-center space-x-1.5 mt-0.5">
                                                <span class="text-[10px] bg-slate-200/70 text-slate-600 px-1.5 py-0.5 rounded font-bold" x-text="s.kelompok || 'Tanpa Kelompok'"></span>
                                                <span class="text-[10px] text-slate-400 font-medium" x-text="'Hafalan: ' + (s.hafalan || '-')"></span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-xs font-extrabold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg" x-text="s.poin + ' Poin'"></span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- TAB 2: DATA SANTRI -->
                <div x-show="activeTab === 'santri'" class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xs font-bold text-slate-800 uppercase tracking-wider">Manajemen Data Santri</h3>
                        <button @click="openSantriModal()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md transition flex items-center">
                            <i class="fa-solid fa-plus mr-1.5 text-[10px]"></i> Tambah Santri
                        </button>
                    </div>

                    <div class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-xs space-y-2.5">
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-search text-xs"></i></span>
                            <input type="text" x-model="santriSearch" placeholder="Cari nama santri..." 
                                   class="w-full pl-10 pr-4 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>

                        <!-- Filter Guru/Kelompok & Pengurutan Abjad -->
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[9px] font-bold text-slate-500 mb-1 uppercase tracking-wider">Filter Kelompok / Guru</label>
                                <select x-model="selectedKelompokFilter" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 focus:outline-none font-semibold text-slate-700">
                                    <option value="">Semua Kelompok / Guru</option>
                                    <template x-for="kel in availableKelompokList" :key="kel">
                                        <option :value="kel" x-text="kel"></option>
                                    </template>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-slate-500 mb-1 uppercase tracking-wider">Urutkan Abjad</label>
                                <select x-model="santriSortBy" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 focus:outline-none font-semibold text-slate-700">
                                    <option value="default">Default (Terbaru)</option>
                                    <option value="name-asc">Nama: A ke Z</option>
                                    <option value="name-desc">Nama: Z ke A</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-2.5">
                        <template x-for="s in filteredSantriFixedPosition" :key="s.id">
                            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-xs flex justify-between items-center">
                                <div class="flex items-center space-x-3">
                                    <div class="w-12 h-12 rounded-2xl bg-slate-100 overflow-hidden shrink-0 border border-slate-200">
                                        <template x-if="s.foto">
                                            <img :src="s.foto" alt="Foto" class="w-full h-full object-cover">
                                        </template>
                                        <template x-if="!s.foto">
                                            <div class="w-full h-full flex items-center justify-center text-slate-400">
                                                <i class="fa-solid fa-user text-xs"></i>
                                            </div>
                                        </template>
                                    </div>
                                    <div>
                                        <h4 class="text-xs font-bold text-slate-800" x-text="s.nama"></h4>
                                        <p class="text-[10px] text-slate-400 mt-0.5" x-text="'Hafalan: ' + (s.hafalan || '-') + ' | Umur: ' + (s.umur || '-') + ' Thn'"></p>
                                        <div class="mt-1.5 flex items-center space-x-2">
                                            <span class="px-2 py-0.5 bg-slate-100 text-slate-700 rounded-md text-[10px] font-bold" x-text="s.kelompok || 'Tanpa Kelompok'"></span>
                                            <span class="px-2 py-0.5 bg-emerald-50 text-emerald-700 rounded-md text-[10px] font-bold" x-text="s.poin + ' Poin'"></span>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-1">
                                    <button @click="openCardModal(s)" class="p-2 bg-teal-50 text-teal-600 hover:bg-teal-100 rounded-xl transition" title="Lihat Kartu">
                                        <i class="fa-solid fa-id-card text-xs"></i>
                                    </button>
                                    <button @click="editSantri(s)" class="p-2 text-emerald-600 hover:bg-emerald-50 rounded-xl transition" title="Edit">
                                        <i class="fa-solid fa-pen-to-square text-xs"></i>
                                    </button>
                                    <button @click="deleteSantri(s.id)" class="p-2 text-rose-600 hover:bg-rose-50 rounded-xl transition" title="Hapus">
                                        <i class="fa-solid fa-trash text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        </template>
                        <template x-if="filteredSantriFixedPosition.length === 0">
                            <p class="text-xs text-slate-400 text-center py-6 font-medium bg-white rounded-2xl border border-slate-100">Belum ada data santri yang sesuai.</p>
                        </template>
                    </div>
                </div>

                <!-- TAB 3: ABSENSI -->
                <div x-show="activeTab === 'absensi'" class="space-y-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="text-xs font-bold text-slate-800 uppercase tracking-wider">Modul Absensi Harian Santri</h3>
                            <p class="text-[10px] text-slate-400">Catat kehadiran harian dengan cepat</p>
                        </div>
                        <button @click="exportAbsensiPDF()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md transition flex items-center">
                            <i class="fa-solid fa-file-pdf mr-1.5 text-[10px]"></i> Rekap PDF
                        </button>
                    </div>

                    <!-- Kotak Pencarian Halaman Absensi Baru -->
                    <div class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-xs">
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-search text-xs"></i></span>
                            <input type="text" x-model="absensiSearch" placeholder="Cari nama santri untuk absensi..." 
                                   class="w-full pl-10 pr-4 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                    </div>

                    <div class="space-y-2.5">
                        <template x-for="s in filteredAbsensiList" :key="s.id">
                            <div class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-xs space-y-2.5">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <h4 class="text-xs font-bold text-slate-800" x-text="s.nama"></h4>
                                        <div class="flex items-center space-x-1.5 mt-0.5">
                                            <span class="text-[9px] bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded font-bold" x-text="s.kelompok || 'Tanpa Kelompok'"></span>
                                            <span class="text-[9px] text-emerald-600 font-bold" x-text="'Poin: ' + s.poin"></span>
                                        </div>
                                    </div>
                                    <div class="flex space-x-1 text-center">
                                        <div class="bg-emerald-50 text-emerald-800 py-0.5 px-2 rounded-md">
                                            <span class="block text-[8px] font-semibold uppercase text-emerald-600">Hadir</span>
                                            <span class="text-[10px] font-extrabold" x-text="getAttendanceStats(s.nama).hadir"></span>
                                        </div>
                                        <div class="bg-amber-50 text-amber-800 py-0.5 px-2 rounded-md">
                                            <span class="block text-[8px] font-semibold uppercase text-amber-600">Izin</span>
                                            <span class="text-[10px] font-extrabold" x-text="getAttendanceStats(s.nama).izin"></span>
                                        </div>
                                        <div class="bg-blue-50 text-blue-800 py-0.5 px-2 rounded-md">
                                            <span class="block text-[8px] font-semibold uppercase text-blue-600">Sakit</span>
                                            <span class="text-[10px] font-extrabold" x-text="getAttendanceStats(s.nama).sakit"></span>
                                        </div>
                                        <div class="bg-rose-50 text-rose-800 py-0.5 px-2 rounded-md">
                                            <span class="block text-[8px] font-semibold uppercase text-rose-600">Alpa</span>
                                            <span class="text-[10px] font-extrabold" x-text="getAttendanceStats(s.nama).alpa"></span>
                                        </div>
                                    </div>
                                </div>

                                <div class="flex items-center space-x-2 pt-1 border-t border-slate-100">
                                    <select x-model="selectedAction[s.id]" class="text-xs bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 focus:outline-none font-semibold text-slate-700 flex-1">
                                        <option value="">Pilih Status Kehadiran</option>
                                        <option value="Hadir" x-text="'Hadir (' + (attendanceConfig.hadir >= 0 ? '+' + attendanceConfig.hadir : attendanceConfig.hadir) + ')'"></option>
                                        <option value="Izin" x-text="'Izin (' + (attendanceConfig.izin >= 0 ? '+' + attendanceConfig.izin : attendanceConfig.izin) + ')'"></option>
                                        <option value="Sakit" x-text="'Sakit (' + (attendanceConfig.sakit >= 0 ? '+' + attendanceConfig.sakit : attendanceConfig.sakit) + ')'"></option>
                                        <option value="Alpa" x-text="'Alpa (' + (attendanceConfig.alpa >= 0 ? '+' + attendanceConfig.alpa : attendanceConfig.alpa) + ')'"></option>
                                    </select>

                                    <button @click="processAbsensiOnly(s.id)" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition shadow-xs shrink-0">
                                        Simpan
                                    </button>
                                </div>
                            </div>
                        </template>
                        <template x-if="filteredAbsensiList.length === 0">
                            <p class="text-xs text-slate-400 text-center py-6 font-medium bg-white rounded-2xl border border-slate-100">Tidak ada santri yang ditemukan pada pencarian absensi.</p>
                        </template>
                    </div>

                    <div class="bg-white rounded-3xl p-4 border border-slate-100 shadow-sm space-y-3 mt-4">

    function compressImage(file, maxWidth = 200, quality = 0.6) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/webp', quality);
                    fetch(dataUrl)
                        .then(res => res.blob())
                        .then(blob => {
                            resolve(new File([blob], file.name.replace(/\.[^/.]+$/, ".webp"), { type: 'image/webp', lastModified: Date.now() }));
                        })
                        .catch(err => reject(err));
                };
                img.onerror = error => reject(error);
            };
            reader.onerror = error => reject(error);
        });
    }

            async loadInitialData() {

                    let instansiRes = await supabaseClient.from('instansi').select('*').eq('id', 'profile').maybeSingle();
                    if (instansiRes.data) {
                        this.instansi = instansiRes.data;

                    let rewardRes = await supabaseClient.from('rewards').select('*');

                    let logRes = await supabaseClient.from('attendance_logs').select('*');

                let izin = logs.filter(l => l.status && l.status.toLowerCase().includes('izin')).length;
                let sakit = logs.filter(l => l.status && l.status.toLowerCase().includes('sakit')).length;
                let alpa = logs.filter(l => l.status && l.status.toLowerCase().includes('alpa')).length;
                return { hadir, izin, sakit, alpa };
            },

            async handleLogin() {
                if (this.loginForm.username === 'admin' && this.loginForm.password === 'admin123') {
                    this.currentUser = { username: 'admin', role: 'admin', permissions: { absensi: true, poin: true, santri: true } };
                    this.isLoggedIn = true;
                } else {
                    let teacher = this.teachersList.find(t => t.username === this.loginForm.username && t.password === this.loginForm.password);
                    if (teacher) {
                        this.currentUser = { username: teacher.username, role: 'teacher', permissions: teacher.permissions };
                        this.isLoggedIn = true;
                    } else {
                        this.showToast('Username atau Password salah!', 'error');
                        return;
                    }
                }
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', JSON.stringify(this.currentUser));
                this.activeTab = 'dashboard';
                this.showToast('Berhasil masuk ke sistem!');
            },

            logout() {
                this.isLoggedIn = false;
                this.currentUser = { username: '', role: 'admin', permissions: {} };
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('currentUser');
                localStorage.removeItem('activeTab');
                this.loginForm = { username: '', password: '' };
                this.showToast('Berhasil keluar sesi.');
            },

            get availableTabs() {
                let tabs = [{ id: 'dashboard', label: 'Dasbor', icon: 'fa-solid fa-house' }];
                if (this.currentUser.role === 'admin' || this.currentUser.permissions.santri) {
                    tabs.push({ id: 'santri', label: 'Santri', icon: 'fa-solid fa-users' });
                }
                if (this.currentUser.role === 'admin' || this.currentUser.permissions.absensi) {
                    tabs.push({ id: 'absensi', label: 'Absensi', icon: 'fa-solid fa-clipboard-user' });
                }
                if (this.currentUser.role === 'admin' || this.currentUser.permissions.poin) {
                    tabs.push({ id: 'kategori_poin', label: 'Poin & Kategori', icon: 'fa-solid fa-tags' });
                }
                tabs.push({ id: 'reward', label: 'Reward', icon: 'fa-solid fa-gift' });
                if (this.currentUser.role === 'admin') {
                    tabs.push({ id: 'validasi', label: 'Validasi', icon: 'fa-solid fa-circle-check' });
                    tabs.push({ id: 'users', label: 'Pengguna', icon: 'fa-solid fa-user-gear' });
                    tabs.push({ id: 'settings', label: 'Pengaturan', icon: 'fa-solid fa-gear' });
                }
                return tabs;
            },

            get sortedSantriLeaderboard() {
                return [...this.santriList].sort((a, b) => b.poin - a.poin);
            },

            get availableKelompokList() {
                return [...new Set(this.santriList.map(s => s.kelompok).filter(Boolean))].sort();
            },

            // Filter & Sorting santri (Mendukung Pencarian, Filter Kelompok/Guru, dan Sorting Abjad A-Z / Z-A)
            get filteredSantriFixedPosition() {
                let result = [...this.santriList];
                if (this.santriSearch) {
                    result = result.filter(s => s.nama.toLowerCase().includes(this.santriSearch.toLowerCase()));
                }
                if (this.selectedKelompokFilter) {
                    result = result.filter(s => s.kelompok === this.selectedKelompokFilter);
                }

                if (this.santriSortBy === 'name-asc') {
                    result.sort((a, b) => (a.nama || '').localeCompare(b.nama || '', 'id', { sensitivity: 'base' }));
                } else if (this.santriSortBy === 'name-desc') {
                    result.sort((a, b) => (b.nama || '').localeCompare(a.nama || '', 'id', { sensitivity: 'base' }));
                }

                return result;
            },

            // Getter pencarian khusus untuk daftar santri di halaman absensi
            get filteredAbsensiList() {
                let result = [...this.santriList];
                if (this.absensiSearch) {
                    result = result.filter(s => s.nama.toLowerCase().includes(this.absensiSearch.toLowerCase()));
                }
                return result;
            },

            async saveSantri() {
                if (!this.santriForm.nama || this.santriForm.nama.trim() === '') {
                    this.showToast('Nama lengkap santri wajib diisi!', 'warning');
                    return;
                }

                showLoading('Menyimpan data santri...');
                let payload = {
                    nama: this.santriForm.nama.trim(),
                    kelompok: this.santriForm.kelompok,
                    hafalan: this.santriForm.hafalan,
                    umur: parseInt(this.santriForm.umur) || 0,
                    alamat: this.santriForm.alamat,
                    foto: this.santriForm.foto || '',
                    poin: parseInt(this.santriForm.poin) || 0
                };
                
                if (this.santriForm.id) {
                    await supabaseClient.from('santri').update(payload).eq('id', this.santriForm.id);
                } else {
                    await supabaseClient.from('santri').insert([payload]);
                }

                hideLoading();
                this.isSantriModalOpen = false;
                this.loadInitialData();
                this.showToast('Data santri berhasil disimpan!');
            },

            openSantriModal() {
                this.santriForm = { id: null, nama: '', kelompok: '', hafalan: '', umur: '', alamat: '', foto: '', poin: 0 };
                this.isSantriModalOpen = true;
            },

            editSantri(s) {
                this.santriForm = { ...s };
                this.isSantriModalOpen = true;
            },

            openCardModal(s) {
                this.activeCardSantri = s;
                this.isCardModalOpen = true;
            },

            downloadCardImage() {
                const cardElement = document.getElementById('captureCard');
                showLoading('Menyiapkan gambar kartu...');
                html2canvas(cardElement, { scale: 3, useCORS: true }).then(canvas => {
                    hideLoading();
                    const link = document.createElement('a');
                    link.download = `Kartu-${this.activeCardSantri.nama.replace(/\s+/g, '_')}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    this.showToast('Kartu berhasil di-download!');
                }).catch(() => {
                    hideLoading();
                    this.showToast('Gagal mengunduh kartu.', 'error');
                });
            },

            async deleteSantri(id) {
                Swal.fire({
                    title: 'Hapus Santri?',
                    text: 'Data santri akan dihapus permanen!',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ef4444',
                    confirmButtonText: 'Ya, Hapus',
                    cancelButtonText: 'Batal'
                }).then(async (result) => {
                    if (result.isConfirmed) {
                        showLoading('Menghapus...');
                        await supabaseClient.from('santri').delete().eq('id', id);
                        hideLoading();
                        this.loadInitialData();
                        this.showToast('Santri dihapus.');
                    }
                });
            },

            async uploadSantriFoto(event) {
                const file = event.target.files[0];
                if (file) {
                    const compressed = await compressImage(file, 800, 0.8);
                    const reader = new FileReader();
                    reader.onload = (e) => { this.santriForm.foto = e.target.result; };
                    reader.readAsDataURL(compressed);
                }
            },

            async submitGrading() {
                if (!this.gradingForm.santriId || !this.gradingForm.categoryId) {
                    this.showToast('Pilih santri dan kategori penilaian terlebih dahulu!', 'warning');
                    return;
                }

                let santri = this.santriList.find(s => s.id == this.gradingForm.santriId);
                let category = this.pointItems.find(c => c.id == this.gradingForm.categoryId);

                if (!santri || !category) return;

                let poinAdd = parseInt(category.poin) || 0;
                let keteranganCatatan = this.gradingForm.catatan ? `${category.nama} - ${this.gradingForm.catatan}` : category.nama;

                showLoading('Menyimpan penilaian kategori...');
                await supabaseClient.from('santri').update({ poin: (santri.poin || 0) + poinAdd }).eq('id', santri.id);
                await supabaseClient.from('attendance_logs').insert([{ 
                    santri_nama: santri.nama, 
                    status: `Penilaian Kategori (${poinAdd >= 0 ? '+' + poinAdd : poinAdd})`, 
                    poin: poinAdd, 
                    catatan: keteranganCatatan,
                    tanggal: new Date().toLocaleDateString() 
                }]);

                hideLoading();
                this.gradingForm = { santriId: '', categoryId: '', catatan: '' };
                this.loadInitialData();
                this.showToast('Penilaian kategori & poin berhasil disimpan!');
            },

            async submitBonusPoin() {
                if (!this.bonusForm.santriId || !this.bonusForm.jumlahPoin || !this.bonusForm.catatan) {
                    this.showToast('Pilih santri, masukkan jumlah poin, dan tulis catatan alasannya!', 'warning');
                    return;
                }

                let santri = this.santriList.find(s => s.id == this.bonusForm.santriId);
                let poinAdd = parseInt(this.bonusForm.jumlahPoin) || 0;
                let keterangan = this.bonusForm.catatan.trim();

                showLoading('Menyimpan poin bonus...');
                await supabaseClient.from('santri').update({ poin: (santri.poin || 0) + poinAdd }).eq('id', santri.id);
                await supabaseClient.from('attendance_logs').insert([{ 
                    santri_nama: santri.nama, 
                    status: `Poin Bonus Bebas (${poinAdd >= 0 ? '+' + poinAdd : poinAdd})`, 
                    poin: poinAdd, 
                    catatan: keterangan,
                    tanggal: new Date().toLocaleDateString() 
                }]);

                hideLoading();
                this.bonusForm = { santriId: '', jumlahPoin: '', catatan: '' };
                this.loadInitialData();
                this.showToast('Poin bonus & catatan berhasil disimpan!');
            },

            async processAbsensiOnly(santriId) {
                let status = this.selectedAction[santriId];
                if (!status) {
                    this.showToast('Pilih status kehadiran!', 'warning');
                    return;
                }
                let santri = this.santriList.find(s => s.id === santriId);
                let poinAdd = parseInt(this.attendanceConfig[status.toLowerCase()]) || 0;

                showLoading('Mencatat absensi...');
                await supabaseClient.from('santri').update({ poin: (santri.poin || 0) + poinAdd }).eq('id', santriId);
                await supabaseClient.from('attendance_logs').insert([{ 
                    santri_nama: santri.nama, 
                    status: `${status} (${poinAdd >= 0 ? '+' + poinAdd : poinAdd})`, 
                    poin: poinAdd, 
                    catatan: 'Kehadiran Harian',
                    tanggal: new Date().toLocaleDateString() 
                }]);
                
                this.selectedAction[santriId] = '';
                hideLoading();
                this.loadInitialData();
                this.showToast('Absensi dicatat.');
            },

            async deleteAttendanceLog(log) {
                showLoading('Mengoreksi log...');
                let santri = this.santriList.find(s => s.nama === log.santri_nama);
                if (santri) {
                    await supabaseClient.from('santri').update({ poin: (santri.poin || 0) - (log.poin || 0) }).eq('id', santri.id);
                }
                await supabaseClient.from('attendance_logs').delete().eq('id', log.id);
                hideLoading();
                this.loadInitialData();
                this.showToast('Log absensi dikoreksi.');
            },

            async savePointItem() {
                if (!this.pointItemForm.nama) return;
                showLoading('Menyimpan kategori...');
                let payload = { nama: this.pointItemForm.nama.trim(), poin: parseInt(this.pointItemForm.poin) || 0 };
                if (this.pointItemForm.id) {
                    await supabaseClient.from('point_items').update(payload).eq('id', this.pointItemForm.id);
                } else {
                    await supabaseClient.from('point_items').insert([payload]);
                }
                hideLoading();
                this.resetPointItemForm();
                this.loadInitialData();
                this.showToast('Kategori disimpan.');
            },

            editPointItem(item) { this.pointItemForm = { ...item }; },
            resetPointItemForm() { this.pointItemForm = { id: null, nama: '', poin: 0 }; },

            async deletePointItem(id) {
                await supabaseClient.from('point_items').delete().eq('id', id);
                this.loadInitialData();
                this.showToast('Kategori dihapus.');
            },

            async saveReward() {
                if (!this.rewardForm.nama) return;
                showLoading('Menyimpan reward...');
                let payload = { nama: this.rewardForm.nama, poin: parseInt(this.rewardForm.poin) || 0, stok: parseInt(this.rewardForm.stok) || 0, foto: this.rewardForm.foto || '' };
                if (this.rewardForm.id) {
                    await supabaseClient.from('rewards').update(payload).eq('id', this.rewardForm.id);
                } else {
                    await supabaseClient.from('rewards').insert([payload]);
                }
                hideLoading();
                this.isRewardModalOpen = false;
                this.loadInitialData();
                this.showToast('Reward disimpan.');
            },

            openRewardModal() {
                this.rewardForm = { id: null, nama: '', poin: 0, stok: 0, foto: '' };
                this.isRewardModalOpen = true;
            },

            editReward(r) { this.rewardForm = { ...r }; this.isRewardModalOpen = true; },

            async incrementStock(r) {
                await supabaseClient.from('rewards').update({ stok: (r.stok || 0) + 1 }).eq('id', r.id);
                this.loadInitialData();
            },

            async deleteReward(id) {
                await supabaseClient.from('rewards').delete().eq('id', id);
                this.loadInitialData();
                this.showToast('Reward dihapus.');
            },

            async uploadRewardFoto(event) {
                const file = event.target.files[0];
                if (file) {
                    const compressed = await compressImage(file, 800, 0.8);
                    const reader = new FileReader();
                    reader.onload = (e) => { this.rewardForm.foto = e.target.result; };
                    reader.readAsDataURL(compressed);
                }
            },

            async uploadLogo(event) {
                const file = event.target.files[0];
                if (file) {
                    showLoading('Mengoptimalkan logo...');
                    const compressed = await compressImage(file, 200, 0.6);
                    const reader = new FileReader();
                    reader.onload = (e) => { 
                        this.instansi.logo = e.target.result;
                        hideLoading();
                        this.showToast('Logo berhasil dioptimalkan!');
                    };
                    reader.readAsDataURL(compressed);
                }
            },

            async saveInstansi() {
                showLoading('Menyimpan instansi ke database...');
                await supabaseClient.from('instansi').upsert({ id: 'profile', nama: this.instansi.nama, logo: this.instansi.logo });
                hideLoading();
                this.loadInitialData();
                this.showToast('Profil instansi berhasil disimpan!');
            },

            async saveGuru() {
                if (!this.newGuru.username || !this.newGuru.password) return;
                showLoading('Menambah guru...');
                await supabaseClient.from('teachers').insert([this.newGuru]);
                hideLoading();
                this.newGuru = { username: '', password: '', permissions: { absensi: true, poin: true, santri: true } };
                this.loadInitialData();
                this.showToast('Guru ditambahkan.');
            },

            async deleteTeacher(id) {
                await supabaseClient.from('teachers').delete().eq('id', id);
                this.loadInitialData();
                this.showToast('Guru dihapus.');
            },

            async openExchangeModal(reward) {
                let santriOptions = {};
                this.santriList.forEach(s => { santriOptions[s.id] = `${s.nama} (${s.poin} Poin)`; });

                const { value: selectedSantriId } = await Swal.fire({
                    title: 'Tukar Reward',
                    input: 'select',
                    inputOptions: santriOptions,
                    inputPlaceholder: 'Pilih santri...',
                    showCancelButton: true
                });

                if (!selectedSantriId) return;
                let santri = this.santriList.find(s => s.id == selectedSantriId);

                if (santri.poin < reward.poin) {
                    this.showToast('Poin santri tidak cukup!', 'warning');
                    return;
                }

                await supabaseClient.from('notifications').insert([{
                    pesan: `Santri ${santri.nama} menukar ${reward.nama} (${reward.poin} poin).`,
                    tipe: 'approval',
                    validated: false,
                    status_validasi: 'pending',
                    santri_id: santri.id,
                    reward_id: reward.id,
                    poin_tukar: reward.poin,
                    waktu: new Date().toLocaleString()
                }]);

                this.loadInitialData();
                this.showToast('Pengajuan penukaran terkirim ke admin.');
            },

            async processCashExchange() {
                if (!this.cashExchange.santriId || !this.cashExchange.nominal) return;
                let santri = this.santriList.find(s => s.id == this.cashExchange.santriId);
                let nominal = parseInt(this.cashExchange.nominal);

                if (santri.poin < nominal) {
                    this.showToast('Poin tidak cukup!', 'warning');
                    return;
                }

                showLoading('Memproses...');
                await supabaseClient.from('santri').update({ poin: santri.poin - nominal }).eq('id', santri.id);
                hideLoading();
                this.cashExchange = { santriId: '', nominal: 1000 };
                this.loadInitialData();
                this.showToast('Penukaran tunai berhasil.');
            },

            openNotificationModal() { this.isNotificationModalOpen = true; this.unreadNotificationCount = 0; },
            closeNotificationModal() { this.isNotificationModalOpen = false; },
            goToValidasiMenu() { this.isNotificationModalOpen = false; this.setActiveTab('validasi'); },

            async approveRedemption(notif) {
                showLoading('Menyetujui...');
                await supabaseClient.from('notifications').update({ validated: true, status_validasi: 'disetujui' }).eq('id', notif.id);

                let santri = this.santriList.find(s => s.id == notif.santri_id);
                let reward = this.rewardList.find(r => r.id == notif.reward_id);

                if (santri && reward) {
                    await supabaseClient.from('santri').update({ poin: Math.max(0, santri.poin - notif.poin_tukar) }).eq('id', santri.id);
                    await supabaseClient.from('rewards').update({ stok: Math.max(0, reward.stok - 1) }).eq('id', reward.id);
                }

                hideLoading();
                this.loadInitialData();
                this.showToast('Disetujui.');
            },

            async rejectRedemption(notif) {
                await supabaseClient.from('notifications').update({ validated: true, status_validasi: 'ditolak' }).eq('id', notif.id);
                this.loadInitialData();
                this.showToast('Ditolak.');
            },

            exportAbsensiPDF() {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.text(`Rekap Absensi & Poin - ${this.instansi.nama}`, 14, 15);
                let rows = this.santriList.map((s, index) => {
                    let stats = this.getAttendanceStats(s.nama);
                    return [index + 1, s.nama, s.kelompok || '-', stats.hadir, stats.izin, stats.sakit, stats.alpa, s.poin];
                });
                doc.autoTable({ head: [['No', 'Nama', 'Kelompok', 'Hadir', 'Izin', 'Sakit', 'Alpa', 'Poin']], body: rows, startY: 20 });
                doc.save("rekap-santri.pdf");
                this.showToast('PDF berhasil diunduh.');
            }
        }
    }
</script>

</body>
</html>
