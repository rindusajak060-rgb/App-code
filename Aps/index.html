<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Digital Poin Santri</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- jsPDF & AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; color: #0f172a; }
        [x-cloak] { display: none !important; }
        .mobile-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #ffffff;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body x-data="appState()" x-init="initApp()" class="antialiased selection:bg-emerald-500 selection:text-white">

<div class="mobile-container" x-cloak>

    <!-- TOAST NOTIFICATION MODERN -->
    <div x-show="toast.show" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 transform translate-y-4"
         x-transition:enter-end="opacity-100 transform translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 transform translate-y-0"
         x-transition:leave-end="opacity-0 transform translate-y-4"
         class="fixed bottom-24 left-1/2 transform -translate-x-1/2 z-50 bg-slate-900/95 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-2.5 text-xs font-semibold backdrop-blur-md border border-white/10 max-w-[90%] pointer-events-none">
        <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
        <span x-text="toast.message"></span>
    </div>

    <!-- 1. SPLASH SCREEN -->
    <div x-show="showSplash" 
         x-transition:leave="transition ease-in-out duration-700"
         x-transition:leave-start="opacity-100 transform scale-100"
         x-transition:leave-end="opacity-0 transform scale-105"
         class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-gradient-to-br from-emerald-50 via-white to-teal-50 text-slate-900 p-6 max-w-[480px] mx-auto">
        <div class="relative mb-6">
            <div class="absolute -inset-3 bg-gradient-to-r from-emerald-400 to-teal-400 rounded-full blur-xl opacity-30 animate-pulse"></div>
            <div class="relative w-28 h-28 bg-white rounded-full flex items-center justify-center border-4 border-emerald-500/20 shadow-2xl overflow-hidden animate-bounce">
                <template x-if="instansi.logo">
                    <img :src="instansi.logo" alt="Logo Instansi" class="w-full h-full object-cover bg-white">
                </template>
                <template x-if="!instansi.logo">
                    <i class="fa-solid fa-graduation-cap text-4xl text-emerald-600"></i>
                </template>
            </div>
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight text-center mb-1 text-slate-900 animate-pulse" x-text="instansi.nama || 'Sistem Digital Poin Santri'"></h1>
        <p class="text-emerald-700 text-xs font-semibold tracking-wide text-center mb-8 uppercase">Manajemen Prestasi & Reward Realtime</p>
        <div class="w-36 h-1.5 bg-slate-200 rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r from-emerald-500 to-teal-500 animate-[pulse_1s_infinite] w-full rounded-full"></div>
        </div>
    </div>

    <!-- 2. HALAMAN LOGIN -->
    <template x-if="!isLoggedIn">
        <div class="flex-1 flex flex-col justify-center px-6 py-12 bg-gradient-to-b from-emerald-50/50 via-white to-white">
            <div class="text-center mb-8">
                <div class="w-24 h-24 mx-auto mb-4 bg-white rounded-3xl flex items-center justify-center shadow-xl shadow-emerald-100 border border-slate-100 overflow-hidden">
                    <template x-if="instansi.logo">
                        <img :src="instansi.logo" alt="Logo Instansi" class="w-full h-full object-cover bg-white">
                    </template>
                    <template x-if="!instansi.logo">
                        <i class="fa-solid fa-mosque text-3xl text-emerald-600"></i>
                    </template>
                </div>
                <h2 class="text-xl font-bold text-slate-900 tracking-tight" x-text="instansi.nama || 'Pondok Pesantren'"></h2>
                <p class="text-xs text-slate-500 mt-1" x-text="loginSettings.subtitle || 'Silakan masuk menggunakan akun resmi Anda'"></p>
            </div>

            <form @submit.prevent="handleLogin" class="space-y-4 bg-white p-7 rounded-3xl shadow-xl shadow-slate-100 border border-slate-100/80">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-user text-xs"></i></span>
                        <input type="text" x-model="loginForm.username" required placeholder="Masukkan username" 
                               class="w-full pl-10 pr-4 py-3 text-xs bg-slate-50/80 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-lock text-xs"></i></span>
                        <input type="password" x-model="loginForm.password" required placeholder="Masukkan password" 
                               class="w-full pl-10 pr-4 py-3 text-xs bg-slate-50/80 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                    </div>
                </div>
                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-semibold rounded-xl text-xs shadow-lg shadow-emerald-200 transition transform active:scale-98">
                    Masuk ke Sistem <i class="fa-solid fa-arrow-right ml-1.5"></i>
                </button>
            </form>
        </div>
    </template>

    <!-- 3. HALAMAN UTAMA APLIKASI -->
    <template x-if="isLoggedIn">
        <div class="flex-1 flex flex-col pb-16">
            
            <!-- HEADER -->
            <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-100 px-4 py-3 flex items-center justify-between shadow-xs">
                <div class="flex items-center space-x-2.5">
                    <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center font-bold text-sm shadow-sm border border-slate-200 overflow-hidden">
                        <template x-if="instansi.logo">
                            <img :src="instansi.logo" alt="Logo" class="w-full h-full object-cover bg-white">
                        </template>
                        <template x-if="!instansi.logo">
                            <i class="fa-solid fa-mosque text-emerald-600"></i>
                        </template>
                    </div>
                    <div>
                        <h1 class="text-xs font-bold text-slate-900 leading-tight tracking-tight" x-text="instansi.nama || 'Poin Santri'"></h1>
                        <span class="text-[10px] text-emerald-600 font-semibold uppercase tracking-wider" x-text="currentUser.role"></span>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button @click="openNotificationModal()" class="relative p-2.5 text-slate-600 hover:bg-slate-100 rounded-full transition">
                        <i class="fa-solid fa-bell text-sm"></i>
                        <template x-if="unreadNotificationCount > 0">
                            <span class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-rose-500 rounded-full ring-2 ring-white animate-pulse"></span>
                        </template>
                    </button>
                    <button @click="logout()" class="p-2.5 text-rose-600 hover:bg-rose-50 rounded-full transition" title="Keluar">
                        <i class="fa-solid fa-power-off text-sm"></i>
                    </button>
                </div>
            </header>

            <!-- NAVIGASI TAB ATAS -->
            <nav class="bg-white border-b border-slate-100 flex justify-around sticky top-[57px] z-30 shadow-xs px-2">
                <template x-for="tab in availableTabs" :key="tab.id">
                    <button @click="setActiveTab(tab.id)" 
                            :class="activeTab === tab.id ? 'text-emerald-600 border-b-2 border-emerald-600 bg-emerald-50/40' : 'text-slate-400 hover:text-slate-600 hover:bg-slate-50/50'"
                            class="flex-1 py-3 text-center transition flex flex-col items-center justify-center">
                        <i :class="tab.icon" class="text-base mb-1"></i>
                        <span class="text-[10px] font-bold tracking-tight" x-text="tab.label"></span>
                    </button>
                </template>
            </nav>

            <!-- KONTEN UTAMA -->
            <main class="flex-1 p-4 space-y-4">

                <!-- TAB 1: DASBOR & LEADERBOARD -->
                <div x-show="activeTab === 'dashboard'" class="space-y-4">
                    <div class="bg-gradient-to-br from-emerald-900 via-slate-900 to-teal-950 rounded-3xl p-5 text-white shadow-xl shadow-emerald-900/10 flex justify-between items-center relative overflow-hidden">
                        <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/5 rounded-full blur-2xl"></div>
                        <div class="relative z-10">
                            <p class="text-[11px] text-emerald-300 font-medium tracking-wide uppercase mb-0.5">Waktu Real-Time (Supabase)</p>
                            <h2 class="text-2xl font-extrabold tracking-tight" x-text="currentTime"></h2>
                            <p class="text-xs text-slate-300 mt-1 font-medium" x-text="currentDate"></p>
                        </div>
                        <div class="relative z-10 w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center backdrop-blur-md border border-white/10">
                            <i class="fa-solid fa-clock text-xl text-emerald-200"></i>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0">
                                <i class="fa-solid fa-users text-sm"></i>
                            </div>
                            <div>
                                <span class="text-[11px] text-slate-400 font-semibold block leading-tight">Total Santri</span>
                                <h3 class="text-lg font-extrabold text-slate-800 mt-0.5" x-text="santriList.length"></h3>
                            </div>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-teal-50 text-teal-600 flex items-center justify-center shrink-0">
                                <i class="fa-solid fa-gift text-sm"></i>
                            </div>
                            <div>
                                <span class="text-[11px] text-slate-400 font-semibold block leading-tight">Reward Ready</span>
                                <h3 class="text-lg font-extrabold text-slate-800 mt-0.5" x-text="rewardList.length"></h3>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-xs font-bold text-slate-800 flex items-center uppercase tracking-wider">
                                <i class="fa-solid fa-trophy text-amber-500 mr-2 text-sm"></i> Papan Peringkat Santri
                            </h3>
                            <span class="text-[10px] bg-amber-50 text-amber-700 px-2.5 py-1 rounded-full font-bold">Top Poin</span>
                        </div>
                        <div class="space-y-2.5">
                            <template x-for="(s, index) in sortedSantriLeaderboard" :key="s.id">
                                <div class="flex items-center justify-between p-3 bg-slate-50/70 rounded-2xl border border-slate-100/80">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-7 h-7 rounded-xl flex items-center justify-center text-xs font-extrabold shadow-xs"
                                             :class="index === 0 ? 'bg-amber-400 text-white' : (index === 1 ? 'bg-slate-300 text-white' : (index === 2 ? 'bg-amber-700 text-white' : 'bg-slate-200 text-slate-600'))"
                                             x-text="index + 1">
                                        </div>
                                        <div>
                                            <h4 class="text-xs font-bold text-slate-800" x-text="s.nama"></h4>
                                            <div class="flex items-center space-x-1.5 mt-0.5">
                                                <span class="text-[10px] bg-slate-200/70 text-slate-600 px-1.5 py-0.5 rounded font-bold" x-text="s.kelompok || 'Tanpa Kelompok'"></span>
                                                <span class="text-[10px] text-slate-400 font-medium" x-text="'Hafalan: ' + (s.hafalan || '-')"></span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-xs font-extrabold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg" x-text="s.poin + ' Poin'"></span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- TAB 2: DATA SANTRI -->
                <div x-show="activeTab === 'santri'" class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xs font-bold text-slate-800 uppercase tracking-wider">Manajemen Data Santri</h3>
                        <button @click="openSantriModal()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md shadow-emerald-100 transition flex items-center">
                            <i class="fa-solid fa-plus mr-1.5 text-[10px]"></i> Tambah Santri
                        </button>
                    </div>

                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-search text-xs"></i></span>
                        <input type="text" x-model="santriSearch" placeholder="Cari nama santri..." 
                               class="w-full pl-10 pr-4 py-2.5 text-xs bg-white border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-xs">
                    </div>

                    <div class="space-y-2.5">
                        <template x-for="s in filteredSantri" :key="s.id">
                            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-xs flex justify-between items-center">
                                <div class="flex items-center space-x-3">
                                    <div class="w-12 h-12 rounded-2xl bg-slate-100 overflow-hidden shrink-0 border border-slate-200">
                                        <template x-if="s.foto">
                                            <img :src="s.foto" alt="Foto" class="w-full h-full object-cover">
                                        </template>
                                        <template x-if="!s.foto">
                                            <div class="w-full h-full flex items-center justify-center text-slate-400">
                                                <i class="fa-solid fa-user text-xs"></i>
                                            </div>
                                        </template>
                                    </div>
                                    <div>
                                        <h4 class="text-xs font-bold text-slate-800" x-text="s.nama"></h4>
                                        <p class="text-[10px] text-slate-400 mt-0.5" x-text="'Hafalan: ' + (s.hafalan || '-') + ' | Umur: ' + (s.umur || '-') + ' Thn'"></p>
                                        <div class="mt-1.5 flex items-center space-x-2">
                                            <span class="px-2 py-0.5 bg-slate-100 text-slate-700 rounded-md text-[10px] font-bold" x-text="s.kelompok || 'Tanpa Kelompok'"></span>
                                            <span class="px-2 py-0.5 bg-emerald-50 text-emerald-700 rounded-md text-[10px] font-bold" x-text="s.poin + ' Poin'"></span>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-1">
                                    <button @click="openCardModal(s)" class="p-2 bg-teal-50 text-teal-600 hover:bg-teal-100 rounded-xl transition" title="Lihat Kartu Pencapaian">
                                        <i class="fa-solid fa-id-card text-xs"></i>
                                    </button>
                                    <button @click="editSantri(s)" class="p-2 text-emerald-600 hover:bg-emerald-50 rounded-xl transition" title="Edit">
                                        <i class="fa-solid fa-pen-to-square text-xs"></i>
                                    </button>
                                    <button @click="deleteSantri(s.id)" class="p-2 text-rose-600 hover:bg-rose-50 rounded-xl transition" title="Hapus">
                                        <i class="fa-solid fa-trash text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        </template>
                        <template x-if="filteredSantri.length === 0">
                            <p class="text-xs text-slate-400 text-center py-6 font-medium bg-white rounded-2xl border border-slate-100">Belum ada data santri.</p>
                        </template>
                    </div>
                </div>

                <!-- TAB 3: ABSENSI & POIN -->
                <div x-show="activeTab === 'absensi'" class="space-y-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="text-xs font-bold text-slate-800 uppercase tracking-wider">Modul Absensi & Poin</h3>
                            <p class="text-[10px] text-slate-400">Poin otomatis sesuai pengaturan admin</p>
                        </div>
                        <button @click="exportAbsensiPDF()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md shadow-emerald-100 transition flex items-center">
                            <i class="fa-solid fa-file-pdf mr-1.5 text-[10px]"></i> Rekap PDF
                        </button>
                    </div>

                    <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm space-y-3">
                        <h4 class="text-xs font-bold text-slate-800 uppercase tracking-wider">Pengaturan Item Penilaian Poin</h4>
                        <div class="grid grid-cols-3 gap-2">
                            <input type="text" x-model="newPointItem.nama" placeholder="Nama Kategori" class="px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none">
                            <input type="number" x-model="newPointItem.poin" placeholder="Jumlah Poin" class="px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none">
                            <button @click="savePointItem()" class="bg-emerald-600 text-white rounded-xl text-xs font-bold py-2 hover:bg-emerald-700 transition">Simpan</button>
                        </div>
                        <div class="space-y-1.5 mt-2 max-h-40 overflow-y-auto">
                            <template x-for="item in pointItems" :key="item.id">
                                <div class="flex justify-between items-center bg-slate-50 px-3 py-2 rounded-xl border border-slate-100 text-xs">
                                    <span class="font-semibold text-slate-700" x-text="item.nama + ' (' + (item.poin > 0 ? '+' + item.poin : item.poin) + ' Poin)'"></span>
                                    <div class="flex space-x-1">
                                        <button @click="editPointItem(item)" class="text-emerald-500 hover:text-emerald-700 p-1"><i class="fa-solid fa-pen text-[10px]"></i></button>
                                        <button @click="deletePointItem(item.id)" class="text-rose-500 hover:text-rose-700 p-1"><i class="fa-solid fa-trash text-[10px]"></i></button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="space-y-2.5">
                        <template x-for="s in santriList" :key="s.id">
                            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-xs space-y-3">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <h4 class="text-xs font-bold text-slate-800" x-text="s.nama"></h4>
                                        <div class="flex items-center space-x-1.5 mt-0.5">
                                            <span class="text-[10px] bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded font-bold" x-text="s.kelompok || 'Tanpa Kelompok'"></span>
                                            <span class="text-[10px] text-emerald-600 font-bold" x-text="'Poin: ' + s.poin"></span>
                                        </div>
                                    </div>
                                    <div class="flex items-center space-x-1.5">
                                        <select @change="processAbsensi(s.id, $event.target.value); $event.target.value='';" class="text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none font-semibold text-slate-700">
                                            <option value="">Pilih Status / Poin</option>
                                            <option value="Hadir" x-text="'Hadir (' + (attendanceConfig.hadir >= 0 ? '+' + attendanceConfig.hadir : attendanceConfig.hadir) + ')'"></option>
                                            <option value="Izin" x-text="'Izin (' + (attendanceConfig.izin >= 0 ? '+' + attendanceConfig.izin : attendanceConfig.izin) + ')'"></option>
                                            <option value="Sakit" x-text="'Sakit (' + (attendanceConfig.sakit >= 0 ? '+' + attendanceConfig.sakit : attendanceConfig.sakit) + ')'"></option>
                                            <option value="Alpa" x-text="'Alpa (' + (attendanceConfig.alpa >= 0 ? '+' + attendanceConfig.alpa : attendanceConfig.alpa) + ')'"></option>
                                            <template x-for="pi in pointItems" :key="pi.id">
                                                <option :value="pi.id" x-text="pi.nama + ' (' + (pi.poin > 0 ? '+' + pi.poin : pi.poin) + ')'"></option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                                <div class="grid grid-cols-4 gap-1 pt-2 border-t border-slate-100 text-center">
                                    <div class="bg-emerald-50 text-emerald-800 py-1 px-1 rounded-lg">
                                        <span class="block text-[9px] font-semibold text-emerald-600 uppercase">Hadir</span>
                                        <span class="text-xs font-extrabold" x-text="getAttendanceStats(s.nama).hadir"></span>
                                    </div>
                                    <div class="bg-amber-50 text-amber-800 py-1 px-1 rounded-lg">
                                        <span class="block text-[9px] font-semibold text-amber-600 uppercase">Izin</span>
                                        <span class="text-xs font-extrabold" x-text="getAttendanceStats(s.nama).izin"></span>
                                    </div>
                                    <div class="bg-blue-50 text-blue-800 py-1 px-1 rounded-lg">
                                        <span class="block text-[9px] font-semibold text-blue-600 uppercase">Sakit</span>
                                        <span class="text-xs font-extrabold" x-text="getAttendanceStats(s.nama).sakit"></span>
                                    </div>
                                    <div class="bg-rose-50 text-rose-800 py-1 px-1 rounded-lg">
                                        <span class="block text-[9px] font-semibold text-rose-600 uppercase">Alpa</span>
                                        <span class="text-xs font-extrabold" x-text="getAttendanceStats(s.nama).alpa"></span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

    function compressImage(file, maxWidth = 800, quality = 0.8) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/webp', quality);
                    fetch(dataUrl)
                        .then(res => res.blob())
                        .then(blob => {
                            const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, ".webp"), {
                                type: 'image/webp',
                                lastModified: Date.now()
                            });
                            resolve(compressedFile);
                        })
                        .catch(err => reject(err));
                };
                img.onerror = error => reject(error);
            };
            reader.onerror = error => reject(error);
        });
    }

            async processAbsensi(santriId, statusOrItemId) {
                if (!statusOrItemId) return;
                let santri = this.santriList.find(s => s.id === santriId);
                if (!santri) return;

                let poinAdd = 0;
                let labelStatus = '';

                if (statusOrItemId === 'Hadir') {
                    poinAdd = parseInt(this.attendanceConfig.hadir) || 0;
                    labelStatus = `Hadir (${poinAdd >= 0 ? '+' + poinAdd : poinAdd})`;
                } else if (statusOrItemId === 'Alpa') {
                    poinAdd = parseInt(this.attendanceConfig.alpa) || 0;
                    labelStatus = `Alpa (${poinAdd >= 0 ? '+' + poinAdd : poinAdd})`;
                } else if (statusOrItemId === 'Izin') {
                    poinAdd = parseInt(this.attendanceConfig.izin) || 0;
                    labelStatus = `Izin (${poinAdd >= 0 ? '+' + poinAdd : poinAdd})`;
                } else if (statusOrItemId === 'Sakit') {
                    poinAdd = parseInt(this.attendanceConfig.sakit) || 0;
                    labelStatus = `Sakit (${poinAdd >= 0 ? '+' + poinAdd : poinAdd})`;
                } else {
                    let pointItem = this.pointItems.find(pi => pi.id == statusOrItemId);
                    if (pointItem) {
                        poinAdd = parseInt(pointItem.poin);
                        labelStatus = pointItem.nama;
                    }
                }

                let newPoin = (santri.poin || 0) + poinAdd;
                await supabaseClient.from('santri').update({ poin: newPoin }).eq('id', santriId);
                await supabaseClient.from('attendance_logs').insert([{ santri_nama: santri.nama, status: labelStatus, poin: poinAdd, tanggal: new Date().toLocaleDateString() }]);
                this.showToast(`Absensi "${labelStatus}" dicatat untuk ${santri.nama}.`);
                this.loadInitialData();
            },

            async openExchangeModal(reward) {
                let santriName = prompt('Masukkan Nama Santri yang akan menukar:');
                if (!santriName) return;
                let santri = this.santriList.find(s => s.nama.toLowerCase() === santriName.toLowerCase());
                if (!santri) {
                    this.showToast('Santri tidak ditemukan!');
                    return;
                }
                if (santri.poin < reward.poin) {
                    this.showToast(`Poin tidak cukup! Poin saat ini ${santri.poin}, butuh ${reward.poin}.`);
                    return;
                }
                if (reward.stok <= 0) {
                    this.showToast('Stok hadiah habis!');
                    return;
                }

                await supabaseClient.from('santri').update({ poin: santri.poin - reward.poin }).eq('id', santri.id);
                await supabaseClient.from('rewards').update({ stok: reward.stok - 1 }).eq('id', reward.id);

                await supabaseClient.from('notifications').insert([{
                    pesan: `Santri ${santri.nama} menukar reward ${reward.nama} (${reward.poin} poin).`,
                    tipe: 'approval',
                    validated: this.currentUser.role === 'admin',
                    waktu: new Date().toLocaleString()
                }]);

                this.showToast('Penukaran reward berhasil diproses!');
                this.loadInitialData();
            },

            async processCashExchange() {
                if (!this.cashExchange.santriId || !this.cashExchange.nominal) {
                    this.showToast('Pilih santri dan nominal penukaran uang!');
                    return;
                }
                let santri = this.santriList.find(s => s.id == this.cashExchange.santriId);
                let nominal = parseInt(this.cashExchange.nominal);

                if (nominal < 1000 || nominal % 1000 !== 0) {
                    this.showToast('Minimal Rp 1.000 dan harus kelipatan 1.000!');
                    return;
                }
                if (santri.poin < nominal) {
                    this.showToast(`Poin tidak cukup! Poin santri ${santri.poin}.`);
                    return;
                }

                await supabaseClient.from('santri').update({ poin: santri.poin - nominal }).eq('id', santri.id);
                this.showToast(`Berhasil menukar poin senilai Rp ${nominal.toLocaleString('id-ID')}`);
                this.cashExchange = { santriId: '', nominal: 1000 };
                this.loadInitialData();
            },

            openNotificationModal() {
                this.isNotificationModalOpen = true;
                this.unreadNotificationCount = 0;
            },

                this.isNotificationModalOpen = false;
            },

            async approveRedemption(notif) {
                await supabaseClient.from('notifications').update({ validated: true }).eq('id', notif.id);
                this.showToast('Penukaran berhasil divalidasi.');
                this.loadInitialData();
            },

            exportAbsensiPDF() {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.text(`Rekapitulasi Absensi & Poin - ${this.instansi.nama || 'Pondok Pesantren'}`, 14, 15);
                let rows = this.santriList.map((s, index) => {
                    let stats = this.getAttendanceStats(s.nama);
                    return [index + 1, s.nama, s.kelompok || '-', stats.hadir, stats.izin, stats.sakit, stats.alpa, s.poin];
                });
                doc.autoTable({
                    head: [['No', 'Nama Santri', 'Kelompok', 'Hadir', 'Izin', 'Sakit', 'Alpa', 'Total Poin']],
                    body: rows,
                    startY: 20,
                });
                doc.save("rekap-absensi-poin-santri.pdf");
                this.showToast('File PDF rekap berhasil diunduh!');
            }
        }
