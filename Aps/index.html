<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>USAHA JAHIT ABAH / Sistem Manajemen Santri</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- jsPDF untuk Ekspor PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; color: #1c1e21; }
        [x-cloak] { display: none !important; }
        /* Custom Mobile Shell */
        .mobile-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body x-data="appState()" x-init="initApp()" class="antialiased">

<div class="mobile-container" x-cloak>

    <!-- 1. SPLASH SCREEN DENGAN ANIMASI -->
    <div x-show="showSplash" 
         x-transition:leave="transition ease-in duration-500"
         x-transition:leave-start="opacity-100 transform scale-100"
         x-transition:leave-end="opacity-0 transform scale-110"
         class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-800 text-white p-6 max-w-[480px] mx-auto">
        <div class="animate-bounce mb-6">
            <div class="w-28 h-28 bg-white/10 backdrop-blur-md rounded-full flex items-center justify-center border-4 border-white/20 shadow-2xl overflow-hidden">
                <template x-if="instansi.logo">
                    <img :src="instansi.logo" alt="Logo" class="w-full h-full object-cover">
                </template>
                <template x-if="!instansi.logo">
                    <i class="fa-solid fa-graduation-cap text-5xl text-white"></i>
                </template>
            </div>
        </div>
        <h1 class="text-2xl font-bold tracking-wide text-center mb-2" x-text="instansi.nama || 'USAHA JAHIT ABAH'"></h1>
        <p class="text-blue-200 text-sm text-center mb-8">Sistem Informasi Manajemen Santri & Reward Terpadu</p>
        <div class="w-48 h-1.5 bg-white/20 rounded-full overflow-hidden">
            <div class="h-full bg-white animate-pulse w-3/4 rounded-full"></div>
        </div>
    </div>

    <!-- 2. HALAMAN LOGIN -->
    <template x-if="!isLoggedIn">
        <div class="flex-1 flex flex-col justify-center px-6 py-12 bg-gradient-to-b from-blue-50 to-white">
            <div class="text-center mb-8">
                <div class="w-20 h-20 mx-auto mb-4 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg text-white overflow-hidden">
                    <template x-if="instansi.logo">
                        <img :src="instansi.logo" alt="Logo" class="w-full h-full object-cover">
                    </template>
                    <template x-if="!instansi.logo">
                        <i class="fa-solid fa-mosque text-3xl"></i>
                    </template>
                </div>
                <h2 class="text-xl font-bold text-gray-800" x-text="instansi.nama || 'Pondok Pesantren / Instansi'"></h2>
                <p class="text-xs text-gray-500 mt-1">Silakan masuk untuk mengakses sistem</p>
            </div>

            <form @submit.prevent="handleLogin" class="space-y-4 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Username / ID Pengguna</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fa-solid fa-user"></i></span>
                        <input type="text" x-model="loginForm.username" required placeholder="Masukkan username" 
                               class="w-full pl-10 pr-4 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" x-model="loginForm.password" required placeholder="Masukkan password" 
                               class="w-full pl-10 pr-4 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm shadow-md transition">
                    Masuk Aplikasi <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </form>
        </div>
    </template>

    <!-- 3. HALAMAN UTAMA APLIKASI (SETELAH LOGIN) -->
    <template x-if="isLoggedIn">
        <div class="flex-1 flex flex-col pb-16">
            
            <!-- HEADER ALA FACEBOOK SELULER -->
            <header class="sticky top-0 z-40 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between shadow-xs">
                <div class="flex items-center space-x-2">
                    <div class="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-sm overflow-hidden">
                        <template x-if="instansi.logo">
                            <img :src="instansi.logo" alt="Logo" class="w-full h-full object-cover">
                        </template>
                        <template x-if="!instansi.logo">
                            <i class="fa-solid fa-mosque"></i>
                        </template>
                    </div>
                    <div>
                        <h1 class="text-sm font-bold text-gray-900 leading-tight" x-text="instansi.nama || 'USAHA JAHIT ABAH'"></h1>
                        <span class="text-[10px] text-gray-500 capitalize" x-text="currentUser.role + ' (' + currentUser.username + ')'"></span>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <!-- Tombol Notifikasi -->
                    <button @click="openNotificationModal()" class="relative p-2 text-gray-600 hover:bg-gray-100 rounded-full transition">
                        <i class="fa-solid fa-bell text-lg"></i>
                        <template x-if="unreadNotificationCount > 0">
                            <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white animate-pulse"></span>
                        </template>
                    </button>
                    <!-- Tombol Logout -->
                    <button @click="logout()" class="p-2 text-red-600 hover:bg-red-50 rounded-full transition" title="Keluar">
                        <i class="fa-solid fa-power-off text-lg"></i>
                    </button>
                </div>
            </header>

            <!-- NAVIGASI UTAMA ALA FACEBOOK SELULER (TAB BAR ATAS) -->
            <nav class="bg-white border-b border-gray-200 flex justify-around sticky top-[53px] z-30 shadow-xs">
                <template x-for="tab in availableTabs">
                    <button @click="activeTab = tab.id" 
                            :class="activeTab === tab.id ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-500 hover:text-gray-700'"
                            class="flex-1 py-3 text-center transition flex flex-col items-center justify-center">
                        <i :class="tab.icon" class="text-lg mb-0.5"></i>
                        <span class="text-[10px] font-medium" x-text="tab.label"></span>
                    </button>
                </template>
            </nav>

            <!-- KONTEN UTAMA BERDASARKAN TAB -->
            <main class="flex-1 p-4 space-y-4">

                <!-- TAB 1: DASBOR & LEADERBOARD -->
                <div x-show="activeTab === 'dashboard'" class="space-y-4">
                    <!-- Jam & Tanggal Realtime -->
                    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-4 text-white shadow-md flex justify-between items-center">
                        <div>
                            <p class="text-xs text-blue-200 font-medium">Waktu Real-Time</p>
                            <h2 class="text-2xl font-bold tracking-wider" x-text="currentTime"></h2>
                            <p class="text-xs text-blue-100 mt-0.5" x-text="currentDate"></p>
                        </div>
                        <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center backdrop-blur-sm">
                            <i class="fa-solid fa-clock text-2xl text-blue-200"></i>
                        </div>
                    </div>

                    <!-- Statistik Singkat -->
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-xs">
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-xs text-gray-500 font-medium">Total Santri</span>
                                <i class="fa-solid fa-users text-blue-600 bg-blue-50 p-2 rounded-xl text-xs"></i>
                            </div>
                            <h3 class="text-xl font-bold text-gray-800" x-text="santriList.length"></h3>
                        </div>
                        <div class="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-xs">
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-xs text-gray-500 font-medium">Reward Tersedia</span>
                                <i class="fa-solid fa-gift text-emerald-600 bg-emerald-50 p-2 rounded-xl text-xs"></i>
                            </div>
                            <h3 class="text-xl font-bold text-gray-800" x-text="rewardList.length"></h3>
                        </div>
                    </div>

                    <!-- Leaderboard -->
                    <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-xs">
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="text-sm font-bold text-gray-800 flex items-center">
                                <i class="fa-solid fa-trophy text-amber-500 mr-2"></i> Papan Peringkat Santri
                            </h3>
                            <span class="text-[10px] bg-amber-50 text-amber-700 px-2 py-0.5 rounded-full font-semibold">Poin & Hafalan</span>
                        </div>
                        <div class="space-y-2.5">
                            <template x-for="(s, index) in sortedSantriLeaderboard" :key="s.id">
                                <div class="flex items-center justify-between p-2.5 bg-gray-50 rounded-xl border border-gray-100">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold"
                                             :class="index === 0 ? 'bg-amber-400 text-white' : (index === 1 ? 'bg-gray-300 text-white' : (index === 2 ? 'bg-amber-700 text-white' : 'bg-gray-200 text-gray-600'))"
                                             x-text="index + 1">
                                        </div>
                                        <div>
                                            <h4 class="text-xs font-bold text-gray-800" x-text="s.nama"></h4>
                                            <span class="text-[10px] text-gray-500" x-text="'Hafalan: ' + (s.hafalan || '-')"></span>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-xs font-bold text-blue-600" x-text="s.poin + ' Poin'"></span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- TAB 2: DATA SANTRI -->
                <div x-show="activeTab === 'santri'" class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-sm font-bold text-gray-800">Manajemen Data Santri</h3>
                        <button @click="openSantriModal()" class="px-3 py-1.5 bg-blue-600 text-white rounded-xl text-xs font-semibold shadow-sm hover:bg-blue-700 transition">
                            <i class="fa-solid fa-plus mr-1"></i> Tambah Santri
                        </button>
                    </div>

                    <!-- Search Bar -->
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fa-solid fa-search"></i></span>
                        <input type="text" x-model="santriSearch" placeholder="Cari nama santri..." 
                               class="w-full pl-9 pr-4 py-2 text-xs bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <!-- Daftar Santri -->
                    <div class="space-y-2.5">
                        <template x-for="s in filteredSantri" :key="s.id">
                            <div class="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-xs flex justify-between items-center">
                                <div>
                                    <h4 class="text-xs font-bold text-gray-800" x-text="s.nama"></h4>
                                    <p class="text-[10px] text-gray-500 mt-0.5" x-text="'Hafalan: ' + (s.hafalan || 'Belum ada data')"></p>
                                    <div class="mt-1 flex items-center space-x-2">
                                        <span class="px-2 py-0.5 bg-blue-50 text-blue-700 rounded-md text-[10px] font-semibold" x-text="s.poin + ' Poin'"></span>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-1">
                                    <button @click="editSantri(s)" class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition" title="Edit">
                                        <i class="fa-solid fa-pen-to-square text-xs"></i>
                                    </button>
                                    <button @click="deleteSantri(s.id)" class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition" title="Hapus">
                                        <i class="fa-solid fa-trash text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- TAB 3: ABSENSI & POIN -->
                <div x-show="activeTab === 'absensi'" class="space-y-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="text-sm font-bold text-gray-800">Modul Absensi & Poin</h3>
                            <p class="text-[10px] text-gray-500">Kehadiran otomatis bernilai 25 poin</p>
                        </div>
                        <button @click="exportAbsensiPDF()" class="px-3 py-1.5 bg-emerald-600 text-white rounded-xl text-xs font-semibold shadow-sm hover:bg-emerald-700 transition">
                            <i class="fa-solid fa-file-pdf mr-1"></i> Rekap PDF
                        </button>
                    </div>

                    <!-- Input Item Penilaian & Jenis Poin -->
                    <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-xs space-y-3">
                        <h4 class="text-xs font-bold text-gray-800">Pengaturan Item Penilaian Poin</h4>
                        <div class="grid grid-cols-3 gap-2">
                            <input type="text" x-model="newPointItem.nama" placeholder="Nama Kategori" class="px-3 py-1.5 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none">
                            <input type="number" x-model="newPointItem.poin" placeholder="Jumlah Poin" class="px-3 py-1.5 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none">
                            <button @click="savePointItem()" class="bg-blue-600 text-white rounded-xl text-xs font-semibold py-1.5 hover:bg-blue-700 transition">Simpan Item</button>
                        </div>
                        <!-- Daftar Item Penilaian -->
                        <div class="space-y-1.5 mt-2">
                            <template x-for="item in pointItems" :key="item.id">
                                <div class="flex justify-between items-center bg-gray-50 px-3 py-1.5 rounded-xl border border-gray-100 text-xs">
                                    <span class="font-medium text-gray-700" x-text="item.nama + ' (' + (item.poin > 0 ? '+' + item.poin : item.poin) + ' Poin)'"></span>
                                    <button @click="deletePointItem(item.id)" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash text-[10px]"></i></button>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Absensi Harian Santri -->
                    <div class="space-y-2.5">
                        <template x-for="s in santriList" :key="s.id">
                            <div class="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-xs flex items-center justify-between">
                                <div>
                                    <h4 class="text-xs font-bold text-gray-800" x-text="s.nama"></h4>
                                    <span class="text-[10px] text-gray-500" x-text="'Poin saat ini: ' + s.poin"></span>
                                </div>
                                <div class="flex items-center space-x-1.5">
                                    <select @change="processAbsensi(s.id, $event.target.value)" class="text-xs bg-gray-50 border border-gray-200 rounded-xl px-2 py-1 focus:outline-none">
                                        <option value="">Pilih Status</option>
                                        <option value="Hadir">Hadir (+25)</option>
                                        <option value="Izin">Izin (0)</option>
                                        <option value="Sakit">Sakit (0)</option>
                                        <option value="Alpa">Alpa (-10)</option>
                                    </select>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- TAB 4: KATALOG REWARD & PENUKARAN -->
                <div x-show="activeTab === 'reward'" class="space-y-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="text-sm font-bold text-gray-800">Katalog Hadiah & Reward</h3>
                            <p class="text-[10px] text-gray-500">Tukar poin dengan barang atau uang tunai</p>
                        </div>
                        <template x-if="currentUser.role === 'admin'">
                            <button @click="openRewardModal()" class="px-3 py-1.5 bg-blue-600 text-white rounded-xl text-xs font-semibold shadow-sm hover:bg-blue-700 transition">
                                <i class="fa-solid fa-plus mr-1"></i> Tambah Hadiah
                            </button>
                        </template>
                    </div>

                    <!-- Konversi Poin ke Uang Tunai -->
                    <div class="bg-gradient-to-br from-amber-50 to-orange-50 p-4 rounded-2xl border border-amber-200 shadow-xs space-y-3">
                        <h4 class="text-xs font-bold text-amber-800 flex items-center">
                            <i class="fa-solid fa-money-bill-wave mr-1.5"></i> Konversi Poin ke Uang Tunai (1 Poin = Rp 1)
                        </h4>
                        <div class="grid grid-cols-2 gap-2">
                            <select x-model="cashExchange.santriId" class="text-xs bg-white border border-amber-200 rounded-xl px-3 py-1.5 focus:outline-none">
                                <option value="">Pilih Santri</option>
                                <template x-for="s in santriList" :key="s.id">
                                    <option :value="s.id" x-text="s.nama + ' (' + s.poin + ' Poin)'"></option>
                                </template>
                            </select>
                            <input type="number" x-model="cashExchange.nominal" step="1000" min="1000" placeholder="Nominal (Min. Rp 1.000)" class="text-xs bg-white border border-amber-200 rounded-xl px-3 py-1.5 focus:outline-none">
                        </div>
                        <button @click="processCashExchange()" class="w-full py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-semibold shadow-xs transition">
                            Tukar Poin ke Uang Tunai
                        </button>
                    </div>

                    <!-- Katalog Barang ala Shopee -->
                    <div class="grid grid-cols-2 gap-3">
                        <template x-for="r in rewardList" :key="r.id">
                            <div class="bg-white rounded-2xl border border-gray-100 shadow-xs overflow-hidden flex flex-col justify-between">
                                <div>
                                    <div class="w-full h-32 bg-gray-100 relative">
                                        <template x-if="r.foto">
                                            <img :src="r.foto" alt="Reward" class="w-full h-full object-cover">
                                        </template>
                                        <template x-if="!r.foto">
                                            <div class="w-full h-full flex items-center justify-center text-gray-400">
                                                <i class="fa-solid fa-gift text-2xl"></i>
                                            </div>
                                        </template>
                                        <!-- Indikator Stok Menipis -->
                                        <template x-if="r.stok <= 2">
                                            <span class="absolute top-2 right-2 bg-red-500 text-white text-[9px] font-bold px-2 py-0.5 rounded-full shadow-sm">Stok Menipis</span>
                                        </template>
                                    </div>
                                    <div class="p-3">
                                        <h4 class="text-xs font-bold text-gray-800 line-clamp-1" x-text="r.nama"></h4>
                                        <p class="text-[10px] text-blue-600 font-semibold mt-0.5" x-text="r.poin + ' Poin'"></p>
                                        <p class="text-[10px] text-gray-500 mt-0.5" x-text="'Stok: ' + r.stok"></p>
                                    </div>
                                </div>
                                <div class="p-3 pt-0 space-y-1.5">
                                    <button @click="openExchangeModal(r)" class="w-full py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-[11px] font-semibold transition">
                                        Tukar
                                    </button>
                                    <template x-if="currentUser.role === 'admin'">
                                        <div class="flex space-x-1">
                                            <button @click="editReward(r)" class="flex-1 py-1 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-[10px] font-medium">Edit</button>
                                            <button @click="deleteReward(r.id)" class="flex-1 py-1 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-[10px] font-medium">Hapus</button>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- TAB 5: PENGATURAN ADMIN -->
                <div x-show="activeTab === 'settings' && currentUser.role === 'admin'" class="space-y-4">
                    <h3 class="text-sm font-bold text-gray-800">Panel Admin & Pengaturan</h3>

                    <!-- Profil Instansi & Upload Logo Resolusi Tinggi -->
                    <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-xs space-y-3">
                        <h4 class="text-xs font-bold text-gray-800">Profil Instansi & Logo</h4>
                        <div>
                            <label class="block text-[10px] font-semibold text-gray-600 mb-1">Nama Instansi / Pondok Pesantren</label>
                            <input type="text" x-model="instansi.nama" class="w-full px-3 py-1.5 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] font-semibold text-gray-600 mb-1">Upload Logo (Resolusi Tinggi)</label>
                            <input type="file" @change="uploadLogo($event)" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                        </div>
                        <button @click="saveInstansi()" class="w-full py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold shadow-sm hover:bg-blue-700 transition">Simpan Perubahan</button>
                    </div>

                    <!-- Manajemen Staf / Guru & Hak Akses -->
                    <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-xs space-y-3">
                        <h4 class="text-xs font-bold text-gray-800">Tambah Akun Guru & Hak Akses</h4>
                        <input type="text" x-model="newGuru.username" placeholder="Username Guru" class="w-full px-3 py-1.5 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none">
                        <input type="password" x-model="newGuru.password" placeholder="Password Guru" class="w-full px-3 py-1.5 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none">
                        
                        <div class="space-y-1.5 pt-1">
                            <span class="block text-[10px] font-semibold text-gray-600">Hak Akses Guru:</span>
                            <label class="flex items-center text-xs space-x-2"><input type="checkbox" x-model="newGuru.permissions.absensi" class="rounded text-blue-600"><span>Catat Absensi Harian</span></label>
                            <label class="flex items-center text-xs space-x-2"><input type="checkbox" x-model="newGuru.permissions.poin" class="rounded text-blue-600"><span>Kelola Poin Prestasi & Pelanggaran</span></label>
                            <label class="flex items-center text-xs space-x-2"><input type="checkbox" x-model="newGuru.permissions.santri" class="rounded text-blue-600"><span>Lihat Data Santri</span></label>
                            <label class="flex items-center text-xs space-x-2"><input type="checkbox" x-model="newGuru.permissions.laporan" class="rounded text-blue-600"><span>Akses Laporan Bulanan</span></label>
                            <label class="flex items-center text-xs space-x-2"><input type="checkbox" x-model="newGuru.permissions.reward" class="rounded text-blue-600"><span>Validasi Penukaran Reward</span></label>
                        </div>
                        <button @click="saveGuru()" class="w-full py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold shadow-sm hover:bg-emerald-700 transition">Tambah Akun Guru</button>
                    </div>
                </div>

            </main>

            <!-- NAVIGASI BAWAH (MOBILE TAB BAR) -->
            <nav class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-white border-t border-gray-200 flex justify-around py-2 z-40 shadow-lg">
                <template x-for="tab in availableTabs">
                    <button @click="activeTab = tab.id" 
                            :class="activeTab === tab.id ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'"
                            class="flex flex-col items-center flex-1 transition">
                        <i :class="tab.icon" class="text-base mb-0.5"></i>
                        <span class="text-[9px] font-medium" x-text="tab.label"></span>
                    </button>
                </template>
            </nav>

        </div>
    </template>

    <!-- MODAL NOTIFIKASI & VALIDASI -->
    <div x-show="isNotificationModalOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-xl">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-gray-800">Notifikasi & Validasi</h3>
                <button @click="closeNotificationModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-2 max-h-60 overflow-y-auto">
                <template x-for="notif in notifications" :key="notif.id">
                    <div class="p-3 bg-gray-50 rounded-xl border border-gray-100 text-xs space-y-1">
                        <p class="font-semibold text-gray-800" x-text="notif.pesan"></p>
                        <span class="text-[10px] text-gray-400" x-text="notif.waktu"></span>
                        <template x-if="notif.tipe === 'approval' && currentUser.role === 'admin' && !notif.validated">
                            <div class="pt-2 flex space-x-2">
                                <button @click="approveRedemption(notif)" class="px-3 py-1 bg-emerald-600 text-white rounded-lg text-[10px] font-semibold">Validasi / Setujui</button>
                            </div>
                        </template>
                    </div>
                </template>
                <template x-if="notifications.length === 0">
                    <p class="text-xs text-gray-400 text-center py-4">Tidak ada notifikasi saat ini.</p>
                </template>
            </div>
        </div>
    </div>

    <!-- MODAL TAMBAH/EDIT SANTRI -->
    <div x-show="isSantriModalOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-xl">
            <h3 class="text-sm font-bold text-gray-800" x-text="santriForm.id ? 'Edit Santri' : 'Tambah Santri Baru'"></h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-[10px] font-semibold text-gray-600 mb-1">Nama Lengkap Santri</label>
                    <input type="text" x-model="santriForm.nama" placeholder="Nama santri" class="w-full px-3 py-2 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-gray-600 mb-1">Jumlah Hafalan Al-Qur'an</label>
                    <input type="text" x-model="santriForm.hafalan" placeholder="Contoh: 3 Juz / Surah Al-Baqarah" class="w-full px-3 py-2 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-gray-600 mb-1">Poin Awal</label>
                    <input type="number" x-model="santriForm.poin" placeholder="0" class="w-full px-3 py-2 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none">
                </div>
            </div>
            <div class="flex space-x-2 pt-2">
                <button @click="isSantriModalOpen = false" class="flex-1 py-2 bg-gray-100 text-gray-700 rounded-xl text-xs font-semibold">Batal</button>
                <button @click="saveSantri()" class="flex-1 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold">Simpan</button>
            </div>
        </div>
    </div>

    <!-- MODAL TAMBAH/EDIT REWARD -->
    <div x-show="isRewardModalOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-xl">
            <h3 class="text-sm font-bold text-gray-800" x-text="rewardForm.id ? 'Edit Hadiah' : 'Tambah Hadiah Baru'"></h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-[10px] font-semibold text-gray-600 mb-1">Nama Hadiah</label>
                    <input type="text" x-model="rewardForm.nama" placeholder="Nama hadiah" class="w-full px-3 py-2 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-gray-600 mb-1">Jumlah Poin</label>
                    <input type="number" x-model="rewardForm.poin" placeholder="Poin diperlukan" class="w-full px-3 py-2 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-gray-600 mb-1">Stok Barang</label>
                    <input type="number" x-model="rewardForm.stok" placeholder="Jumlah stok" class="w-full px-3 py-2 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-gray-600 mb-1">Foto Hadiah (Upload)</label>
                    <input type="file" @change="uploadRewardFoto($event)" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700">
                </div>
            </div>
            <div class="flex space-x-2 pt-2">
                <button @click="isRewardModalOpen = false" class="flex-1 py-2 bg-gray-100 text-gray-700 rounded-xl text-xs font-semibold">Batal</button>
                <button @click="saveReward()" class="flex-1 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold">Simpan</button>
            </div>
        </div>
    </div>

</div>

<!-- SCRIPT LOGIKA APLIKASI & SUPABASE -->
<script>
    const SUPABASE_URL = 'https://spdxllweqvidceuoyvml.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_WXK59k6bZF1Knp5B6Edgwg_-nsQiKcw.';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function appState() {
        return {
            showSplash: true,
            isLoggedIn: false,
            activeTab: 'dashboard',
            currentTime: '',
            currentDate: '',
            
            loginForm: { username: '', password: '' },
            currentUser: { username: '', role: 'admin', permissions: {} },
            
            instansi: { nama: 'USAHA JAHIT ABAH', logo: '' },
            
            santriList: [],
            santriSearch: '',
            santriForm: { id: null, nama: '', hafalan: '', poin: 0 },
            isSantriModalOpen: false,

            rewardList: [],
            rewardForm: { id: null, nama: '', poin: 0, stok: 0, foto: '' },
            isRewardModalOpen: false,

            pointItems: [],
            newPointItem: { nama: '', poin: 0 },

            cashExchange: { santriId: '', nominal: 1000 },
            
            notifications: [],
            isNotificationModalOpen: false,
            unreadNotificationCount: 0,

            newGuru: { username: '', password: '', permissions: { absensi: true, poin: true, santri: true, laporan: false, reward: false } },

            initApp() {
                setTimeout(() => { this.showSplash = false; }, 2000);
                this.updateClock();
                setInterval(() => this.updateClock(), 1000);
                this.loadInitialData();
                this.setupRealtimeSync();
            },

            updateClock() {
                const now = new Date();
                this.currentTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                this.currentDate = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            },

            async loadInitialData() {
                // Fetch Santri
                let { data: santri } = await supabaseClient.from('santri').select('*');
                if (santri) this.santriList = santri;

                // Fetch Rewards
                let { data: rewards } = await supabaseClient.from('rewards').select('*');
                if (rewards) this.rewardList = rewards;

                // Fetch Point Items
                let { data: points } = await supabaseClient.from('point_items').select('*');
                if (points) this.pointItems = points;

                // Fetch Instansi
                let { data: inst } = await supabaseClient.from('instansi').select('*').single();
                if (inst) this.instansi = inst;

                this.checkLowStockNotifications();
            },

            setupRealtimeSync() {
                supabaseClient.channel('public:all')
                    .on('postgres_changes', { event: '*', schema: 'public' }, payload => {
                        this.loadInitialData();
                    })
                    .subscribe();
            },

            handleLogin() {
                if (this.loginForm.username === 'admin' && this.loginForm.password === 'admin123') {
                    this.currentUser = { username: 'admin', role: 'admin', permissions: { absensi: true, poin: true, santri: true, laporan: true, reward: true } };
                    this.isLoggedIn = true;
                } else {
                    // Cek database guru/staf jika ada
                    alert('Username atau Password salah!');
                }
            },

            logout() {
                this.isLoggedIn = false;
                this.loginForm = { username: '', password: '' };
            },

            get availableTabs() {
                let tabs = [{ id: 'dashboard', label: 'Dasbor', icon: 'fa-solid fa-house' }];
                if (this.currentUser.role === 'admin' || this.currentUser.permissions.santri) {
                    tabs.push({ id: 'santri', label: 'Santri', icon: 'fa-solid fa-users' });
                }
                if (this.currentUser.role === 'admin' || this.currentUser.permissions.absensi) {
                    tabs.push({ id: 'absensi', label: 'Absensi', icon: 'fa-solid fa-clipboard-user' });
                }
                tabs.push({ id: 'reward', label: 'Reward', icon: 'fa-solid fa-gift' });
                if (this.currentUser.role === 'admin') {
                    tabs.push({ id: 'settings', label: 'Pengaturan', icon: 'fa-solid fa-gear' });
                }
                return tabs;
            },

            get sortedSantriLeaderboard() {
                return [...this.santriList].sort((a, b) => b.poin - a.poin);
            },

            get filteredSantri() {
                if (!this.santriSearch) return this.santriList;
                return this.santriList.filter(s => s.nama.toLowerCase().includes(this.santriSearch.toLowerCase()));
            },

            async saveSantri() {
                if (this.santriForm.id) {
                    await supabaseClient.from('santri').update({ nama: this.santriForm.nama, hafalan: this.santriForm.hafalan, poin: parseInt(this.santriForm.poin) }).eq('id', this.santriForm.id);
                } else {
                    await supabaseClient.from('santri').insert([{ nama: this.santriForm.nama, hafalan: this.santriForm.hafalan, poin: parseInt(this.santriForm.poin) }]);
                }
                this.isSantriModalOpen = false;
                this.loadInitialData();
            },

            openSantriModal() {
                this.santriForm = { id: null, nama: '', hafalan: '', poin: 0 };
                this.isSantriModalOpen = true;
            },

            editSantri(s) {
                this.santriForm = { ...s };
                this.isSantriModalOpen = true;
            },

            async deleteSantri(id) {
                if (confirm('Hapus data santri ini?')) {
                    await supabaseClient.from('santri').delete().eq('id', id);
                    this.loadInitialData();
                }
            },

            async processAbsensi(santriId, status) {
                if (!status) return;
                let poinAdd = 0;
                if (status === 'Hadir') poinAdd = 25;
                if (status === 'Alpa') poinAdd = -10;

                let santri = this.santriList.find(s => s.id === santriId);
                if (santri) {
                    let newPoin = santri.poin + poinAdd;
                    await supabaseClient.from('santri').update({ poin: newPoin }).eq('id', santriId);
                    alert(`Absensi ${status} dicatat. Poin diperbarui (${poinAdd >= 0 ? '+' + poinAdd : poinAdd})`);
                    this.loadInitialData();
                }
            },

            async savePointItem() {
                if (!this.newPointItem.nama) return;
                await supabaseClient.from('point_items').insert([this.newPointItem]);
                this.newPointItem = { nama: '', poin: 0 };
                this.loadInitialData();
            },

            async deletePointItem(id) {
                await supabaseClient.from('point_items').delete().eq('id', id);
                this.loadInitialData();
            },

            async saveReward() {
                if (this.rewardForm.id) {
                    await supabaseClient.from('rewards').update({ nama: this.rewardForm.nama, poin: parseInt(this.rewardForm.poin), stok: parseInt(this.rewardForm.stok), foto: this.rewardForm.foto }).eq('id', this.rewardForm.id);
                } else {
                    await supabaseClient.from('rewards').insert([{ nama: this.rewardForm.nama, poin: parseInt(this.rewardForm.poin), stok: parseInt(this.rewardForm.stok), foto: this.rewardForm.foto }]);
                }
                this.isRewardModalOpen = false;
                this.loadInitialData();
            },

            openRewardModal() {
                this.rewardForm = { id: null, nama: '', poin: 0, stok: 0, foto: '' };
                this.isRewardModalOpen = true;
            },

            editReward(r) {
                this.rewardForm = { ...r };
                this.isRewardModalOpen = true;
            },

            async deleteReward(id) {
                if (confirm('Hapus reward ini?')) {
                    await supabaseClient.from('rewards').delete().eq('id', id);
                    this.loadInitialData();
                }
            },

            async uploadRewardFoto(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => { this.rewardForm.foto = e.target.result; };
                    reader.readAsDataURL(file);
                }
            },

            async uploadLogo(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => { this.instansi.logo = e.target.result; };
                    reader.readAsDataURL(file);
                }
            },

            async saveInstansi() {
                await supabaseClient.from('instansi').upsert([{ id: 1, nama: this.instansi.nama, logo: this.instansi.logo }]);
                alert('Profil instansi berhasil disimpan!');
                this.loadInitialData();
            },

            async openExchangeModal(reward) {
                let santriName = prompt('Masukkan Nama Santri yang akan menukar:');
                let santri = this.santriList.find(s => s.nama.toLowerCase() === (santriName || '').toLowerCase());
                if (!santri) {
                    alert('Santri tidak ditemukan!');
                    return;
                }
                if (santri.poin < reward.poin) {
                    alert('Poin santri tidak cukup untuk menukar reward ini!');
                    return;
                }
                if (reward.stok <= 0) {
                    alert('Stok hadiah habis!');
                    return;
                }

                // Kurangi poin & stok
                await supabaseClient.from('santri').update({ poin: santri.poin - reward.poin }).eq('id', santri.id);
                await supabaseClient.from('rewards').update({ stok: reward.stok - 1 }).eq('id', reward.id);

                // Tambah notifikasi approval admin
                await supabaseClient.from('notifications').insert([{
                    pesan: `Santri ${santri.nama} menukar reward ${reward.nama} (${reward.poin} poin).`,
                    tipe: 'approval',
                    validated: false,
                    waktu: new Date().toLocaleString()
                }]);

                alert('Penukaran berhasil diajukan / diproses!');
                this.loadInitialData();
            },

            async processCashExchange() {
                if (!this.cashExchange.santriId || !this.cashExchange.nominal) {
                    alert('Pilih santri dan nominal penukaran!');
                    return;
                }
                let santri = this.santriList.find(s => s.id === this.cashExchange.santriId);
                let nominal = parseInt(this.cashExchange.nominal);

                if (nominal < 1000 || nominal % 1000 !== 0) {
                    alert('Minimal penukaran Rp 1.000 dan harus kelipatan 1.000!');
                    return;
                }
                if (santri.poin < nominal) {
                    alert('Poin santri tidak cukup untuk konversi uang tunai ini!');
                    return;
                }

                await supabaseClient.from('santri').update({ poin: santri.poin - nominal }).eq('id', santri.id);
                alert(`Berhasil menukar poin dengan uang tunai senilai Rp ${nominal.toLocaleString('id-ID')}`);
                this.loadInitialData();
            },

            async checkLowStockNotifications() {
                let { data: notifs } = await supabaseClient.from('notifications').select('*');
                if (notifs) {
                    this.notifications = notifs;
                    this.unreadNotificationCount = notifs.filter(n => !n.validated).length;
                }

                // Cek stok menipis
                this.rewardList.forEach(async r => {
                    if (r.stok <= 2) {
                        let exists = this.notifications.some(n => n.pesan.includes(r.nama));
                        if (!exists) {
                            await supabaseClient.from('notifications').insert([{
                                pesan: `Stok reward ${r.nama} menipis (Sisa: ${r.stok})`,
                                tipe: 'stock',
                                validated: true,
                                waktu: new Date().toLocaleString()
                            }]);
                        }
                    }
                });
            },

            openNotificationModal() {
                this.isNotificationModalOpen = true;
                this.unreadNotificationCount = 0;
            },

            closeNotificationModal() {
                this.isNotificationModalOpen = false;
            },

            async approveRedemption(notif) {
                await supabaseClient.from('notifications').update({ validated: true }).eq('id', notif.id);
                alert('Penukaran berhasil divalidasi oleh admin.');
                this.loadInitialData();
            },

            exportAbsensiPDF() {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.text("Rekapitulasi Data Santri & Poin", 14, 15);
                let rows = this.santriList.map((s, index) => [index + 1, s.nama, s.hafalan || '-', s.poin]);
                doc.autoTable({
                    head: [['No', 'Nama Santri', 'Hafalan', 'Total Poin']],
                    body: rows,
                    startY: 20,
                });
                doc.save("rekap-santri-usaha-jahit-abah.pdf");
            }
        }
    }
</script>

</body>
</html>
