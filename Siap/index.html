        function compressImage(file, maxWidth = 900, maxHeight = 900, quality = 0.8) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) {
                                height *= maxWidth / width;
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width *= maxHeight / height;
                                height = maxHeight;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

    <!-- Modal Container -->
    <div id="customModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full p-6 transform transition-all max-h-[90vh] overflow-y-auto">

        </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('loginUsername').value.trim();
            const passwordInput = document.getElementById('loginPassword').value;

            const matchedUser = state.allowedUsers.find(u => u.username === usernameInput);

            if (matchedUser && (passwordInput === 'admin123' || passwordInput === 'password')) {
                state.isLoggedIn = true;
                state.currentUser = { name: matchedUser.name, role: matchedUser.role, username: matchedUser.username };
                saveSession();
                renderView();
            } else if (usernameInput === 'admin' && passwordInput === 'admin123') {
                state.isLoggedIn = true;
                state.currentUser = { name: 'Admin', role: 'Administrator Utama', username: 'admin' };
                saveSession();
                renderView();
            } else {
                showModal('Login Gagal', 'Username atau password salah. Cek kembali data akses staf.', 'error');
            }
        }

        function handleLogout() {
            showConfirm('Konfirmasi Keluar', 'Apakah Anda ingin keluar dari sesi sistem administrasi ini?', () => {
                state.isLoggedIn = false;
                localStorage.removeItem('siap_desa_session');
                renderView();
            });
        }

        function switchTab(tabId) {
            state.activeTab = tabId;
            saveSession();
            renderView();
        }

        function renderView() {
            const wrapper = document.getElementById('appContainer');
            const vName = getVillageName();

            if (!state.isLoggedIn) {
                wrapper.innerHTML = renderLoginView();
                return;
            }

            const getNavClass = (tab) => state.activeTab === tab 
                ? 'flex items-center px-3 py-2.5 rounded-lg transition text-white bg-brand-600 shadow-md' 
                : 'flex items-center px-3 py-2.5 rounded-lg transition text-slate-300 hover:bg-slate-800 hover:text-white';

            const getMobClass = (tab) => state.activeTab === tab 
                ? 'px-3 py-1.5 rounded-lg text-xs font-medium transition bg-brand-600 text-white flex items-center space-x-1.5 shrink-0 shadow' 
                : 'px-3 py-1.5 rounded-lg text-xs font-medium transition text-slate-300 hover:bg-slate-800 flex items-center space-x-1.5 shrink-0';

            wrapper.innerHTML = `
                <div class="flex h-full overflow-hidden flex-col md:flex-row w-full">
                    <!-- SIDEBAR (Desktop) -->
                    <aside class="hidden md:flex w-64 bg-slate-900 text-slate-300 flex-col h-full shadow-xl no-print z-25">

                            </div>
                        </div>

                        <div class="p-3 bg-slate-800/80 m-3 rounded-lg border border-slate-700 flex items-center space-x-2">
                            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                            <div class="overflow-hidden">
                                <p class="text-[11px] font-semibold text-slate-400">Login Sebagai:</p>
                                <p class="text-xs font-bold text-white truncate">${state.currentUser.name}</p>
                            </div>
                        </div>

                        <!-- Navigation Links Desktop -->
                        <nav class="flex-1 px-3 py-2 space-y-1 text-sm font-medium overflow-y-auto">
                            <a href="#" onclick="switchTab('dashboard')" id="nav-dashboard" class="${getNavClass('dashboard')}">
                                <i class="fa-solid fa-chart-pie w-6"></i> Dashboard Utama
                            </a>
                            <a href="#" onclick="switchTab('scan-masuk')" id="nav-scan-masuk" class="${getNavClass('scan-masuk')}">
                                <i class="fa-solid fa-camera-retro w-6 text-emerald-400"></i> Scan & Arsip Surat Masuk
                            </a>
                            <a href="#" onclick="switchTab('layanan')" id="nav-layanan" class="${getNavClass('layanan')}">
                                <i class="fa-solid fa-file-pen w-6"></i> Pembuatan Surat Desa
                            </a>
                            <a href="#" onclick="switchTab('agenda')" id="nav-agenda" class="${getNavClass('agenda')}">
                                <i class="fa-solid fa-book-open w-6"></i> Buku Agenda Surat
                            </a>
                            <a href="#" onclick="switchTab('arsip')" id="nav-arsip" class="${getNavClass('arsip')}">
                                <i class="fa-solid fa-folder-tree w-6"></i> Arsip Digital & Pencarian
                            </a>
                            <a href="#" onclick="switchTab('laporan')" id="nav-laporan" class="${getNavClass('laporan')}">
                                <i class="fa-solid fa-print w-6"></i> Rekapitulasi & Laporan PDF
                            </a>
                            <a href="#" onclick="switchTab('penduduk')" id="nav-penduduk" class="${getNavClass('penduduk')}">
                                <i class="fa-solid fa-users w-6"></i> Data Penduduk
                            </a>
                            <a href="#" onclick="switchTab('pengguna')" id="nav-pengguna" class="${getNavClass('pengguna')}">
                                <i class="fa-solid fa-user-shield w-6"></i> Manajemen Hak Akses
                            </a>
                            <a href="#" onclick="switchTab('pengaturan')" id="nav-pengaturan" class="${getNavClass('pengaturan')}">
                                <i class="fa-solid fa-gears w-6"></i> Pengaturan Desa & Kop
                            </a>
                        </nav>

                        <div class="p-4 border-t border-slate-800 space-y-2">
                            <div class="flex justify-between items-center text-xs text-slate-500">
                                <span id="sidebarFooterVillage">${vName}</span>
                                <span class="bg-brand-900/50 text-brand-400 px-2 py-0.5 rounded font-mono">v1.0</span>

                            <button onclick="handleLogout()" class="w-full bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white text-xs font-semibold py-2 rounded-lg transition flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-right-from-bracket"></i>
                                <span>Keluar Sistem (Logout)</span>
                            </button>
                        </div>
                    </aside>

                    <!-- MAIN CONTAINER -->
                    <main class="flex-1 flex flex-col h-full overflow-hidden">
                        <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 no-print shadow-sm z-10 shrink-0">
                            <div class="flex items-center space-x-3">
                                <h2 id="pageTitle" class="text-lg font-bold text-slate-800 truncate">Dashboard Administrator</h2>
                            </div>
                            <div class="flex items-center space-x-4">
                                <div class="text-right hidden sm:block">
                                    <p class="text-xs font-semibold text-slate-700" id="topNavAdminName">${state.currentUser.name}</p>
                                    <p class="text-[11px] text-slate-500" id="topNavAdminRole">${state.currentUser.role}</p>
                                </div>
                                <button onclick="handleLogout()" class="md:hidden bg-red-100 text-red-600 p-2 rounded-lg text-xs" title="Keluar">
                                    <i class="fa-solid fa-right-from-bracket"></i>
                                </button>
                                <div class="h-9 w-9 bg-brand-500 text-white rounded-full flex items-center justify-center font-bold shadow shrink-0">
                                    <i class="fa-solid fa-user-shield"></i>
                                </div>
                            </div>
                        </header>

                        <!-- MOBILE TOP NAVIGATION BAR -->
                        <div class="md:hidden bg-slate-900 text-white overflow-x-auto flex items-center space-x-1.5 px-3 py-2.5 no-print shrink-0 shadow-md whitespace-nowrap scrollbar-none" id="mobileTabBar">
                            <button onclick="switchTab('dashboard')" id="mob-nav-dashboard" class="${getMobClass('dashboard')}">
                                <i class="fa-solid fa-chart-pie"></i><span>Dashboard</span>
                            </button>
                            <button onclick="switchTab('scan-masuk')" id="mob-nav-scan-masuk" class="${getMobClass('scan-masuk')}">
                                <i class="fa-solid fa-camera-retro text-emerald-400"></i><span>Scan Masuk</span>
                            </button>
                            <button onclick="switchTab('layanan')" id="mob-nav-layanan" class="${getMobClass('layanan')}">
                                <i class="fa-solid fa-file-pen"></i><span>Buat Surat</span>
                            </button>
                            <button onclick="switchTab('agenda')" id="mob-nav-agenda" class="${getMobClass('agenda')}">
                                <i class="fa-solid fa-book-open"></i><span>Agenda</span>
                            </button>
                            <button onclick="switchTab('arsip')" id="mob-nav-arsip" class="${getMobClass('arsip')}">
                                <i class="fa-solid fa-folder-tree"></i><span>Arsip</span>
                            </button>
                            <button onclick="switchTab('laporan')" id="mob-nav-laporan" class="${getMobClass('laporan')}">
                                <i class="fa-solid fa-print"></i><span>Laporan</span>
                            </button>
                            <button onclick="switchTab('penduduk')" id="mob-nav-penduduk" class="${getMobClass('penduduk')}">
                                <i class="fa-solid fa-users"></i><span>Penduduk</span>
                            </button>
                            <button onclick="switchTab('pengguna')" id="mob-nav-pengguna" class="${getMobClass('pengguna')}">
                                <i class="fa-solid fa-user-shield"></i><span>Akses</span>
                            </button>
                            <button onclick="switchTab('pengaturan')" id="mob-nav-pengaturan" class="${getMobClass('pengaturan')}">
                                <i class="fa-solid fa-gears"></i><span>Pengaturan</span>
                            </button>
                        </div>

                        <div id="content-area" class="flex-1 overflow-y-auto p-6 bg-slate-50">
                            <!-- Dynamic Content -->
                        </div>
                    </main>
                </div>
            `;

            renderActiveTabContent();
        }

        function renderLoginView() {
            const vName = getVillageName();
            return `
                <div class="min-h-full flex items-center justify-center p-6 bg-gradient-to-br from-slate-900 via-slate-800 to-brand-950 flex-1">
                    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 space-y-6 border border-slate-200">
                        <div class="text-center space-y-2">
                            <div class="w-16 h-16 bg-brand-600 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl shadow-lg">
                                <i class="fa-solid fa-landmark"></i>
                            </div>
                            <h1 class="text-xl font-black text-slate-900 tracking-tight">SIAP-Desa ${vName}</h1>
                            <p class="text-xs text-slate-500">Sistem Informasi Administrasi Pemerintahan & Arsip Digital</p>
                        </div>

                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Username Administrator:</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" id="loginUsername" required class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 font-mono" placeholder="admin">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Kata Sandi (Password):</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" id="loginPassword" required class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="••••••••">
                                </div>
                            </div>

                            <button type="submit" class="w-full bg-brand-600 text-white font-semibold py-3 rounded-xl shadow-lg hover:bg-brand-700 transition flex items-center justify-center space-x-2 text-sm mt-2">
                                <i class="fa-solid fa-right-to-bracket"></i>
                                <span>Masuk ke Sistem Desa</span>
                            </button>
                        </form>

                        <div class="text-center pt-2 border-t border-slate-100">
                            <p class="text-[11px] text-slate-400">Pemerintah Kabupaten Pohuwato — Kecamatan Paguat</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderActiveTabContent() {
            updateDynamicVillageUI();
            const container = document.getElementById('content-area');
            const titleEl = document.getElementById('pageTitle');
            const vName = getVillageName();

            if(state.activeTab === 'dashboard') {
                if(titleEl) titleEl.innerText = 'Dashboard Utama Desa ' + vName;
                container.innerHTML = renderDashboardView();
            } else if(state.activeTab === 'scan-masuk') {
                if(titleEl) titleEl.innerText = 'Modul Pemindaian & Arsip Surat Masuk Eksternal';
                container.innerHTML = renderScanMasukView();
            } else if(state.activeTab === 'layanan') {
                if(titleEl) titleEl.innerText = 'Modul Pembuatan Surat Keterangan Warga';
                container.innerHTML = renderLayananView();
            } else if(state.activeTab === 'agenda') {
                if(titleEl) titleEl.innerText = 'Buku Agenda Surat Masuk & Keluar';
                container.innerHTML = renderAgendaView();
            } else if(state.activeTab === 'arsip') {
                if(titleEl) titleEl.innerText = 'Arsip Digital & Pencarian Instan';
                container.innerHTML = renderArsipView();
            } else if(state.activeTab === 'laporan') {
                if(titleEl) titleEl.innerText = 'Rekapitulasi Bulanan & Laporan Arsip PDF';
                container.innerHTML = renderLaporanView();
            } else if(state.activeTab === 'penduduk') {
                if(titleEl) titleEl.innerText = 'Master Data Penduduk Desa';
                container.innerHTML = renderPendudukView();
            } else if(state.activeTab === 'pengguna') {
                if(titleEl) titleEl.innerText = 'Manajemen Hak Akses & Pengguna Sistem';
                container.innerHTML = renderPenggunaView();
            } else if(state.activeTab === 'pengaturan') {
                if(titleEl) titleEl.innerText = 'Pengaturan Nama Desa, Kop & Ukuran Kertas';
                container.innerHTML = renderPengaturanView();
                setTimeout(() => {
                    const kp = document.getElementById('liveKopPreview');
                    if(kp) kp.innerHTML = renderKopSuratHtml(state.settings);
                }, 50);
            }
        }

        function renderDashboardView() {
            const totalSurat = state.letters.length;
            const suratDisetujui = state.letters.filter(l => l.status === 'Disetujui').length;
            const suratMenunggu = state.letters.filter(l => l.status === 'Menunggu').length;
            const suratMasuk = state.agenda.filter(a => a.type === 'Masuk').length;
            const vName = getVillageName();

            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-brand-700 to-brand-900 rounded-2xl p-6 text-white shadow-lg flex flex-col md:flex-row justify-between items-center">
                        <div class="space-y-2 mb-4 md:mb-0">
                            <h2 class="text-2xl font-bold">Portal Administrasi Desa ${vName}</h2>
                            <p class="text-slate-200 text-sm max-w-xl">Layanan administrasi pembuatan surat keterangan berukuran standar A4/F4, undangan resmi, buku agenda, arsip digital dengan tangkapan foto/kamera scanner dokumen tersinkronisasi server.</p>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button onclick="switchTab('scan-masuk')" class="bg-emerald-500 text-white font-semibold px-4 py-2.5 rounded-xl shadow hover:bg-emerald-600 transition flex items-center space-x-2 text-sm">
                                <i class="fa-solid fa-camera-retro"></i>
                                <span>Scan Surat Masuk</span>
                            </button>
                            <button onclick="switchTab('layanan')" class="bg-white text-brand-900 font-semibold px-4 py-2.5 rounded-xl shadow hover:bg-slate-100 transition flex items-center space-x-2 text-sm">
                                <i class="fa-solid fa-plus-circle text-brand-600"></i>
                                <span>Buat Surat</span>
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-4">
                            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl shadow-inner"><i class="fa-solid fa-file-lines"></i></div>
                            <div>
                                <p class="text-xs text-slate-500 font-medium">Total Surat Terbit</p>
                                <h3 class="text-2xl font-bold text-slate-800">${totalSurat}</h3>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-4">
                            <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl shadow-inner"><i class="fa-solid fa-circle-check"></i></div>
                            <div>
                                <p class="text-xs text-slate-500 font-medium">Surat Disetujui</p>
                                <h3 class="text-2xl font-bold text-slate-800">${suratDisetujui}</h3>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-4">
                            <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-xl shadow-inner"><i class="fa-solid fa-clock"></i></div>
                            <div>
                                <p class="text-xs text-slate-500 font-medium">Menunggu Verifikasi</p>
                                <h3 class="text-2xl font-bold text-slate-800">${suratMenunggu}</h3>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-4">
                            <div class="w-12 h-12 bg-purple-50 text-purple-600 rounded-xl flex items-center justify-center text-xl shadow-inner"><i class="fa-solid fa-envelope-open-text"></i></div>
                            <div>
                                <p class="text-xs text-slate-500 font-medium">Agenda Masuk</p>
                                <h3 class="text-2xl font-bold text-slate-800">${suratMasuk}</h3>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="font-bold text-slate-800 text-base">Arsip Permohonan & Surat Masuk Terbaru</h3>
                                <button onclick="switchTab('arsip')" class="text-xs text-brand-600 font-semibold hover:underline">Lihat Semua Arsip</button>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm">
                                    <thead>
                                        <tr class="border-b border-slate-100 text-slate-400 font-medium text-xs uppercase">
                                            <th class="pb-3">Nomor Surat</th>
                                            <th class="pb-3">Pemohon / Pengirim</th>
                                            <th class="pb-3">Jenis Surat</th>
                                            <th class="pb-3">Status</th>

                                            <tr class="hover:bg-slate-50">
                                                <td class="py-3 font-mono text-xs text-slate-600">${l.number}</td>
                                                <td class="py-3 font-semibold text-slate-800">${l.name}</td>
                                                <td class="py-3 text-slate-600">${l.type}</td>
                                                <td class="py-3">
                                                    <span class="px-2.5 py-1 text-xs rounded-full font-medium ${l.status === 'Disetujui' || l.status === 'Diterima' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">

                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>

                        </div>

                        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                            <h3 class="font-bold text-slate-800 text-base mb-3">Klasifikasi Surat Resmi</h3>
                            <p class="text-xs text-slate-500 mb-4">Format dokumen otomatis dikonfigurasi ke ukuran ${state.settings.paperSize || 'A4'} resmi.</p>
                            <div class="space-y-3">

                    </div>
                </div>
            `;
        }

        // ==========================================
        // MODUL: SCAN & ARSIP SURAT MASUK EKSTERNAL
        // ==========================================
        function renderScanMasukView() {
            const vName = getVillageName();
            return `
                <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-8 space-y-6">
                    <div class="border-b border-slate-100 pb-4 flex justify-between items-center">

                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-2">Tanggal Surat:</label>
                                <input type="date" id="incomingDate" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm" value="2026-08-04">

        async function handleIncomingPhotoUpload(event) {
            const file = event.target.files[0];
            if(file) {
                const compressed = await compressImage(file, 900, 900, 0.8);
                tempIncomingScanPhoto = compressed;
                tempIncomingIsScanned = false;
                const container = document.getElementById('incomingPhotoPreviewContainer');
                const img = document.getElementById('incomingPhotoImg');
                const btnText = document.getElementById('incomingScanFilterText');
                if(container && img) {
                    img.src = tempIncomingScanPhoto;
                    img.classList.remove('scan-effect');
                    if(btnText) btnText.innerText = 'Aktifkan Efek Scan';
                    container.classList.remove('hidden');
                }
            }
        }

        function toggleIncomingScanFilter() {
            tempIncomingIsScanned = !tempIncomingIsScanned;
            const img = document.getElementById('incomingPhotoImg');
            const btnText = document.getElementById('incomingScanFilterText');
            if(img) {
                if(tempIncomingIsScanned) {
                    img.classList.add('scan-effect');
                    if(btnText) btnText.innerText = 'Nonaktifkan Efek Scan';
                } else {
                    img.classList.remove('scan-effect');
                    if(btnText) btnText.innerText = 'Aktifkan Efek Scan';
                }
            }
        }

        function clearIncomingPhoto() {
            tempIncomingScanPhoto = null;
            tempIncomingIsScanned = false;
            const container = document.getElementById('incomingPhotoPreviewContainer');
            const fileInput = document.getElementById('incomingPhotoInput');
            if(container) container.classList.add('hidden');
            if(fileInput) fileInput.value = '';
        }

        async function handleGenerateLetter(event) {
            event.preventDefault();
            const letterTypeFull = document.getElementById('letterType').value;

            const nik = document.getElementById('inputNik').value;
            const name = document.getElementById('inputName').value;

            const vName = getVillageName();

            if(!nik && !typeName.includes('Undangan')) {
                showModal('Peringatan', 'Silakan pilih data penduduk terlebih dahulu!', 'error');
                return;
            }

            const newId = 'L-2026-' + String(state.letters.length + 1).padStart(3, '0');
            const agId = 'AG-' + Date.now().toString().slice(-4);
            const newNo = `${typeCode} / 0${state.letters.length + 1} / KMR.PGT / VIII / 2026`;
            const today = '2026-08-04';

            const newLetter = {
                id: newId,
                nik: nik || '7501010000000000',
                name: name || 'Warga Desa ' + vName,
                type: typeName,
                code: typeCode,
                number: newNo,
                date: today,
                purpose: purpose,
                status: 'Disetujui',
                signedBy: state.settings.headName + ' (' + state.settings.headTitle + ')',
                sifat: sifat,
                lampiran: lampiran,
                includePurpose: includePurpose,
                photo: null,
                isScanned: false
            };

            const newAgenda = {
                id: agId,
                type: 'Keluar',
                noSurat: newNo,
                from: vName,
                date: today,
                subject: purpose,
                status: 'Terkirim'
            };

            await saveLetterToSupabase(newLetter);
            await saveAgendaToSupabase(newAgenda);

            state.letters.unshift(newLetter);
            state.agenda.unshift(newAgenda);

            showModal('Sukses!', `Surat berhasil digenerate & tersimpan di database server dengan Nomor: <br><strong class="font-mono text-brand-700">${newNo}</strong>`, 'success', () => {

        async function handleExcelImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                    
                    if (jsonRows.length === 0) {
                        showModal('Peringatan', 'File Excel kosong atau format tidak sesuai.', 'error');
                        return;
                    }

                    const columns = Object.keys(jsonRows[0]);
                    state.settings.excelResidents = {
                        columns: columns,
                        rows: jsonRows
                    };

                    await saveSettingsToSupabase();
                    showModal('Berhasil!', `File Excel berhasil diimpor dengan <strong>${columns.length} kolom</strong> dan <strong>${jsonRows.length} baris</strong>. Tampilan tabel otomatis menyesuaikan.`, 'success', () => {
                        renderActiveTabContent();
                    });
                } catch (err) {
                    console.error(err);
                    showModal('Gagal', 'Terjadi kesalahan saat membaca file Excel.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function handleSaveNewUser(e) {
            e.preventDefault();
            const newUser = {
                id: Date.now(),
                name: document.getElementById('newUserName').value,
                username: document.getElementById('newUserUsername').value,
                role: document.getElementById('newUserRole').value,
                email: document.getElementById('newUserEmail').value,
                status: 'Aktif'
            };

            await saveUserToSupabase(newUser);
            state.allowedUsers.push(newUser);
            closeModal();
            showModal('Sukses', 'Akses staf berhasil ditambahkan ke server.', 'success', () => renderView());
        }

        async function removeUser(id) {
            if(state.allowedUsers.length <= 1) {
                showModal('Peringatan', 'Sistem memerlukan setidaknya 1 Administrator aktif.', 'error');
                return;
            }
            showConfirm('Cabut Akses', 'Cabut akses pengguna ini?', async () => {
                await deleteUserFromSupabase(id);
                state.allowedUsers = state.allowedUsers.filter(u => u.id !== id);
                renderActiveTabContent();
                showModal('Berhasil', 'Akses dicabut.', 'success');
            });
        }

                                <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Tanggal Surat</span><span class="col-span-8">: ${l.date}</span></div>
                                <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Sifat / Lampiran</span><span class="col-span-8">: ${l.sifat || 'Penting'} / ${l.lampiran || '-'}</span></div>
                                <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Perihal / Subjek</span><span class="col-span-8 font-medium">${l.purpose}</span></div>
                            </div>
                        ` : l.type.includes('Undangan') ? `
                            <div class="grid grid-cols-2 text-xs pt-1 pb-2">
                                <div class="space-y-0.5">
                                    <div class="flex"><span class="w-20 font-medium">Nomor</span><span class="mr-2">:</span><span class="font-mono">${l.number}</span></div>
                                    <div class="flex"><span class="w-20 font-medium">Sifat</span><span class="mr-2">:</span><span>${l.sifat || 'Penting'}</span></div>
                                    <div class="flex"><span class="w-20 font-medium">Lampiran</span><span class="mr-2">:</span><span>${l.lampiran || '-'}</span></div>
                                    <div class="flex"><span class="w-20 font-medium">Perihal</span><span class="mr-2">:</span><span class="font-semibold">Undangan Rapat</span></div>
                                </div>
                                <div class="text-right space-y-0.5">
                                    <p>${vName}, 04 Agustus 2026</p>
                                    <p class="pt-2">Kepada Yang Terhormat</p>
                                    <p>Bapak/Ibu/sdr (i)</p>
                                    <p>Di -</p>
                                    <p class="font-semibold pl-4">Tempat</p>
                                </div>
                            </div>

                            <div class="text-xs leading-relaxed space-y-3 pt-2">
                                <p class="font-semibold">Dengan Hormat,</p>
                                <p>Sehubungan dengan ${l.purpose}, oleh karena itu kami mengundang Bapak/Ibu/sdr(i) untuk hadir pada rapat persiapan kegiatan dimaksud yang Insya Allah akan dilaksanakan pada :</p>
                                
                                <div class="pl-4 space-y-1 my-2">
                                    <div class="flex"><span class="w-24">Hari / Tanggal</span><span>: Senin, 10 Agustus 2026</span></div>
                                    <div class="flex"><span class="w-24">Pukul</span><span>: 14.00 WITA s.d Selesai</span></div>
                                    <div class="flex"><span class="w-24">Tempat</span><span>: Kantor Desa ${vName}</span></div>
                                </div>

                                <p>Demikian surat undangan ini kami sampaikan, atas kehadiran dan kerjasamanya kami ucapkan terima kasih.</p>
                            </div>
                        ` : `
                            <div class="text-center pt-2 pb-1 space-y-1">
                                <h3 class="text-base font-bold uppercase underline tracking-wide">${l.type}</h3>
                                <p class="text-xs font-mono">Nomor: ${l.number}</p>
                            </div>

                            <div class="text-xs leading-relaxed space-y-3 pt-3">
                                <p>Yang bertanda tangan di bawah ini ${state.settings.headTitle}${vName} Kecamatan Paguat Kabupaten Pohuwato, menerangkan dengan sebenarnya bahwa:</p>
                                
                                <div class="pl-6 space-y-1 py-1">
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Nama Lengkap</span><span class="col-span-8">: <strong>${l.name}</strong></span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">NIK / No. KTP</span><span class="col-span-8">: <span class="font-mono">${l.nik}</span></span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Tempat / Tgl. Lahir</span><span class="col-span-8">: ${res.pob},${res.dob}</span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Jenis Kelamin</span><span class="col-span-8">: ${res.gender}</span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Agama</span><span class="col-span-8">: Islam</span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Pekerjaan</span><span class="col-span-8">: ${res.job}</span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Alamat / Domisili</span><span class="col-span-8">: ${res.address} Desa${vName}</span></div>
                                </div>

                                <p>
                                    ${l.type.includes('Domisili') ? `Berdasarkan data kependudukan dan keterangan yang ada pada kami, yang bersangkutan benar-benar merupakan penduduk yang berdomisili tetap di Desa ${vName} Kecamatan Paguat Kabupaten Pohuwato.` :
                                      l.type.includes('Usaha') ? `Berdasarkan pengamatan dan penelitian kami, yang bersangkutan benar-benar memiliki unit usaha produktif / perdagangan di wilayah Desa ${vName} Kecamatan Paguat.` :
                                      `Surat keterangan ini diberikan kepada yang bersangkutan.`}
                                </p>

                                ${shouldIncludePurpose ? `
                                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 font-medium text-slate-700 my-2">
                                        <strong>Keperluan / Perihal Surat:</strong> ${l.purpose}
                                    </div>
                                ` : ''}

                                <p>Demikian surat keterangan ini dibuat dengan sebenarnya dan diberikan kepada yang bersangkutan untuk dapat dipergunakan sebagaimana mestinya.</p>
                            </div>
                        `}

                        ${l.photo ? `
                            <div class="pt-4 border-t border-slate-200 mt-4">
                                <div class="flex items-center justify-between mb-2">
                                    <p class="text-xs font-bold text-slate-700"><i class="fa-solid fa-camera mr-1 text-emerald-600"></i> Tangkapan Foto Dokumen / Hasil Scan:</p>
                                    ${l.isScanned ? '<span class="text-[10px] bg-slate-900 text-white px-2 py-0.5 rounded font-mono">Mode Scan Aktif</span>' : ''}
                                </div>
                                <img src="${l.photo}" class="w-64 h-64 object-cover rounded-xl border shadow-md ${l.isScanned ? 'scan-effect' : ''}" alt="Foto Scan Dokumen">
                            </div>
                        ` : ''}

                        ${!isIncoming ? `
                            <div class="flex justify-end pt-12 text-xs">
                                <div class="text-center">
                                    <p>${vName},${l.date}</p>
                                    <p class="font-bold">${state.settings.headTitle}${vName}</p>
                                    <div class="h-16 flex items-center justify-center">
                                        <span class="text-[10px] bg-brand-50 text-brand-700 px-2 py-1 rounded font-mono border border-brand-200">[TTE / Stempel Resmi Desa]</span>
                                    </div>
                                    <p class="font-bold underline">${state.settings.headName}</p>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                </div>

                <div class="mt-6 flex justify-end space-x-3 no-print">
                    <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold hover:bg-slate-300 transition">Tutup</button>
                    <button onclick="window.print()" class="px-5 py-2 bg-brand-600 text-white rounded-xl text-xs font-semibold shadow hover:bg-brand-700 transition flex items-center space-x-2">
                        <i class="fa-solid fa-print"></i><span>Cetak Arsip (${pSize})</span>
                    </button>
                </div>
            `;

            showCustomModalHtml(modalHtml);
        }

        async function changeModalPaperSize(id, size) {
            state.settings.paperSize = size;
            await saveSettingsToSupabase();
            previewLetter(id);
        }

        let currentModalCallback = null;

        function showModal(title, message, type = 'success', callback = null) {
            currentModalCallback = callback;
            const content = `
                <div class="text-center space-y-4 py-4">
                    <div class="w-12 h-12 mx-auto rounded-full flex items-center justify-center text-xl ${type === 'success' ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'}">
                        <i class="fa-solid ${type === 'success' ? 'fa-check' : 'fa-triangle-exclamation'}"></i>
                    </div>
                    <h3 class="font-bold text-lg text-slate-800">${title}</h3>
                    <p class="text-xs text-slate-600">${message}</p>
                    <button onclick="closeModal(); if(currentModalCallback) { const cb = currentModalCallback; currentModalCallback = null; cb(); }" class="w-full bg-slate-900 text-white py-2.5 rounded-xl text-xs font-semibold hover:bg-slate-800 transition">OK</button>
                </div>
            `;
            document.getElementById('modalContent').innerHTML = content;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function showConfirm(title, message, onConfirm) {
            const html = `
                <div class="text-center space-y-4 py-4">
                    <div class="w-12 h-12 mx-auto rounded-full flex items-center justify-center text-xl bg-amber-100 text-amber-600">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                    <h3 class="font-bold text-lg text-slate-800">${title}</h3>
                    <p class="text-xs text-slate-600">${message}</p>
                    <div class="flex space-x-3 pt-2">
                        <button onclick="closeModal()" class="w-full bg-slate-200 text-slate-700 py-2.5 rounded-xl text-xs font-semibold hover:bg-slate-300 transition">Batal</button>
                        <button id="modalConfirmYesBtn" class="w-full bg-red-600 text-white py-2.5 rounded-xl text-xs font-semibold shadow hover:bg-red-700 transition">Ya, Lanjutkan</button>
                    </div>
                </div>
            `;
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('customModal').classList.remove('hidden');
            
            document.getElementById('modalConfirmYesBtn').onclick = () => {
                closeModal();
                if(onConfirm) onConfirm();
            };
        }

        function showCustomModalHtml(html) {
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        // Inisialisasi awal saat halaman dimuat
        document.addEventListener('DOMContentLoaded', async () => {
            await loadDataFromSupabase();
        });
    </script>
</body>
</html>
