    <script>
        const defaultSettings = {
            kopLine1: 'PEMERINTAH KABUPATEN POHUWATO', kopLine2: 'KECAMATAN PAGUAT', kopLine3: 'DESA KAMIIRI',
            kopLine4: 'Alamat : Jln. Trans Sulawesi Dsn I Desa Kamiiri Kec. Paguat Kab. Pohuwato',
            sizeLine1: '14', sizeLine2: '12', sizeLine3: '18', sizeLine4: '11',
            spaceLine1: '1.2', spaceLine2: '1.2', spaceLine3: '1.1', spaceLine4: '1.2',
            fontLine1: 'font-sans', fontLine2: 'font-sans', fontLine3: 'font-sans', fontLine4: 'font-sans',
            weightLine1: 'font-bold', weightLine2: 'font-semibold', weightLine3: 'font-black', weightLine4: 'font-normal',

        let state = { isLoggedIn: false, currentUser: { name: 'Admin', role: 'Administrator Utama', username: 'admin' }, activeTab: 'dashboard', allowedUsers: [], settings: defaultSettings, residents: [], letters: [], agenda: [] };
        const classificationCodes = [
            { code: '474.3', desc: 'Kependudukan & Catatan Sipil (Domisili, Pindah, Datang)' },
            { code: '503', desc: 'Perekonomian & Perizinan Usaha (SKU, Izin Keramaian)' },
            { code: '401', desc: 'Kesejahteraan Rakyat & Sosial (SKTM, Bantuan Sosial)' },
            { code: '005', desc: 'Ketatausahaan & Undangan Resmi Kedinasan' }
        ];
        let tempIncomingScanPhoto = null, tempIncomingIsScanned = false, currentModalCallback = null;

        const sessionSaved = localStorage.getItem('siap_desa_session');
        let isReload = performance.navigation?.type === 1 || performance.getEntriesByType("navigation")[0]?.type === 'reload';
        if (isReload && sessionSaved) {
            try { const p = JSON.parse(sessionSaved); state.isLoggedIn = p.isLoggedIn; state.currentUser = p.currentUser; if (p.activeTab) state.activeTab = p.activeTab; } catch(e){}
        }

        const saveSession = () => localStorage.setItem('siap_desa_session', JSON.stringify({ isLoggedIn: state.isLoggedIn, currentUser: state.currentUser, activeTab: state.activeTab }));

        const compressImage = (file, maxWidth = 900, maxHeight = 900, quality = 0.8) => new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    let w = img.width, h = img.height;
                    if (w > h && w > maxWidth) { h *= maxWidth / w; w = maxWidth; }
                    else if (h > maxHeight) { w *= maxHeight / h; h = maxHeight; }
                    const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });

        async function loadDataFromSupabase() {
            try {
                const { data: setRow } = await supabaseClient.from('pengaturan_desa').select('*').eq('id', 1).single();
                if (setRow?.config) state.settings = typeof setRow.config === 'string' ? JSON.parse(setRow.config) : setRow.config;
                else await supabaseClient.from('pengaturan_desa').upsert({ id: 1, config: defaultSettings });

                const { data: resData } = await supabaseClient.from('penduduk').select('*');
                state.residents = resData || [];

                const { data: letterData } = await supabaseClient.from('surat_desa').select('*').order('created_at', { ascending: false });
                if (letterData?.length > 0) {
                    state.letters = letterData.map(l => ({ id: l.id, nik: l.nik, name: l.name, type: l.type, code: l.code, number: l.number, date: l.date, purpose: l.purpose, status: l.status, signedBy: l.signed_by, sifat: l.sifat, lampiran: l.lampiran, includePurpose: l.include_purpose, photo: l.photo, isScanned: l.is_scanned }));
                } else {
                    const defL = [{ id: 'L-2026-001', nik: '7501011234560001', name: 'Budi Santoso', type: 'Surat Keterangan Domisili', code: '474.3', number: '474.3 / 001 / Des.01 / 2026', date: '2026-08-04', purpose: 'Persyaratan pembukaan rekening bank', status: 'Disetujui', signed_by: 'Admin (Kepala Desa)', sifat: 'Penting', lampiran: '-', include_purpose: true, photo: null, is_scanned: false }];
                    await supabaseClient.from('surat_desa').upsert(defL);
                    state.letters = defL.map(l => ({ ...l, signedBy: l.signed_by, includePurpose: l.include_purpose, isScanned: l.is_scanned }));
                }

                const { data: agendaData } = await supabaseClient.from('agenda_surat').select('*').order('created_at', { ascending: false });
                if (agendaData?.length > 0) {
                    state.agenda = agendaData.map(a => ({ id: a.id, type: a.type, noSurat: a.no_surat, from: a.surat_from, date: a.date, subject: a.subject, status: a.status }));
                } else {
                    const defA = [{ id: 'AG-01', type: 'Masuk', no_surat: '005/123/Kec-Paguat/2026', surat_from: 'Kecamatan Paguat', date: '2026-08-02', subject: 'Undangan Rapat Koordinasi Bulanan', status: 'Diteruskan ke Sekdes' }];
                    await supabaseClient.from('agenda_surat').upsert(defA);
                    state.agenda = defA.map(a => ({ id: a.id, type: a.type, noSurat: a.no_surat, from: a.surat_from, date: a.date, subject: a.subject, status: a.status }));
                }

                const { data: staffData } = await supabaseClient.from('staf_desa').select('*');
                if (staffData?.length > 0) state.allowedUsers = staffData;
                else {
                    const defS = [{ id: 1, name: 'Admin', username: 'admin', role: 'Administrator / Kepala Desa', status: 'Aktif', email: 'admin@pohuwato.desa.id' }, { id: 2, name: 'Operator', username: 'operator', role: 'Operator Administrasi', status: 'Aktif', email: 'operator@pohuwato.desa.id' }];
                    await supabaseClient.from('staf_desa').upsert(defS);
                    state.allowedUsers = defS;
                }
            } catch (e) { console.error('Error memuat data:', e); }
            renderView();
        }

        const saveSettingsToSupabase = () => supabaseClient.from('pengaturan_desa').upsert({ id: 1, config: state.settings, updated_at: new Date() });
        const saveLetterToSupabase = l => supabaseClient.from('surat_desa').upsert({ id: l.id, nik: l.nik || null, name: l.name, type: l.type, code: l.code, number: l.number, date: l.date, purpose: l.purpose, status: l.status, signed_by: l.signedBy, sifat: l.sifat, lampiran: l.lampiran, include_purpose: l.includePurpose, photo: l.photo, is_scanned: l.isScanned });
        const deleteLetterFromSupabase = id => supabaseClient.from('surat_desa').delete().eq('id', id);
        const saveAgendaToSupabase = a => supabaseClient.from('agenda_surat').upsert({ id: a.id, type: a.type, no_surat: a.noSurat, surat_from: a.from, date: a.date, subject: a.subject, status: a.status });
        const deleteAgendaFromSupabase = id => supabaseClient.from('agenda_surat').delete().eq('id', id);
        const saveUserToSupabase = u => supabaseClient.from('staf_desa').upsert(u);
        const deleteUserFromSupabase = id => supabaseClient.from('staf_desa').delete().eq('id', id);

        function resetToDefaultState() {
            showConfirm('Reset Sistem', 'Apakah Anda yakin ingin mereset seluruh pengaturan dan data kembali ke awal?', async () => {
                localStorage.removeItem('siap_desa_session');
                await supabaseClient.from('pengaturan_desa').upsert({ id: 1, config: defaultSettings });
                await loadDataFromSupabase();
                showModal('Berhasil', 'Sistem berhasil dikembalikan ke pengaturan awal.', 'success');
            });
        }

        const getVillageName = () => state.settings.desaShort || 'Kamiiri';
        const getPaperDimensionsClass = size => size === 'F4' ? 'w-full max-w-[215mm] min-h-[330mm] mx-auto' : 'w-full max-w-[210mm] min-h-[297mm] mx-auto';

        function updateDynamicVillageUI() {
            const vName = getVillageName();
            document.getElementById('sidebarVillageLabel')?.innerText = vName;
            document.getElementById('sidebarFooterVillage')?.innerText = vName;
            const appLogoEl = document.getElementById('sidebarAppLogo');
            if (appLogoEl && state.settings.appLogo) appLogoEl.src = state.settings.appLogo;
            document.getElementById('topNavAdminName')?.innerText = state.currentUser.name;
            document.getElementById('topNavAdminRole')?.innerText = state.currentUser.role;
            document.documentElement.style.setProperty('--print-page-size', state.settings.paperSize === 'F4' ? '215mm 330mm' : 'A4');
        }

        async function uploadLogoFile(event, fieldName) {
            const file = event.target.files[0];
            if (!file) return;
            const compressed = await compressImage(file, 250, 250, 0.85);
            state.settings[fieldName] = compressed;
            const fieldEl = document.getElementById(fieldName === 'appLogo' ? 'setAppLogo' : fieldName === 'logo1' ? 'setLogo1' : 'setLogo2');
            if (fieldEl) fieldEl.value = compressed;
            const kp = document.getElementById('liveKopPreview');
            if (kp) kp.innerHTML = renderKopSuratHtml(state.settings);
            await saveSettingsToSupabase();
        }

        const renderFontOptions = current => [
            {val: 'font-sans', label: 'Inter'}, {val: 'font-poppins', label: 'Poppins'}, {val: 'font-roboto', label: 'Roboto'},
            {val: 'font-montserrat', label: 'Montserrat'}, {val: 'font-opensans', label: 'Open Sans'}, {val: 'font-lato', label: 'Lato'},
            {val: 'font-raleway', label: 'Raleway'}, {val: 'font-nunito', label: 'Nunito'}, {val: 'font-jakartasans', label: 'Plus Jakarta Sans'},
            {val: 'font-quicksand', label: 'Quicksand'}, {val: 'font-sourcesans', label: 'Source Sans 3'}, {val: 'font-lora', label: 'Lora (Serif)'},
            {val: 'font-playfair', label: 'Playfair Display (Serif)'}, {val: 'font-merriweather', label: 'Merriweather (Serif)'},
            {val: 'font-arial', label: 'Arial (Sans-Serif)'}, {val: 'font-serif', label: 'Times New Roman (Serif)'}, {val: 'font-mono', label: 'Courier New (Mono)'}
        ].map(f => `<option value="${f.val}" ${current === f.val ? 'selected' : ''}>${f.label}</option>`).join('');

        const renderWeightOptions = current => [
            {val: 'font-light', label: 'Light (300)'}, {val: 'font-normal', label: 'Regular (400)'}, {val: 'font-medium', label: 'Medium (500)'},
            {val: 'font-semibold', label: 'Semi Bold (600)'}, {val: 'font-bold', label: 'Bold (700)'}, {val: 'font-extrabold', label: 'Extra Bold (800)'}, {val: 'font-black', label: 'Black (900)'}
        ].map(w => `<option value="${w.val}" ${current === w.val ? 'selected' : ''}>${w.label}</option>`).join('');

        function renderKopSuratHtml(s) {
            const align = s.align === 'left' ? 'text-left' : s.align === 'right' ? 'text-right' : 'text-center';
            const [sz1, sz2, sz3, sz4] = [s.sizeLine1||'14', s.sizeLine2||'12', s.sizeLine3||'18', s.sizeLine4||'11'];
            const [sp1, sp2, sp3, sp4] = [s.spaceLine1||'1.2', s.spaceLine2||'1.2', s.spaceLine3||'1.1', s.spaceLine4||'1.2'];
            const [f1, f2, f3, f4] = [s.fontLine1||'font-sans', s.fontLine2||'font-sans', s.fontLine3||'font-sans', s.fontLine4||'font-sans'];
            const [w1, w2, w3, w4] = [s.weightLine1||'font-bold', s.weightLine2||'font-semibold', s.weightLine3||'font-black', s.weightLine4||'font-normal'];
            const [lh, lw] = [s.logoHeight||'80', s.logoWidth||'80'];

            if (s.logoCount === '1') {
                return `
                    <div class="border-b-[3px] border-slate-900 pb-3 mb-4 flex items-center">
                        <div class="flex items-center justify-center mr-4 shrink-0 overflow-hidden" style="width: ${lw}px; height: ${lh}px;">
                            <img src="${s.logo1}" class="w-full h-full object-contain" alt="Logo" onerror="this.src='https://placehold.co/80x80/1e293b/ffffff?text=LOGO'">
                        </div>
                        <div class="${align} flex-1 px-2 space-y-0.5">
                            <h3 class="${f1} ${w1} uppercase" style="font-size: ${sz1}px; line-height: ${sp1};">${s.kopLine1||''}</h3>
                            <h3 class="${f2} ${w2} uppercase" style="font-size: ${sz2}px; line-height: ${sp2};">${s.kopLine2||''}</h3>
                            <h2 class="${f3} ${w3} text-slate-900 tracking-wider uppercase" style="font-size: ${sz3}px; line-height: ${sp3};">${s.kopLine3||''}</h2>
                            <p class="${f4} ${w4} italic text-slate-700" style="font-size: ${sz4}px; line-height: ${sp4};">${s.kopLine4||''}</p>
                        </div>
                    </div>`;
            }
            return `
                <div class="border-b-[3px] border-slate-900 pb-3 mb-4 flex items-center justify-between">
                    <div class="flex items-center justify-center shrink-0 overflow-hidden" style="width: ${lw}px; height: ${lh}px;">
                        <img src="${s.logo1}" class="w-full h-full object-contain" alt="Logo1" onerror="this.src='https://placehold.co/80x80/1e293b/ffffff?text=LOGO1'">
                    </div>
                    <div class="${align} flex-1 px-4 space-y-0.5">
                        <h3 class="${f1} ${w1} uppercase" style="font-size: ${sz1}px; line-height: ${sp1};">${s.kopLine1||''}</h3>
                        <h3 class="${f2} ${w2} uppercase" style="font-size: ${sz2}px; line-height: ${sp2};">${s.kopLine2||''}</h3>
                        <h2 class="${f3} ${w3} text-slate-900 tracking-wider uppercase" style="font-size: ${sz3}px; line-height: ${sp3};">${s.kopLine3||''}</h2>
                        <p class="${f4} ${w4} italic text-slate-700" style="font-size: ${sz4}px; line-height: ${sp4};">${s.kopLine4||''}</p>
                    </div>
                    <div class="flex items-center justify-center shrink-0 overflow-hidden" style="width: ${lw}px; height: ${lh}px;">
                        <img src="${s.logo2}" class="w-full h-full object-contain" alt="Logo2" onerror="this.src='https://placehold.co/80x80/166534/ffffff?text=LOGO2'">
                    </div>
                </div>`;
        }
    </script>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value;
            const matched = state.allowedUsers.find(x => x.username === u);
            if ((matched && (p === 'admin123' || p === 'password')) || (u === 'admin' && p === 'admin123')) {
                state.isLoggedIn = true;
                state.currentUser = matched ? { name: matched.name, role: matched.role, username: matched.username } : { name: 'Admin', role: 'Administrator Utama', username: 'admin' };
                saveSession();
                renderView();
            } else {
                showModal('Login Gagal', 'Username atau password salah. Cek kembali data akses.', 'error');
            }
        }

        function handleLogout() {
            showConfirm('Konfirmasi Keluar', 'Apakah Anda ingin keluar dari sesi sistem administrasi ini?', () => {
                state.isLoggedIn = false;
                localStorage.removeItem('siap_desa_session');
                renderView();
            });
        }

        const switchTab = tabId => { state.activeTab = tabId; saveSession(); renderView(); };

        function renderView() {
            const wrapper = document.getElementById('appContainer');
            const vName = getVillageName();
            if (!state.isLoggedIn) { wrapper.innerHTML = renderLoginView(); return; }

            const navCls = tab => state.activeTab === tab ? 'flex items-center px-3 py-2.5 rounded-lg transition text-white bg-brand-600 shadow-md' : 'flex items-center px-3 py-2.5 rounded-lg transition text-slate-300 hover:bg-slate-800 hover:text-white';
            const mobCls = tab => state.activeTab === tab ? 'px-3 py-1.5 rounded-lg text-xs font-medium transition bg-brand-600 text-white flex items-center space-x-1.5 shrink-0 shadow' : 'px-3 py-1.5 rounded-lg text-xs font-medium transition text-slate-300 hover:bg-slate-800 flex items-center space-x-1.5 shrink-0';

            wrapper.innerHTML = `

                        <div class="p-5 border-b border-slate-800 flex items-center space-x-3">
                            <div class="bg-white text-slate-900 rounded-xl shadow-lg overflow-hidden flex items-center justify-center w-10 h-10">

                                <h1 class="font-bold text-white text-base tracking-wide">SIAP-Desa</h1>

                            </div>
                        </div>
                        <div class="p-3 bg-slate-800/80 m-3 rounded-lg border border-slate-700 flex items-center space-x-2">
                            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                            <div class="overflow-hidden">
                                <p class="text-[11px] font-semibold text-slate-400">Login Sebagai:</p>
                                <p class="text-xs font-bold text-white truncate">${state.currentUser.name}</p>
                            </div>
                        </div>
                        <nav class="flex-1 px-3 py-2 space-y-1 text-sm font-medium overflow-y-auto">
                            <a href="#" onclick="switchTab('dashboard')" class="${navCls('dashboard')}"><i class="fa-solid fa-chart-pie w-6"></i> Dashboard Utama</a>
                            <a href="#" onclick="switchTab('scan-masuk')" class="${navCls('scan-masuk')}"><i class="fa-solid fa-camera-retro w-6 text-emerald-400"></i> Scan & Arsip Surat Masuk</a>

                            <a href="#" onclick="switchTab('agenda')" class="${navCls('agenda')}"><i class="fa-solid fa-book-open w-6"></i> Buku Agenda Surat</a>
                            <a href="#" onclick="switchTab('arsip')" class="${navCls('arsip')}"><i class="fa-solid fa-folder-tree w-6"></i> Arsip Digital & Pencarian</a>
                            <a href="#" onclick="switchTab('laporan')" class="${navCls('laporan')}"><i class="fa-solid fa-print w-6"></i> Rekapitulasi & Laporan PDF</a>
                            <a href="#" onclick="switchTab('penduduk')" class="${navCls('penduduk')}"><i class="fa-solid fa-users w-6"></i> Data Penduduk</a>
                            <a href="#" onclick="switchTab('pengguna')" class="${navCls('pengguna')}"><i class="fa-solid fa-user-shield w-6"></i> Manajemen Hak Akses</a>
                            <a href="#" onclick="switchTab('pengaturan')" class="${navCls('pengaturan')}"><i class="fa-solid fa-gears w-6"></i> Pengaturan Desa & Kop</a>
                        </nav>
                        <div class="p-4 border-t border-slate-800 space-y-2">

        async function handleIncomingPhotoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                tempIncomingScanPhoto = await compressImage(file, 900, 900, 0.8);
                tempIncomingIsScanned = false;
                document.getElementById('incomingPhotoImg').src = tempIncomingScanPhoto;
                document.getElementById('incomingPhotoImg').classList.remove('scan-effect');
                document.getElementById('incomingScanFilterText').innerText = 'Aktifkan Efek Scan';
                document.getElementById('incomingPhotoPreviewContainer').classList.remove('hidden');
            }
        }

        function toggleIncomingScanFilter() {
            tempIncomingIsScanned = !tempIncomingIsScanned;
            const img = document.getElementById('incomingPhotoImg');
            if (tempIncomingIsScanned) { img.classList.add('scan-effect'); document.getElementById('incomingScanFilterText').innerText = 'Nonaktifkan Efek Scan'; }
            else { img.classList.remove('scan-effect'); document.getElementById('incomingScanFilterText').innerText = 'Aktifkan Efek Scan'; }
        }

        function clearIncomingPhoto() {
            tempIncomingScanPhoto = null; tempIncomingIsScanned = false;
            document.getElementById('incomingPhotoPreviewContainer').classList.add('hidden');
            document.getElementById('incomingPhotoInput').value = '';
        }

        async function handleSaveIncomingScan(event) {
            event.preventDefault();
            const no = document.getElementById('incomingNo').value, from = document.getElementById('incomingFrom').value;
            const date = document.getElementById('incomingDate').value, sifat = document.getElementById('incomingSifat').value, subject = document.getElementById('incomingSubject').value;
            if (!tempIncomingScanPhoto) { showModal('Peringatan', 'Silakan unggah foto dokumen surat masuk terlebih dahulu!', 'error'); return; }

            const newL = { id: 'L-IN-' + Date.now().toString().slice(-4), nik: null, name: from, type: 'Surat Masuk (Eksternal)', code: '005', number: no, date: date, purpose: subject, status: 'Diterima', signedBy: from, sifat: sifat, lampiran: '1 Berkas', includePurpose: true, photo: tempIncomingScanPhoto, isScanned: tempIncomingIsScanned };
            const newA = { id: 'AG-' + Date.now().toString().slice(-4), type: 'Masuk', noSurat: no, from: from, date: date, subject: subject, status: 'Diterima & Diarsipkan' };

            await saveLetterToSupabase(newL); await saveAgendaToSupabase(newA);
            state.letters.unshift(newL); state.agenda.unshift(newA);
            tempIncomingScanPhoto = null; tempIncomingIsScanned = false;
            showModal('Berhasil!', `Dokumen dari <strong>${from}</strong> berhasil dipindai dan disimpan.`, 'success', () => switchTab('arsip'));
        }

        async function handleGenerateLetter(event) {
            event.preventDefault();
            const [typeName, typeCode] = document.getElementById('letterType').value.split('|');
            const nik = document.getElementById('inputNik').value, name = document.getElementById('inputName').value;
            const purpose = document.getElementById('inputPurpose').value, sifat = document.getElementById('inputSifat').value;
            const lampiran = document.getElementById('inputLampiran').value, includePurpose = document.getElementById('inputIncludePurpose').checked, vName = getVillageName();

            if (!nik && !typeName.includes('Undangan')) { showModal('Peringatan', 'Silakan pilih data penduduk terlebih dahulu!', 'error'); return; }

            const newId = 'L-2026-' + String(state.letters.length + 1).padStart(3, '0');
            const agId = 'AG-' + Date.now().toString().slice(-4);
            const newNo = `${typeCode} / 0${state.letters.length + 1} / KMR.PGT / VIII / 2026`;

            const newL = { id: newId, nik: nik || '7501010000000000', name: name || 'Warga Desa ' + vName, type: typeName, code: typeCode, number: newNo, date: '2026-08-04', purpose: purpose, status: 'Disetujui', signedBy: state.settings.headName + ' (' + state.settings.headTitle + ')', sifat: sifat, lampiran: lampiran, includePurpose: includePurpose, photo: null, isScanned: false };
            const newA = { id: agId, type: 'Keluar', noSurat: newNo, from: vName, date: '2026-08-04', subject: purpose, status: 'Terkirim' };

            await saveLetterToSupabase(newL); await saveAgendaToSupabase(newA);
            state.letters.unshift(newL); state.agenda.unshift(newA);

            showModal('Sukses!', `Surat berhasil digenerate dengan Nomor: <br><strong class="font-mono text-brand-700">${newNo}</strong>`, 'success', () => previewLetter(newId));
        }

        function exportResidentsToExcel() {
            let data = state.settings.excelResidents?.rows?.length > 0 ? state.settings.excelResidents.rows : state.residents.map((r, i) => ({ "No": i+1, "NIK": r.nik, "Nama Lengkap": r.name, "Jenis Kelamin": r.gender, "Tempat Lahir": r.pob, "Tanggal Lahir": r.dob, "Pekerjaan": r.job, "Alamat": r.address }));
            if (data.length === 0) { showModal('Peringatan', 'Tidak ada data penduduk.', 'error'); return; }
            const ws = XLSX.utils.json_to_sheet(data), wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Penduduk");
            XLSX.writeFile(wb, "Data_Penduduk.xlsx");
        }

        async function handleExcelImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
                    if (rows.length === 0) { showModal('Peringatan', 'File Excel kosong.', 'error'); return; }
                    state.settings.excelResidents = { columns: Object.keys(rows[0]), rows: rows };
                    await saveSettingsToSupabase();
                    showModal('Berhasil!', `File Excel diimpor dengan <strong>${rows.length} baris</strong>.`, 'success', () => renderActiveTabContent());
                } catch (err) { showModal('Gagal', 'Kesalahan membaca file Excel.', 'error'); }
            };
            reader.readAsArrayBuffer(file);
        }

                                    <div class="flex"><span class="w-24">Hari / Tanggal</span><span>: Senin, 10 Agustus 2026</span></div>
                                    <div class="flex"><span class="w-24">Pukul</span><span>: 14.00 WITA s.d Selesai</span></div>
                                    <div class="flex"><span class="w-24">Tempat</span><span>: Kantor Desa ${vName}</span></div>
                                </div>
                                <p>Demikian undangan ini disampaikan, terima kasih.</p>
                            </div>
                        ` : `
                            <div class="text-center pt-2 pb-1 space-y-1"><h3 class="text-base font-bold uppercase underline">${l.type}</h3><p class="text-xs font-mono">Nomor: ${l.number}</p></div>
                            <div class="text-xs leading-relaxed space-y-3 pt-3">
                                <p>Yang bertanda tangan di bawah ini ${state.settings.headTitle}${vName}, menerangkan bahwa:</p>
                                <div class="pl-6 space-y-1 py-1">
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Nama Lengkap</span><span class="col-span-8">: <strong>${l.name}</strong></span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">NIK</span><span class="col-span-8">: <span class="font-mono">${l.nik}</span></span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Tempat / Tgl Lahir</span><span class="col-span-8">: ${res.pob},${res.dob}</span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Gender</span><span class="col-span-8">: ${res.gender}</span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Pekerjaan</span><span class="col-span-8">: ${res.job}</span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Alamat</span><span class="col-span-8">: ${res.address} Desa${vName}</span></div>
                                </div>
                                <p>Berdasarkan data kependudukan, yang bersangkutan benar merupakan penduduk yang berdomisili di Desa ${vName}.</p>${l.includePurpose !== false ? `<div class="bg-slate-50 p-3 rounded-lg border font-medium text-slate-700 my-2"><strong>Keperluan:</strong> ${l.purpose}</div>` : ''}
                                <p>Demikian surat keterangan ini dibuat untuk dipergunakan sebagaimana mestinya.</p>
                            </div>
                        `}
                        ${l.photo ? `<div class="pt-4 border-t mt-4"><img src="${l.photo}" class="w-64 h-64 object-cover rounded-xl border shadow-md ${l.isScanned ? 'scan-effect' : ''}"></div>` : ''}
                        ${!isIncoming ? `
                            <div class="flex justify-end pt-12 text-xs">
                                <div class="text-center">
                                    <p>${vName},${l.date}</p>
                                    <p class="font-bold">${state.settings.headTitle}${vName}</p>
                                    <div class="h-16 flex items-center justify-center"><span class="text-[10px] bg-brand-50 text-brand-700 px-2 py-1 rounded font-mono border">[TTE / Stempel]</span></div>
                                    <p class="font-bold underline">${state.settings.headName}</p>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                </div>
                <div class="mt-6 flex justify-end space-x-3 no-print">
                    <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold">Tutup</button>
                    <button onclick="window.print()" class="px-5 py-2 bg-brand-600 text-white rounded-xl text-xs font-semibold shadow"><i class="fa-solid fa-print"></i><span>Cetak</span></button>
                </div>`);
        }

        async function changeModalPaperSize(id, size) {
            state.settings.paperSize = size;
            await saveSettingsToSupabase();
            previewLetter(id);
        }

        function showModal(title, msg, type = 'success', cb = null) {
            currentModalCallback = cb;
            document.getElementById('modalContent').innerHTML = `
                <div class="text-center space-y-4 py-4">
                    <div class="w-12 h-12 mx-auto rounded-full flex items-center justify-center text-xl ${type === 'success' ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'}"><i class="fa-solid ${type === 'success' ? 'fa-check' : 'fa-triangle-exclamation'}"></i></div>
                    <h3 class="font-bold text-lg text-slate-800">${title}</h3>
                    <p class="text-xs text-slate-600">${msg}</p>
                    <button onclick="closeModal(); if(currentModalCallback) { const fn = currentModalCallback; currentModalCallback = null; fn(); }" class="w-full bg-slate-900 text-white py-2.5 rounded-xl text-xs font-semibold">OK</button>
                </div>`;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function showConfirm(title, msg, onConfirm) {
            document.getElementById('modalContent').innerHTML = `
                <div class="text-center space-y-4 py-4">
                    <div class="w-12 h-12 mx-auto rounded-full flex items-center justify-center text-xl bg-amber-100 text-amber-600"><i class="fa-solid fa-triangle-exclamation"></i></div>
                    <h3 class="font-bold text-lg text-slate-800">${title}</h3>
                    <p class="text-xs text-slate-600">${msg}</p>
                    <div class="flex space-x-3 pt-2">
                        <button onclick="closeModal()" class="w-full bg-slate-200 text-slate-700 py-2.5 rounded-xl text-xs font-semibold">Batal</button>
                        <button id="modalConfirmYesBtn" class="w-full bg-red-600 text-white py-2.5 rounded-xl text-xs font-semibold shadow">Ya, Lanjutkan</button>
                    </div>
                </div>`;
            document.getElementById('customModal').classList.remove('hidden');
            document.getElementById('modalConfirmYesBtn').onclick = () => { closeModal(); if (onConfirm) onConfirm(); };
        }

        const showCustomModalHtml = html => { document.getElementById('modalContent').innerHTML = html; document.getElementById('customModal').classList.remove('hidden'); };
        const closeModal = () => document.getElementById('customModal').classList.add('hidden');

        document.addEventListener('DOMContentLoaded', async () => { await loadDataFromSupabase(); });
    </script>
</body>
</html>
