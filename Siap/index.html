        function compressImage(file, maxWidth = 900, maxHeight = 900, quality = 0.8) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) {
                                height *= maxWidth / width;
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width *= maxHeight / height;
                                height = maxHeight;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function isUserHeadVillage() {
            if (!state.currentUser) return false;

        async function loadDataFromSupabase() {
            if (!supabaseClient) return;
            try {
                const { data: setRow } = await supabaseClient.from('pengaturan_desa').select('*').eq('id', 1).single();
                if (setRow && setRow.config) {
                    state.settings = typeof setRow.config === 'string' ? JSON.parse(setRow.config) : setRow.config;
                    if(!state.settings.secretaryHiddenTabs) {
                        state.settings.secretaryHiddenTabs = ['pengguna', 'pengaturan'];
                    }
                }

                const { data: resData } = await supabaseClient.from('penduduk').select('*');
                if (resData && resData.length > 0) state.residents = resData;

                const { data: letterData } = await supabaseClient.from('surat_desa').select('*').order('created_at', { ascending: false });
                if (letterData && letterData.length > 0) {
                    state.letters = letterData.map(l => ({
                        id: l.id,
                        nik: l.nik,
                        name: l.name,
                        type: l.type,
                        code: l.code,
                        number: l.number,
                        date: l.date,
                        location: l.location || state.settings.desaShort || 'Kamiiri',
                        purpose: l.purpose,
                        invDayDate: l.inv_day_date || '',
                        invTime: l.inv_time || '',
                        invPlace: l.inv_place || '',
                        signMode: l.sign_mode || 'kades',
                        secretaryName: l.secretary_name || 'Sekretaris Desa',
                        status: l.status,
                        signedBy: l.signed_by,
                        sifat: l.sifat,
                        lampiran: l.lampiran,
                        includePurpose: l.include_purpose,
                        photo: l.photo,
                        isScanned: l.is_scanned
                    }));
                }

                const { data: agendaData } = await supabaseClient.from('agenda_surat').select('*').order('created_at', { ascending: false });
                if (agendaData && agendaData.length > 0) {
                    state.agenda = agendaData.map(a => ({
                        id: a.id,
                        type: a.type,
                        noSurat: a.no_surat,
                        from: a.surat_from,
                        date: a.date,
                        subject: a.subject,
                        status: a.status
                    }));
                }

                const { data: staffData } = await supabaseClient.from('staf_desa').select('*');
                if (staffData && staffData.length > 0) {
                    state.allowedUsers = staffData;
                }
            } catch (e) {
                console.warn('Mode offline aktif / gagal sync database:', e);
            }
            renderView();
        }

            const usernameInput = document.getElementById('loginUsername').value.trim();

            const matchedUser = state.allowedUsers.find(u => u.username === usernameInput);

            if (matchedUser && (passwordInput === 'admin123' || passwordInput === 'password')) {
                state.isLoggedIn = true;
                state.currentUser = { name: matchedUser.name, role: matchedUser.role, username: matchedUser.username };
                saveSession();
                renderView();
            } else if (usernameInput === 'admin' && passwordInput === 'admin123') {
                state.isLoggedIn = true;
                state.currentUser = { name: 'Admin', role: 'Kepala Desa', username: 'admin' };
                saveSession();
                renderView();

        async function handleIncomingPhotoUpload(event) {
            const file = event.target.files[0];
            if(file) {
                const compressed = await compressImage(file, 900, 900, 0.8);
                tempIncomingScanPhoto = compressed;
                tempIncomingIsScanned = false;
                const container = document.getElementById('incomingPhotoPreviewContainer');
                const img = document.getElementById('incomingPhotoImg');
                if(container && img) {
                    img.src = tempIncomingScanPhoto;
                    img.classList.remove('scan-effect');
                    container.classList.remove('hidden');
                }
            }
        }

        function toggleIncomingScanFilter() {
            tempIncomingIsScanned = !tempIncomingIsScanned;
            const img = document.getElementById('incomingPhotoImg');
            if(img) {
                if(tempIncomingIsScanned) img.classList.add('scan-effect');
                else img.classList.remove('scan-effect');
            }
        }

            tempIncomingScanPhoto = null;

        async function handleSaveIncomingScan(event) {
            event.preventDefault();
            const noSurat = document.getElementById('incomingNo').value;
            const from = document.getElementById('incomingFrom').value;
            const date = document.getElementById('incomingDate').value;
            const sifat = document.getElementById('incomingSifat').value;
            const subject = document.getElementById('incomingSubject').value;

            if(!tempIncomingScanPhoto) {
                showModal('Peringatan', 'Silakan unggah foto dokumen surat masuk!', 'error');
                return;
            }

            const newId = 'L-IN-' + Date.now().toString().slice(-4);
            const agId = 'AG-' + Date.now().toString().slice(-4);

            const newLetterObj = {
                id: newId,
                nik: null,
                name: from,
                type: 'Surat Masuk (Eksternal)',
                code: '005',
                number: noSurat,
                date: date,
                location: getVillageName(),
                purpose: subject,
                invDayDate: '',
                invTime: '',
                invPlace: '',
                signMode: 'kades',
                secretaryName: 'Sekretaris Desa',
                status: 'Disetujui',
                signedBy: from,
                sifat: sifat,
                lampiran: '1 Berkas',
                includePurpose: true,
                photo: tempIncomingScanPhoto,
                isScanned: tempIncomingIsScanned
            };

            const newAgendaObj = {
                id: agId,
                type: 'Masuk',
                noSurat: noSurat,
                from: from,
                date: date,
                subject: subject,
                status: 'Diterima & Diarsipkan'
            };

            await saveLetterToSupabase(newLetterObj);
            await saveAgendaToSupabase(newAgendaObj);

            state.letters.unshift(newLetterObj);
            state.agenda.unshift(newAgendaObj);

            tempIncomingScanPhoto = null;
            tempIncomingIsScanned = false;

            showModal('Berhasil!', `Surat masuk dari <strong>${from}</strong> berhasil dipindai dan disimpan.`, 'success', () => {
                switchTab('arsip');
            });
        }

        function getResidentOptionsHtml() {
            let options = '<option value="">-- Pilih Warga Penduduk --</option>';
            if (state.residents && state.residents.length > 0) {
                options += state.residents.map(r => `<option value="${r.nik}">${r.nik} - ${r.name}</option>`).join('');
            }
            if (state.settings && state.settings.excelResidents && state.settings.excelResidents.rows) {
                state.settings.excelResidents.rows.forEach(row => {
                    const keys = Object.keys(row);
                    const nikKey = keys.find(k => k.toLowerCase().includes('nik')) || keys[0];
                    const nameKey = keys.find(k => k.toLowerCase().includes('nama')) || keys[1];
                    const nik = row[nikKey] || '';
                    const name = row[nameKey] || '';
                    if (nik) {
                        options += `<option value="${nik}">${nik} - ${name}</option>`;
                    }
                });
            }
            return options;
        }

        function autofillResident(nik) {
            let res = state.residents.find(r => r.nik === nik);
            if (!res && state.settings && state.settings.excelResidents && state.settings.excelResidents.rows) {
                const row = state.settings.excelResidents.rows.find(r => {
                    const keys = Object.keys(r);
                    const nikKey = keys.find(k => k.toLowerCase().includes('nik')) || keys[0];
                    return String(r[nikKey]) === String(nik);
                });
                if (row) {
                    const keys = Object.keys(row);
                    const nikKey = keys.find(k => k.toLowerCase().includes('nik')) || keys[0];
                    const nameKey = keys.find(k => k.toLowerCase().includes('nama')) || keys[1];
                    const pobKey = keys.find(k => k.toLowerCase().includes('tempat') || k.toLowerCase().includes('pob')) || '';
                    const dobKey = keys.find(k => k.toLowerCase().includes('tanggal') || k.toLowerCase().includes('lahir')) || '';
                    const jobKey = keys.find(k => k.toLowerCase().includes('pekerjaan') || k.toLowerCase().includes('job')) || '';
                    const addrKey = keys.find(k => k.toLowerCase().includes('alamat') || k.toLowerCase().includes('address')) || '';
                    const genderKey = keys.find(k => k.toLowerCase().includes('kelamin') || k.toLowerCase().includes('gender')) || '';

                    res = {
                        nik: row[nikKey] || nik,
                        name: row[nameKey] || 'Warga',
                        pob: pobKey ? row[pobKey] : 'Paguat',
                        dob: dobKey ? row[dobKey] : '1990-01-01',
                        job: jobKey ? row[jobKey] : 'Warga',
                        gender: genderKey ? row[genderKey] : 'Laki-laki',
                        address: addrKey ? row[addrKey] : 'Desa'
                    };
                }
            }

            if(res) {
                document.getElementById('inputNik').value = res.nik;
                document.getElementById('inputName').value = res.name;
            } else {
                document.getElementById('inputNik').value = '';
                document.getElementById('inputName').value = '';
            }
        }

        async function handleGenerateLetter(event) {
            event.preventDefault();
            const letterTypeFull = document.getElementById('letterType').value;
            const [typeName, typeCode] = letterTypeFull.split('|');
            const nik = document.getElementById('inputNik').value;
            const name = document.getElementById('inputName').value;
            const purpose = document.getElementById('inputPurpose').value;
            const sifat = document.getElementById('inputSifat').value;
            const lampiran = document.getElementById('inputLampiran').value;
            const includePurpose = document.getElementById('inputIncludePurpose').checked;
            const letterLocation = document.getElementById('inputLocation').value;
            const letterDate = document.getElementById('inputDate').value;
            const signMode = document.getElementById('inputSignMode').value;
            const secretaryName = document.getElementById('inputSecretaryName') ? document.getElementById('inputSecretaryName').value : 'Sekretaris Desa';

            const invDayDate = document.getElementById('invDayDate') ? document.getElementById('invDayDate').value : '';
            const invTime = document.getElementById('invTime') ? document.getElementById('invTime').value : '';
            const invPlace = document.getElementById('invPlace') ? document.getElementById('invPlace').value : '';

            const vName = getVillageName();

            if(!nik && !typeName.includes('Undangan')) {
                showModal('Peringatan', 'Silakan pilih data penduduk terlebih dahulu!', 'error');
                return;
            }

            const newId = 'L-2026-' + String(state.letters.length + 1).padStart(3, '0');
            const agId = 'AG-' + Date.now().toString().slice(-4);
            const newNo = `${typeCode} / 0${state.letters.length + 1} / KMR.PGT / VIII / 2026`;

            const initialStatus = isUserHeadVillage() ? 'Disetujui' : 'Menunggu Validasi';

            const newLetter = {
                id: newId,
                nik: nik || '7501010000000000',
                name: name || 'Warga Desa ' + vName,
                type: typeName,
                code: typeCode,
                number: newNo,
                date: letterDate,
                location: letterLocation,
                purpose: purpose,
                invDayDate: invDayDate,
                invTime: invTime,
                invPlace: invPlace,
                signMode: signMode,
                secretaryName: secretaryName,
                status: initialStatus,
                signedBy: signMode === 'sekdes_an' ? secretaryName + ' (a.n. Kades)' : state.settings.headName + ' (' + state.settings.headTitle + ')',
                sifat: sifat,
                lampiran: lampiran,
                includePurpose: includePurpose,
                photo: null,
                isScanned: false
            };

            const newAgenda = {
                id: agId,
                type: 'Keluar',
                noSurat: newNo,
                from: vName,
                date: letterDate,
                subject: purpose,
                status: initialStatus === 'Disetujui' ? 'Terkirim' : 'Menunggu Validasi Kades'
            };

            await saveLetterToSupabase(newLetter);
            await saveAgendaToSupabase(newAgenda);

            state.letters.unshift(newLetter);
            state.agenda.unshift(newAgenda);

            if (!isUserHeadVillage()) {
                sendWhatsAppToKades(newLetter);
            }

            showModal('Sukses!', `Surat berhasil digenerate dengan status: <strong>${initialStatus}</strong>. Nomor: <br><strong class="font-mono text-brand-700">${newNo}</strong>`, 'success', () => {
                previewLetter(newId);
            });
        }

        async function handleExcelImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                    
                    if (jsonRows.length === 0) {
                        showModal('Peringatan', 'File Excel kosong.', 'error');
                        return;
                    }

                    const columns = Object.keys(jsonRows[0]);
                    state.settings.excelResidents = { columns, rows: jsonRows };
                    await saveSettingsToSupabase();
                    showModal('Berhasil!', `File Excel berhasil diimpor (${jsonRows.length} baris).`, 'success', () => renderActiveTabContent());
                } catch (err) {
                    showModal('Gagal', 'Gagal membaca file Excel.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

                                    ${state.allowedUsers.map(u => `
                                        <tr class="hover:bg-slate-50">
                                            <td class="p-4 font-semibold text-slate-800">${u.name}</td>
                                            <td class="p-4 font-mono text-xs text-brand-700">${u.username}</td>
                                            <td class="p-4 text-slate-600 text-xs">${u.role}</td>
                                            <td class="p-4 text-slate-600 text-xs">${u.email}</td>
                                            <td class="p-4"><span class="bg-emerald-100 text-emerald-700 px-2.5 py-1 text-xs rounded-full font-medium">${u.status}</span></td>
                                            <td class="p-4 text-center">
                                                <button onclick="removeUser(${u.id})" class="text-red-600 hover:text-red-800 text-xs font-semibold p-1.5 rounded bg-red-50 hover:bg-red-100"><i class="fa-solid fa-trash"></i> Hapus</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function openAddUserModal() {
            const html = `
                <div class="space-y-4">
                    <h3 class="font-bold text-lg text-slate-800">Tambah Akun Baru (Sekretaris / Staf)</h3>
                    <form onsubmit="handleSaveNewUser(event)" class="space-y-3">
                        <div><label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap:</label><input type="text" id="newUserName" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2 text-sm" placeholder="Nama Sekretaris"></div>
                        <div><label class="block text-xs font-semibold text-slate-600 mb-1">Username Login:</label><input type="text" id="newUserUsername" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2 text-sm font-mono" placeholder="sekdes"></div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Jabatan / Peran:</label>
                            <select id="newUserRole" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm">
                                <option value="Sekretaris Desa">Sekretaris Desa</option>
                                <option value="Operator Administrasi">Operator Administrasi</option>
                            </select>
                        </div>
                        <div><label class="block text-xs font-semibold text-slate-600 mb-1">Email:</label><input type="email" id="newUserEmail" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2 text-sm" placeholder="sekdes@pohuwato.desa.id"></div>
                        <div class="flex justify-end space-x-3 pt-2">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl">Batal</button>
                            <button type="submit" class="px-5 py-2 bg-brand-600 text-white text-xs font-semibold rounded-xl">Simpan Akun</button>
                        </div>
                    </form>
                </div>
            `;
            showCustomModalHtml(html);
        }

        async function handleSaveNewUser(e) {
            e.preventDefault();
            const newUser = {
                id: Date.now(),
                name: document.getElementById('newUserName').value,
                username: document.getElementById('newUserUsername').value,
                role: document.getElementById('newUserRole').value,
                email: document.getElementById('newUserEmail').value,
                status: 'Aktif'
            };
            await saveUserToSupabase(newUser);
            state.allowedUsers.push(newUser);
            closeModal();
            showModal('Sukses', 'Akun berhasil ditambahkan.', 'success', () => renderView());
        }

        async function removeUser(id) {
            if(state.allowedUsers.length <= 1) {
                showModal('Peringatan', 'Minimal harus ada 1 pengguna sistem.', 'error');
                return;
            }
            showConfirm('Cabut Akses', 'Hapus akses pengguna ini?', async () => {
                await deleteUserFromSupabase(id);
                state.allowedUsers = state.allowedUsers.filter(u => u.id !== id);
                renderActiveTabContent();
                showModal('Berhasil', 'Akses dicabut.', 'success');
            });
        }

        function renderPengaturanView() {
            const s = state.settings;
            const hiddenTabs = s.secretaryHiddenTabs || ['pengguna', 'pengaturan'];
            const allTabs = [
                { id: 'dashboard', label: 'Dashboard Utama' },
                { id: 'scan-masuk', label: 'Scan & Arsip Surat Masuk' },
                { id: 'layanan', label: 'Pembuatan Surat Desa' },
                { id: 'agenda', label: 'Buku Agenda Surat' },
                { id: 'arsip', label: 'Arsip Digital & Validasi' },
                { id: 'laporan', label: 'Rekapitulasi & Laporan PDF' },
                { id: 'penduduk', label: 'Data Penduduk' },
                { id: 'pengguna', label: 'Manajemen Hak Akses' },
                { id: 'pengaturan', label: 'Pengaturan Desa & Kop' }
            ];

            return `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
                        <div class="border-b border-slate-100 pb-4 mb-6 flex justify-between items-center">
                            <div>
                                <h3 class="text-lg font-bold text-slate-800">Pengaturan Tanda Tangan, Kop & Pembatasan Menu Sekretaris</h3>
                                <p class="text-xs text-slate-500">Kelola tanda tangan digital Kepala Desa dan pilih menu yang disembunyikan dari Sekretaris.</p>
                            </div>
                            <button type="button" onclick="resetToDefaultState()" class="px-3 py-1.5 bg-red-50 text-red-600 hover:bg-red-100 text-xs font-semibold rounded-xl border border-red-200">
                                Reset Default
                            </button>
                        </div>

                        <form onsubmit="handleSaveSettings(event)" class="space-y-6">
                            <!-- TANDA TANGAN DIGITAL KEPALA DESA -->
                            <div class="p-5 bg-emerald-50/70 rounded-2xl border border-emerald-200 space-y-4">
                                <h4 class="font-bold text-emerald-900 text-xs uppercase tracking-wider"><i class="fa-solid fa-signature mr-1"></i> Tanda Tangan Digital Kepala Desa (Untuk Validasi Surat)</h4>
                                <p class="text-xs text-emerald-700">Unggah file gambar tanda tangan Kepala Desa (format PNG transparan lebih disukai). Tanda tangan ini akan otomatis muncul pada surat jika sudah divalidasi.</p>
                                <input type="file" accept="image/*" onchange="uploadSignatureFile(event)" class="text-xs text-slate-700 bg-white border border-emerald-300 rounded-xl p-2 w-full">
                                ${s.headSignature ? `
                                    <div class="mt-2 bg-white p-3 rounded-xl border border-emerald-300 inline-block">
                                        <p class="text-[11px] font-semibold text-slate-600 mb-1">Pratinjau Tanda Tangan Aktif:</p>
                                        <img src="${s.headSignature}" class="h-16 object-contain bg-slate-50 p-1 rounded">
                                    </div>
                                ` : ''}
                            </div>

                            <!-- PENGATURAN MENU DISEMBUNYIKAN DARI SEKRETARIS -->
                            <div class="p-5 bg-amber-50/70 rounded-2xl border border-amber-200 space-y-3">
                                <h4 class="font-bold text-amber-900 text-xs uppercase tracking-wider"><i class="fa-solid fa-eye-slash mr-1"></i> Batasi Menu untuk Akun Sekretaris</h4>
                                <p class="text-xs text-amber-800">Centang menu di bawah ini agar <strong>tidak tampil</strong> di akun Sekretaris (Kepala Desa/Admin tetap dapat melihat semua menu):</p>
                                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 pt-2">
                                    ${allTabs.map(t => `
                                        <label class="flex items-center space-x-2 text-xs font-semibold text-slate-700 bg-white p-2.5 rounded-xl border border-amber-200 cursor-pointer">
                                            <input type="checkbox" name="hiddenTab" value="${t.id}" ${hiddenTabs.includes(t.id) ? 'checked' : ''} class="w-4 h-4 text-brand-600 rounded border-slate-300">
                                            <span>${t.label}</span>
                                        </label>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Paper Size & Pejabat -->
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4 bg-slate-50 rounded-2xl border border-slate-200">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Ukuran Kertas:</label>
                                    <select id="setPaperSize" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold">
                                        <option value="A4" ${s.paperSize === 'A4' ? 'selected' : ''}>A4</option>
                                        <option value="F4" ${s.paperSize === 'F4' ? 'selected' : ''}>F4 (Folio)</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Pejabat Kades:</label>
                                    <input type="text" id="setHeadName" value="${s.headName || 'Admin'}" required class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Jabatan:</label>
                                    <input type="text" id="setHeadTitle" value="${s.headTitle || 'Kepala Desa'}" required class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs">
                                </div>
                            </div>

                            <div class="p-4 bg-brand-50/50 rounded-2xl border border-brand-200 space-y-4">
                                <h4 class="font-bold text-brand-900 text-xs uppercase tracking-wider">Konfigurasi Kop Surat</h4>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div><label class="block text-xs font-semibold text-slate-700 mb-1">Baris 1:</label><input type="text" id="setKop1" value="${s.kopLine1}" required class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs"></div>
                                    <div><label class="block text-xs font-semibold text-slate-700 mb-1">Baris 2:</label><input type="text" id="setKop2" value="${s.kopLine2}" required class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs"></div>
                                    <div><label class="block text-xs font-semibold text-slate-700 mb-1">Baris 3 (Nama Desa):</label><input type="text" id="setKop3" value="${s.kopLine3}" required class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs"></div>

                                </div>
                                <div><label class="block text-xs font-semibold text-slate-700 mb-1">Nama Singkat Desa:</label><input type="text" id="setDesaShort" value="${s.desaShort}" required class="w-full md:w-1/2 bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs"></div>
                            </div>

                            <div class="pt-6 border-t border-slate-100 flex justify-end">
                                <button type="submit" class="px-6 py-2.5 rounded-xl bg-brand-600 text-white text-sm font-semibold shadow hover:bg-brand-700 transition">
                                    Simpan Pengaturan
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        async function handleSaveSettings(event) {
            event.preventDefault();
            const checkedTabs = Array.from(document.querySelectorAll('input[name="hiddenTab"]:checked')).map(cb => cb.value);

            state.settings.paperSize = document.getElementById('setPaperSize').value;
            state.settings.headName = document.getElementById('setHeadName').value;
            state.settings.headTitle = document.getElementById('setHeadTitle').value;
            state.settings.kopLine1 = document.getElementById('setKop1').value;
            state.settings.kopLine2 = document.getElementById('setKop2').value;
            state.settings.kopLine3 = document.getElementById('setKop3').value;
            state.settings.kopLine4 = document.getElementById('setKop4').value;
            state.settings.desaShort = document.getElementById('setDesaShort').value;
            state.settings.secretaryHiddenTabs = checkedTabs;

            await saveSettingsToSupabase();
            showModal('Berhasil', 'Pengaturan berhasil disimpan!', 'success', () => renderView());
        }

        function previewLetter(id) {
            const l = state.letters.find(item => item.id === id);
            if (!l) return;
            const res = state.residents.find(item => item.nik === l.nik) || { pob: 'Paguat', dob: '1990-01-01', job: 'Warga', gender: 'Laki-laki', address: 'Dsn I Desa Kamiiri' };
            const vName = getVillageName();
            const letterLoc = l.location || vName;
            const pSize = state.settings.paperSize || 'A4';
            const isApproved = l.status === 'Disetujui';
            const isInvitation = l.type.includes('Undangan');

            let signatureBlockHtml = '';
            if (l.signMode === 'sekdes_an') {
                signatureBlockHtml = `
                    <div class="text-center">
                        <p>${letterLoc}, ${l.date}</p>
                        <p class="font-bold">a.n. KEPALA DESA ${vName.toUpperCase()}</p>
                        <p class="font-bold">SEKRETARIS DESA</p>
                        <div class="h-20 flex items-center justify-center relative my-1">
                            ${isApproved && state.settings.headSignature ? `
                                <img src="${state.settings.headSignature}" class="h-20 max-w-[160px] object-contain absolute -top-2" alt="Tanda Tangan Sekretaris">
                            ` : `
                                <span class="text-[10px] text-amber-600 font-semibold">[ ${isApproved ? 'TTE Belum Diunggah' : 'Menunggu Validasi'} ]</span>
                            `}
                        </div>
                        <p class="font-bold underline">${l.secretaryName || 'Sekretaris Desa'}</p>
                    </div>
                `;
            } else {
                signatureBlockHtml = `
                    <div class="text-center">
                        <p>${letterLoc}, ${l.date}</p>
                        <p class="font-bold">${state.settings.headTitle} ${vName}</p>
                        <div class="h-20 flex items-center justify-center relative my-1">
                            ${isApproved && state.settings.headSignature ? `
                                <img src="${state.settings.headSignature}" class="h-20 max-w-[160px] object-contain absolute -top-2" alt="Tanda Tangan Kepala Desa">
                            ` : `
                                <span class="text-[10px] text-amber-600 font-semibold">[ ${isApproved ? 'TTE Belum Diunggah' : 'Menunggu Validasi Kades'} ]</span>
                            `}
                        </div>
                        <p class="font-bold underline">${state.settings.headName}</p>
                    </div>
                `;
            }

            const modalHtml = `
                <div class="flex justify-between items-center mb-4 no-print bg-slate-100 p-3 rounded-xl border border-slate-200">
                    <div class="flex items-center space-x-2">
                        <span class="text-xs font-bold text-slate-700">Status Surat:</span>
                        <span class="px-2.5 py-1 text-xs rounded-full font-bold ${isApproved ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${l.status}</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        ${!isApproved && isUserHeadVillage() ? `
                            <button onclick="validateLetterByKades('${l.id}')" class="px-4 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-bold shadow hover:bg-emerald-700 animate-pulse">
                                <i class="fa-solid fa-signature mr-1"></i> Validasi & Tanda Tangan Sekarang
                            </button>
                        ` : ''}
                        <button onclick="window.print()" class="px-4 py-1.5 bg-slate-900 text-white rounded-lg text-xs font-semibold">Cetak</button>
                    </div>
                </div>

                <div class="flex justify-center bg-slate-200/60 p-4 rounded-xl overflow-x-auto">
                    <div id="printable-letter" class="bg-white p-12 shadow-2xl border border-slate-300 text-slate-800 space-y-4 ${getPaperDimensionsClass(pSize)}">
                        ${renderKopSuratHtml(state.settings)}

                        <div class="text-center pt-2 pb-1 space-y-1">
                            <h3 class="text-base font-bold uppercase underline tracking-wide">${l.type}</h3>
                            <p class="text-xs font-mono">Nomor: ${l.number}</p>
                        </div>

                        <div class="text-xs leading-relaxed space-y-3 pt-3">
                            ${isInvitation ? `
                                <p>Kepada Yth.<br><strong>${l.name}</strong><br>di Tempat</p>
                                <p>Dengan hormat, sehubungan dengan kegiatan pemerintahan desa, kami mengundang Bapak/Ibu/Saudara(i) untuk hadir dalam acara yang akan diselenggarakan pada:</p>
                                
                                <div class="pl-6 space-y-1 py-1 my-2 bg-slate-50 p-3 rounded-lg border border-slate-200">
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Hari / Tanggal</span><span class="col-span-8">: ${l.invDayDate || '-'}</span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Pukul / Waktu</span><span class="col-span-8">: ${l.invTime || '-'}</span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Tempat</span><span class="col-span-8">: ${l.invPlace || '-'}</span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Agenda / Perihal</span><span class="col-span-8">: <strong>${l.purpose}</strong></span></div>
                                </div>

                                <p>Demikian undangan ini disampaikan atas perhatian dan kehadiran Bapak/Ibu/Saudara(i) kami ucapkan terima kasih.</p>
                            ` : `
                                <p>Yang bertanda tangan di bawah ini ${state.settings.headTitle}${vName} Kecamatan Paguat Kabupaten Pohuwato, menerangkan dengan sebenarnya bahwa:</p>
                                
                                <div class="pl-6 space-y-1 py-1">
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Nama Lengkap</span><span class="col-span-8">: <strong>${l.name}</strong></span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">NIK / No. KTP</span><span class="col-span-8">: <span class="font-mono">${l.nik}</span></span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Tempat / Tgl. Lahir</span><span class="col-span-8">: ${res.pob},${res.dob}</span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Jenis Kelamin</span><span class="col-span-8">: ${res.gender}</span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Pekerjaan</span><span class="col-span-8">: ${res.job}</span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Alamat / Domisili</span><span class="col-span-8">: ${res.address} Desa${vName}</span></div>
                                </div>

                                <p>Berdasarkan data kependudukan dan keterangan yang ada pada kami, yang bersangkutan benar-benar merupakan penduduk yang berdomisili / memiliki keperluan di Desa ${vName} Kecamatan Paguat Kabupaten Pohuwato.</p>

                                <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 font-medium text-slate-700 my-2">
                                    <strong>Keperluan / Perihal Surat:</strong> ${l.purpose}
                                </div>

                                <p>Demikian surat keterangan ini dibuat dengan sebenarnya dan diberikan kepada yang bersangkutan untuk dapat dipergunakan sebagaimana mestinya.</p>
                            `}
                        </div>

                        <div class="flex justify-end pt-12 text-xs">
                            ${signatureBlockHtml}
                        </div>
                    </div>
                </div>

                <div class="mt-6 flex justify-end space-x-3 no-print">
                    <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold">Tutup</button>
                    <button onclick="window.print()" class="px-5 py-2 bg-brand-600 text-white rounded-xl text-xs font-semibold shadow">Cetak Dokumen</button>
                </div>
            `;
            showCustomModalHtml(modalHtml);
        }

        let currentModalCallback = null;

        function showModal(title, message, type = 'success', callback = null) {
            currentModalCallback = callback;
            const content = `
                <div class="text-center space-y-4 py-4">
                    <div class="w-12 h-12 mx-auto rounded-full flex items-center justify-center text-xl ${type === 'success' ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'}">
                        <i class="fa-solid ${type === 'success' ? 'fa-check' : 'fa-triangle-exclamation'}"></i>
                    </div>
                    <h3 class="font-bold text-lg text-slate-800">${title}</h3>
                    <p class="text-xs text-slate-600">${message}</p>
                    <button onclick="closeModal(); if(currentModalCallback) { const cb = currentModalCallback; currentModalCallback = null; cb(); }" class="w-full bg-slate-900 text-white py-2.5 rounded-xl text-xs font-semibold">OK</button>
                </div>
            `;
            const modalContentEl = document.getElementById('modalContent');
            const customModalEl = document.getElementById('customModal');
            if (modalContentEl && customModalEl) {
                modalContentEl.innerHTML = content;
                customModalEl.classList.remove('hidden');
            }
        }

        function showConfirm(title, message, onConfirm) {
            const html = `
                <div class="text-center space-y-4 py-4">
                    <div class="w-12 h-12 mx-auto rounded-full flex items-center justify-center text-xl bg-amber-100 text-amber-600">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                    <h3 class="font-bold text-lg text-slate-800">${title}</h3>
                    <p class="text-xs text-slate-600">${message}</p>
                    <div class="flex space-x-3 pt-2">
                        <button onclick="closeModal()" class="w-full bg-slate-200 text-slate-700 py-2.5 rounded-xl text-xs font-semibold">Batal</button>
                        <button id="modalConfirmYesBtn" class="w-full bg-red-600 text-white py-2.5 rounded-xl text-xs font-semibold shadow">Ya, Lanjutkan</button>
                    </div>
                </div>
            `;
            const modalContentEl = document.getElementById('modalContent');
            const customModalEl = document.getElementById('customModal');
            if (modalContentEl && customModalEl) {
                modalContentEl.innerHTML = html;
                customModalEl.classList.remove('hidden');
                document.getElementById('modalConfirmYesBtn').onclick = () => {
                    closeModal();
                    if(onConfirm) onConfirm();
                };
            }
        }

        function showCustomModalHtml(html) {
            const modalContentEl = document.getElementById('modalContent');
            const customModalEl = document.getElementById('customModal');
            if (modalContentEl && customModalEl) {
                modalContentEl.innerHTML = html;
                customModalEl.classList.remove('hidden');
            }
        }

        function closeModal() {
            const customModalEl = document.getElementById('customModal');
            if (customModalEl) customModalEl.classList.add('hidden');
        }

        // Render awal instan, lalu sync database di latar belakang
        document.addEventListener('DOMContentLoaded', () => {
            renderView();
            if (supabaseClient) {
                loadDataFromSupabase();
            }
        });
    </script>
</body>
</html>
