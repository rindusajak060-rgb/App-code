        function compressImage(file, maxWidth = 900, maxHeight = 900, quality = 0.8) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > maxWidth) { h *= maxWidth / w; w = maxWidth; } }
                        else { if (h > maxHeight) { w *= maxHeight / h; h = maxHeight; } }
                        const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function loadDataFromSupabase() {
            try {
                const { data: setRow } = await supabaseClient.from('pengaturan_desa').select('*').eq('id', 1).single();
                if (setRow?.config) state.settings = typeof setRow.config === 'string' ? JSON.parse(setRow.config) : setRow.config;
                
                const { data: resData } = await supabaseClient.from('penduduk').select('*');
                state.residents = resData || [];

                const { data: letterData } = await supabaseClient.from('surat_desa').select('*').order('created_at', { ascending: false });
                state.letters = letterData?.map(l => ({ ...l, signedBy: l.signed_by, includePurpose: l.include_purpose, isScanned: l.is_scanned })) || [];

                const { data: agendaData } = await supabaseClient.from('agenda_surat').select('*').order('created_at', { ascending: false });
                state.agenda = agendaData?.map(a => ({ ...a, noSurat: a.no_surat, from: a.surat_from })) || [];

                const { data: staffData } = await supabaseClient.from('staf_desa').select('*');
                state.allowedUsers = staffData || [{ id: 1, name: 'Admin', username: 'admin', role: 'Administrator / Kepala Desa', status: 'Aktif', email: 'admin@pohuwato.desa.id' }];
            } catch (e) { console.error(e); }
            renderView();
        }

        const deleteLetterFromSupabase = (id) => supabaseClient.from('surat_desa').delete().eq('id', id);
        const saveAgendaToSupabase = (a) => supabaseClient.from('agenda_surat').upsert({ id: a.id, type: a.type, no_surat: a.noSurat, surat_from: a.from, date: a.date, subject: a.subject, status: a.status });

        function exportResidentsToExcel() {

            const ws = XLSX.utils.json_to_sheet(data), wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Penduduk");
            XLSX.writeFile(wb, "Data_Penduduk_Desa.xlsx");
        }

        async function handleExcelImport(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
                if (rows.length === 0) { showModal('Peringatan', 'File Excel kosong.', 'error'); return; }
                state.settings.excelResidents = { columns: Object.keys(rows[0]), rows };
                await saveSettingsToSupabase();
                showModal('Berhasil!', `Excel diimpor (${rows.length} baris).`, 'success', () => renderActiveTabContent());
            };
            reader.readAsArrayBuffer(file);
        }

                        <h4 class="font-bold text-blue-900 text-xs uppercase">Ukuran Kertas Dokumen</h4>
                        <select id="setPaperSize" class="w-full bg-white border border-blue-300 rounded-xl px-4 py-2.5 text-sm font-semibold">
                            <option value="A4" ${s.paperSize === 'A4' ? 'selected' : ''}>A4 (210 × 297 mm)</option>
                            <option value="F4" ${s.paperSize === 'F4' ? 'selected' : ''}>F4 / Folio (215 × 330 mm)</option>
                        </select>
                    </div>
                    <div class="p-4 bg-emerald-50/60 rounded-2xl border border-emerald-200 space-y-4">
                        <h4 class="font-bold text-emerald-900 text-xs uppercase">Pejabat Penandatangan</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="block text-xs font-semibold mb-1">Nama:</label><input type="text" id="setHeadName" value="${s.headName}" required class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2 text-sm"></div>
                            <div><label class="block text-xs font-semibold mb-1">Jabatan:</label><input type="text" id="setHeadTitle" value="${s.headTitle}" required class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2 text-sm"></div>
                        </div>
                    </div>
                    <div class="p-4 bg-brand-50/50 rounded-2xl border border-brand-200 space-y-4">
                        <h4 class="font-bold text-brand-900 text-xs uppercase">Konfigurasi Baris Kop Surat</h4>
                        ${[1,2,3,4].map(i => `<div class="grid grid-cols-1 md:grid-cols-6 gap-3 items-end">
                            <div class="md:col-span-2"><label class="block text-xs font-semibold mb-1">Baris ${i}:</label><input type="text" id="setKop${i}" value="${s['kopLine'+i]}" required class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2 text-sm"></div>
                            <div><label class="block text-xs font-semibold mb-1">Ukuran:</label><input type="number" id="setSize${i}" value="${s['sizeLine'+i]}" required class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs"></div>
                            <div><label class="block text-xs font-semibold mb-1">Tebal:</label><select id="setWeight${i}" class="w-full bg-white border border-slate-300 rounded-xl px-2 py-2 text-xs">${renderWeightOptions(s['weightLine'+i])}</select></div>
                            <div><label class="block text-xs font-semibold mb-1">Spasi:</label><input type="text" id="setSpace${i}" value="${s['spaceLine'+i]}" required class="w-full bg-white border border-slate-300 rounded-xl px-2 py-2 text-xs"></div>
                            <div><label class="block text-xs font-semibold mb-1">Font:</label><select id="setFont${i}" class="w-full bg-white border border-slate-300 rounded-xl px-2 py-2 text-xs">${renderFontOptions(s['fontLine'+i])}</select></div>
                        </div>`).join('')}
                        <div><label class="block text-xs font-semibold mb-1">Nama Singkat Desa:</label><input type="text" id="setDesaShort" value="${s.desaShort}" required class="w-full md:w-1/2 bg-white border border-slate-300 rounded-xl px-4 py-2 text-sm"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-4 bg-slate-50 rounded-2xl border border-slate-200">
                        <div><label class="block text-xs font-semibold mb-2">Jumlah Logo:</label><select id="setLogoCount" onchange="document.getElementById('logo2Container').classList.toggle('opacity-40', this.value==='1'); document.getElementById('logo2Container').classList.toggle('pointer-events-none', this.value==='1');" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2 text-sm"><option value="1" ${s.logoCount==='1'?'selected':''}>1 Logo</option><option value="2" ${s.logoCount==='2'?'selected':''}>2 Logo</option></select></div>
                        <div><label class="block text-xs font-semibold mb-2">Perataan Teks (Align):</label><select id="setAlign" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2 text-sm"><option value="center" ${s.align==='center'?'selected':''}>Rata Tengah</option><option value="left" ${s.align==='left'?'selected':''}>Rata Kiri</option><option value="right" ${s.align==='right'?'selected':''}>Rata Kanan</option></select></div>
                    </div>
                    <div class="space-y-4 p-4 bg-slate-50 rounded-2xl border border-slate-200">
                        <h4 class="font-bold text-slate-800 text-xs uppercase">Ukuran & File Logo</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pb-4 border-b">
                            <div><label class="block text-xs font-semibold mb-1">Tinggi (px):</label><input type="number" id="setLogoHeight" value="${s.logoHeight}" required class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs"></div>
                            <div><label class="block text-xs font-semibold mb-1">Lebar (px):</label><input type="number" id="setLogoWidth" value="${s.logoWidth}" required class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs"></div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="space-y-2"><label class="block text-xs font-semibold">Logo Aplikasi:</label><input type="url" id="setAppLogo" value="${s.appLogo}" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-mono"><input type="file" accept="image/*" onchange="uploadLogoFile(event, 'appLogo')" class="text-xs"></div>
                            <div class="space-y-2"><label class="block text-xs font-semibold">Logo Kiri:</label><input type="url" id="setLogo1" value="${s.logo1}" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-mono"><input type="file" accept="image/*" onchange="uploadLogoFile(event, 'logo1')" class="text-xs"></div>
                            <div id="logo2Container" class="space-y-2 ${s.logoCount==='1'?'opacity-40 pointer-events-none':''}"><label class="block text-xs font-semibold">Logo Kanan:</label><input type="url" id="setLogo2" value="${s.logo2}" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-mono"><input type="file" accept="image/*" onchange="uploadLogoFile(event, 'logo2')" class="text-xs"></div>
                        </div>
                    </div>
                    <div class="pt-6 border-t flex justify-end"><button type="submit" class="px-6 py-2.5 rounded-xl bg-brand-600 text-white text-sm font-semibold shadow hover:bg-brand-700"><i class="fa-solid fa-floppy-disk mr-2"></i> Simpan Pengaturan</button></div>
                </form></div>
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 space-y-4"><h4 class="font-bold text-slate-800 text-sm">Pratinjau Langsung Kop</h4><div id="liveKopPreview" class="border border-slate-300 p-4 bg-slate-50 rounded-xl overflow-x-auto"></div></div></div>`;
        }

        async function handleSaveSettings(e) {
            e.preventDefault();
            ['PaperSize', 'HeadName', 'HeadTitle', 'DesaShort', 'AppLogo', 'Logo1', 'Logo2', 'LogoCount', 'Align', 'LogoHeight', 'LogoWidth'].forEach(k => state.settings[k.charAt(0).toLowerCase() + k.slice(1)] = document.getElementById('set' + k).value);
            [1,2,3,4].forEach(i => { ['Kop', 'Size', 'Weight', 'Space', 'Font'].forEach(f => state.settings[f.charAt(0).toLowerCase() + f.slice(1) + 'Line' + i] = document.getElementById('set' + f + i).value); });
            await saveSettingsToSupabase();
            showModal('Berhasil', 'Pengaturan tersimpan!', 'success', () => renderActiveTabContent());
        }

        function previewLetter(id) {
            const l = state.letters.find(x => x.id === id), res = state.residents.find(x => x.nik === l.nik) || { pob: 'Paguat', dob: '1990-01-01', job: 'Warga', gender: 'Laki-laki', address: 'Dsn I Desa Kamiiri' }, vName = getVillageName(), pSize = state.settings.paperSize || 'A4', isIncoming = l.type === 'Surat Masuk (Eksternal)';
            showCustomModalHtml(`
                <div class="flex justify-between items-center mb-4 no-print bg-slate-100 p-3 rounded-xl border">
                    <div><span class="text-xs font-bold">Ukuran Kertas:</span><span class="ml-2 bg-brand-100 text-brand-800 text-xs font-mono font-bold px-2 py-0.5 rounded">${pSize}</span></div>
                    <div class="flex space-x-2"><button onclick="state.settings.paperSize='A4'; saveSettingsToSupabase(); previewLetter('${id}');" class="px-3 py-1 rounded text-xs font-semibold ${pSize==='A4'?'bg-brand-600 text-white':'bg-white border'}">A4</button><button onclick="state.settings.paperSize='F4'; saveSettingsToSupabase(); previewLetter('${id}');" class="px-3 py-1 rounded text-xs font-semibold ${pSize==='F4'?'bg-brand-600 text-white':'bg-white border'}">F4</button></div>
                </div>
                <div class="flex justify-center bg-slate-200/60 p-4 rounded-xl overflow-x-auto">
                    <div id="printable-letter" class="bg-white p-12 shadow-2xl border border-slate-300 text-slate-800 space-y-4 ${getPaperDimensionsClass(pSize)}">
                        ${renderKopSuratHtml(state.settings)}
                        ${isIncoming ? `
                            <div class="text-center pt-2 pb-1 space-y-1"><h3 class="text-base font-bold uppercase underline text-emerald-800">Arsip Surat Masuk Eksternal</h3><p class="text-xs font-mono">Nomor: ${l.number}</p></div>
                            <div class="text-xs leading-relaxed space-y-3 pt-3 border-b pb-4">
                                <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Pengirim</span><span class="col-span-8">: <strong>${l.name}</strong></span></div>
                                <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Tanggal</span><span class="col-span-8">: ${l.date}</span></div>
                                <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Sifat / Lampiran</span><span class="col-span-8">: ${l.sifat \vert{}\vert{} 'Penting'} /${l.lampiran || '-'}</span></div>
                                <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Perihal</span><span class="col-span-8 font-medium">${l.purpose}</span></div>
                            </div>
                        ` : l.type.includes('Undangan') ? `
                            <div class="grid grid-cols-2 text-xs pt-1 pb-2">
                                <div class="space-y-0.5"><div class="flex"><span class="w-20">Nomor</span><span class="mr-2">:</span><span class="font-mono">${l.number}</span></div><div class="flex"><span class="w-20">Sifat</span><span class="mr-2">:</span><span>${l.sifat || 'Penting'}</span></div><div class="flex"><span class="w-20">Perihal</span><span class="mr-2">:</span><span class="font-semibold">Undangan</span></div></div>
                                <div class="text-right space-y-0.5"><p>${vName}, 04 Agustus 2026</p><p class="pt-2">Kepada Yth:</p><p class="font-semibold">Tempat</p></div>
                            </div>
                            <div class="text-xs leading-relaxed space-y-3 pt-2">
                                <p class="font-semibold">Dengan Hormat,</p><p>Sehubungan dengan ${l.purpose}, kami mengundang Bapak/Ibu untuk hadir pada:</p>
                                <div class="pl-4 space-y-1 my-2"><div class="flex"><span class="w-24">Hari / Tanggal</span><span>: Senin, 10 Agustus 2026</span></div><div class="flex"><span class="w-24">Waktu</span><span>: 14.00 WITA</span></div><div class="flex"><span class="w-24">Tempat</span><span>: Kantor Desa ${vName}</span></div></div>
                                <p>Demikian undangan ini disampaikan, atas perhatiannya diucapkan terima kasih.</p>
                            </div>
                        ` : `
                            <div class="text-center pt-2 pb-1 space-y-1"><h3 class="text-base font-bold uppercase underline">${l.type}</h3><p class="text-xs font-mono">Nomor: ${l.number}</p></div>
                            <div class="text-xs leading-relaxed space-y-3 pt-3">
                                <p>Yang bertanda tangan di bawah ini ${state.settings.headTitle} Desa${vName}, menerangkan bahwa:</p>
                                <div class="pl-6 space-y-1 py-1">
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Nama</span><span class="col-span-8">: <strong>${l.name}</strong></span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">NIK</span><span class="col-span-8">: <span class="font-mono">${l.nik}</span></span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">TTL</span><span class="col-span-8">: ${res.pob},${res.dob}</span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Pekerjaan</span><span class="col-span-8">: ${res.job}</span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Alamat</span><span class="col-span-8">: ${res.address} Desa${vName}</span></div>
                                </div>
                                <p>Berdasarkan data kami, yang bersangkutan benar penduduk berdomisili di Desa ${vName}.</p>${l.includePurpose !== false ? `<div class="bg-slate-50 p-3 rounded-lg border font-medium text-slate-700 my-2"><strong>Keperluan:</strong> ${l.purpose}</div>` : ''}
                                <p>Demikian surat keterangan ini dibuat untuk dipergunakan sebagaimana mestinya.</p>
                            </div>
                        `}
                        ${l.photo ? `<div class="pt-4 border-t mt-4"><p class="text-xs font-bold text-slate-700 mb-2"><i class="fa-solid fa-camera text-emerald-600"></i> Foto Dokumen:</p><img src="${l.photo}" class="w-64 h-64 object-cover rounded-xl border shadow-md ${l.isScanned ? 'scan-effect' : ''}"></div>` : ''}
                        ${!isIncoming ? `<div class="flex justify-end pt-12 text-xs"><div class="text-center"><p>${vName},${l.date}</p><p class="font-bold">${state.settings.headTitle}${vName}</p><div class="h-16 flex items-center justify-center text-[10px] text-brand-700">[TTE / Stempel]</div><p class="font-bold underline">${state.settings.headName}</p></div></div>` : ''}
                    </div>
                </div>
                <div class="mt-6 flex justify-end space-x-3 no-print">
                    <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 rounded-xl text-xs font-semibold">Tutup</button>
                    <button onclick="window.print()" class="px-5 py-2 bg-brand-600 text-white rounded-xl text-xs font-semibold shadow hover:bg-brand-700"><i class="fa-solid fa-print mr-2"></i> Cetak</button>
                </div>`);
        }

        let modalCb = null;
        function showModal(title, msg, type = 'success', cb = null) {
            modalCb = cb;
            document.getElementById('modalContent').innerHTML = `<div class="text-center space-y-4 py-4">
                <div class="w-12 h-12 mx-auto rounded-full flex items-center justify-center text-xl ${type === 'success' ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'}"><i class="fa-solid ${type === 'success' ? 'fa-check' : 'fa-triangle-exclamation'}"></i></div>
                <h3 class="font-bold text-lg text-slate-800">${title}</h3><p class="text-xs text-slate-600">${msg}</p>
                <button onclick="closeModal(); if(modalCb){const c=modalCb; modalCb=null; c();}" class="w-full bg-slate-900 text-white py-2.5 rounded-xl text-xs font-semibold">OK</button></div>`;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function showConfirm(title, msg, onConfirm) {
            document.getElementById('modalContent').innerHTML = `<div class="text-center space-y-4 py-4">
                <div class="w-12 h-12 mx-auto rounded-full flex items-center justify-center text-xl bg-amber-100 text-amber-600"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <h3 class="font-bold text-lg text-slate-800">${title}</h3><p class="text-xs text-slate-600">${msg}</p>
                <div class="flex space-x-3 pt-2"><button onclick="closeModal()" class="w-full bg-slate-200 py-2.5 rounded-xl text-xs font-semibold">Batal</button><button id="mYes" class="w-full bg-red-600 text-white py-2.5 rounded-xl text-xs font-semibold shadow">Ya, Lanjutkan</button></div></div>`;
            document.getElementById('customModal').classList.remove('hidden');
            document.getElementById('mYes').onclick = () => { closeModal(); if(onConfirm) onConfirm(); };
        }

        function showCustomModalHtml(html) {
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('customModal').classList.add('hidden'); }

        document.addEventListener('DOMContentLoaded', () => loadDataFromSupabase());
    </script>
</body>
</html>
