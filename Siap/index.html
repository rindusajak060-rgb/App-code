        // Fungsi kompresi gambar agar ringan & aman masuk Supabase tabel pengaturan_desa
        function compressImage(file, maxWidth = 250, maxHeight = 250, quality = 0.85) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) {
                                height *= maxWidth / width;
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width *= maxHeight / height;
                                height = maxHeight;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function loadSettingsFromSupabase() {
            try {
                const { data, error } = await supabaseClient
                    .from('pengaturan_desa')
                    .select('*')
                    .eq('id', 1)
                    .single();
                
                if (data && data.config) {
                    state.settings = typeof data.config === 'string' ? JSON.parse(data.config) : data.config;
                }
            } catch (e) {
                console.log('Memuat dari tabel pengaturan_desa:', e);
            }
            renderView();
        }

        async function saveSettingsToSupabase() {
            try {
                const { error } = await supabaseClient
                    .from('pengaturan_desa')
                    .upsert({ 
                        id: 1, 
                        config: state.settings,
                        updated_at: new Date()
                    });
                
                if (error) {
                    console.error('Gagal sinkronisasi ke Supabase:', error);
                } else {
                    console.log('Pengaturan & Logo berhasil disinkronkan ke tabel pengaturan_desa.');
                }
            } catch (err) {
                console.error('Error Supabase:', err);
            }
        }

        function renderActiveTabContent() {

            if(state.activeTab === 'dashboard') {
                if(titleEl) titleEl.innerText = 'Dashboard Utama Desa ' + vName;
                container.innerHTML = renderDashboardView();
            } else if(state.activeTab === 'layanan') {
                if(titleEl) titleEl.innerText = 'Modul Pembuatan Surat & Arsip Berbasis Kamera Scanner';
                container.innerHTML = renderLayananView();
            } else if(state.activeTab === 'agenda') {
                if(titleEl) titleEl.innerText = 'Buku Agenda Surat Masuk & Keluar';
                container.innerHTML = renderAgendaView();
            } else if(state.activeTab === 'arsip') {
                if(titleEl) titleEl.innerText = 'Arsip Digital & Pencarian Instan';
                container.innerHTML = renderArsipView();
            } else if(state.activeTab === 'laporan') {
                if(titleEl) titleEl.innerText = 'Rekapitulasi Bulanan & Laporan Arsip PDF';
                container.innerHTML = renderLaporanView();
            } else if(state.activeTab === 'penduduk') {
                if(titleEl) titleEl.innerText = 'Master Data Penduduk Desa';
                container.innerHTML = renderPendudukView();
            } else if(state.activeTab === 'pengguna') {

                container.innerHTML = renderPenggunaView();
            } else if(state.activeTab === 'pengaturan') {

                container.innerHTML = renderPengaturanView();
                setTimeout(() => {

                }, 50);
            }

        async function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if(file) {
                const compressed = await compressImage(file, 800, 800, 0.8);
                tempLetterPhoto = compressed;
                tempIsScanned = false;
                const container = document.getElementById('photoPreviewContainer');
                const img = document.getElementById('capturedPhotoImg');
                const btnText = document.getElementById('scanFilterText');
                if(container && img) {
                    img.src = tempLetterPhoto;
                    img.classList.remove('scan-effect');
                    if(btnText) btnText.innerText = 'Aktifkan Efek Scan';
                    container.classList.remove('hidden');
                }
            }
        }

        function toggleScanFilter() {
            tempIsScanned = !tempIsScanned;
            const img = document.getElementById('capturedPhotoImg');
            const btnText = document.getElementById('scanFilterText');
            if(img) {
                if(tempIsScanned) {
                    img.classList.add('scan-effect');
                    if(btnText) btnText.innerText = 'Nonaktifkan Efek Scan';
                } else {
                    img.classList.remove('scan-effect');
                    if(btnText) btnText.innerText = 'Aktifkan Efek Scan';
                }
            }
        }

        function clearCapturedPhoto() {
            tempLetterPhoto = null;
            tempIsScanned = false;
            const container = document.getElementById('photoPreviewContainer');
            const fileInput = document.getElementById('inputLetterPhoto');
            if(container) container.classList.add('hidden');
            if(fileInput) fileInput.value = '';
        }

        function autofillResident(nik) {
            const res = state.residents.find(r => r.nik === nik);
            if(res) {
                document.getElementById('inputNik').value = res.nik;
                document.getElementById('inputName').value = res.name;
            } else {
                document.getElementById('inputNik').value = '';
                document.getElementById('inputName').value = '';
            }
        }

        function updateClassificationCode() {
            const val = document.getElementById('letterType').value;
            const code = val.split('|')[1];
            document.getElementById('inputCode').value = code;
        }

        function handleGenerateLetter(event) {
            event.preventDefault();
            const letterTypeFull = document.getElementById('letterType').value;
            const [typeName, typeCode] = letterTypeFull.split('|');
            const nik = document.getElementById('inputNik').value;
            const name = document.getElementById('inputName').value;
            const purpose = document.getElementById('inputPurpose').value;
            const sifat = document.getElementById('inputSifat').value;
            const lampiran = document.getElementById('inputLampiran').value;
            const includePurpose = document.getElementById('inputIncludePurpose').checked;
            const vName = getVillageName();

            if(!nik && !typeName.includes('Undangan')) {
                showModal('Peringatan', 'Silakan pilih data penduduk terlebih dahulu!', 'error');
                return;
            }

            const newId = 'L-2026-' + String(state.letters.length + 1).padStart(3, '0');
            const newNo = `${typeCode} / 0${state.letters.length + 1} / KMR.PGT / VIII / 2026`;
            const today = '2026-08-04';

            const newLetter = {
                id: newId,
                nik: nik || '7501010000000000',
                name: name || 'Warga Desa ' + vName,
                type: typeName,
                code: typeCode,
                number: newNo,
                date: today,
                purpose: purpose,
                status: 'Disetujui',
                signedBy: state.settings.headName + ' (' + state.settings.headTitle + ')',
                sifat: sifat,
                lampiran: lampiran,
                includePurpose: includePurpose,
                photo: tempLetterPhoto || null,
                isScanned: tempIsScanned
            };

            state.letters.unshift(newLetter);
            state.agenda.unshift({
                id: 'AG-' + (state.agenda.length + 1),
                type: 'Keluar',
                noSurat: newNo,
                from: vName,
                date: today,
                subject: purpose,
                status: 'Terkirim'
            });

            tempLetterPhoto = null; 
            tempIsScanned = false;
            saveState();

            showModal('Sukses!', `Surat berhasil digenerate & arsip foto scanner tersimpan dengan Nomor Registrasi: <br><strong class="font-mono text-brand-700">${newNo}</strong>`, 'success', () => {
                previewLetter(newId);
            });
        }

        function handleSaveNewUser(e) {
            e.preventDefault();
            const name = document.getElementById('newUserName').value;
            const username = document.getElementById('newUserUsername').value;
            const role = document.getElementById('newUserRole').value;
            const email = document.getElementById('newUserEmail').value;

            state.allowedUsers.push({
                id: state.allowedUsers.length + 1,
                name: name,
                username: username,
                role: role,
                email: email,
                status: 'Aktif'
            });

            saveState();
            closeModal();
            showModal('Sukses', `Akses berhasil ditambahkan untuk <strong>${name}</strong>.`, 'success', () => renderActiveTabContent());
        }

        function removeUser(id) {
            if(state.allowedUsers.length <= 1) {
                showModal('Peringatan', 'Sistem memerlukan setidaknya 1 Administrator aktif.', 'error');
                return;
            }
            state.allowedUsers = state.allowedUsers.filter(u => u.id !== id);
            saveState();
            showModal('Berhasil', 'Akses pengguna berhasil dicabut dari sistem.', 'success', () => renderActiveTabContent());
        }

                    </div>
                </div>
            `;
        }

        async function handleSaveSettings(event) {
            event.preventDefault();
            state.settings.paperSize = document.getElementById('setPaperSize').value;
            state.settings.headName = document.getElementById('setHeadName').value;
            state.settings.headTitle = document.getElementById('setHeadTitle').value;

            state.settings.kopLine1 = document.getElementById('setKop1').value;
            state.settings.kopLine2 = document.getElementById('setKop2').value;
            state.settings.kopLine3 = document.getElementById('setKop3').value;
            state.settings.kopLine4 = document.getElementById('setKop4').value;
            state.settings.sizeLine1 = document.getElementById('setSize1').value;
            state.settings.sizeLine2 = document.getElementById('setSize2').value;
            state.settings.sizeLine3 = document.getElementById('setSize3').value;
            state.settings.sizeLine4 = document.getElementById('setSize4').value;
            state.settings.weightLine1 = document.getElementById('setWeight1').value;
            state.settings.weightLine2 = document.getElementById('setWeight2').value;
            state.settings.weightLine3 = document.getElementById('setWeight3').value;
            state.settings.weightLine4 = document.getElementById('setWeight4').value;
            state.settings.spaceLine1 = document.getElementById('setSpace1').value;
            state.settings.spaceLine2 = document.getElementById('setSpace2').value;
            state.settings.spaceLine3 = document.getElementById('setSpace3').value;
            state.settings.spaceLine4 = document.getElementById('setSpace4').value;
            state.settings.fontLine1 = document.getElementById('setFont1').value;
            state.settings.fontLine2 = document.getElementById('setFont2').value;
            state.settings.fontLine3 = document.getElementById('setFont3').value;
            state.settings.fontLine4 = document.getElementById('setFont4').value;
            state.settings.desaShort = document.getElementById('setDesaShort').value;
            state.settings.appLogo = document.getElementById('setAppLogo').value;
            state.settings.logo1 = document.getElementById('setLogo1').value;
            state.settings.logo2 = document.getElementById('setLogo2').value;
            state.settings.logoCount = document.getElementById('setLogoCount').value;
            state.settings.align = document.getElementById('setAlign').value;
            state.settings.logoHeight = document.getElementById('setLogoHeight').value;
            state.settings.logoWidth = document.getElementById('setLogoWidth').value;

            await saveSettingsToSupabase();
            showModal('Berhasil', 'Pengaturan & Logo berhasil disimpan ke Database Supabase!', 'success', () => renderActiveTabContent());
        }

        function toggleLogoInputs(val) {
            const container = document.getElementById('logo2Container');
            if(val === '1') {
                container.classList.add('opacity-40', 'pointer-events-none');
            } else {
                container.classList.remove('opacity-40', 'pointer-events-none');
            }
        }

        function previewLetter(id) {
            const l = state.letters.find(item => item.id === id);
            const res = state.residents.find(item => item.nik === l.nik) || { pob: 'Paguat', dob: '1990-01-01', job: 'Warga', gender: 'Laki-laki', address: 'Dsn I Desa Kamiiri' };
            const vName = getVillageName();
            const shouldIncludePurpose = l.includePurpose !== false;
            const pSize = state.settings.paperSize || 'A4';

            const modalHtml = `
                <div class="flex justify-between items-center mb-4 no-print bg-slate-100 p-3 rounded-xl border border-slate-200">
                    <div>
                        <span class="text-xs font-bold text-slate-700">Format Pratinjau Kertas:</span>
                        <span class="ml-2 bg-brand-100 text-brand-800 text-xs font-mono font-bold px-2 py-0.5 rounded">${pSize}</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeModalPaperSize('${id}', 'A4')" class="px-3 py-1 rounded-lg text-xs font-semibold ${pSize === 'A4' ? 'bg-brand-600 text-white' : 'bg-white text-slate-700 border'}">A4</button>
                        <button onclick="changeModalPaperSize('${id}', 'F4')" class="px-3 py-1 rounded-lg text-xs font-semibold ${pSize === 'F4' ? 'bg-brand-600 text-white' : 'bg-white text-slate-700 border'}">F4</button>
                    </div>
                </div>

                <div class="flex justify-center bg-slate-200/60 p-4 rounded-xl overflow-x-auto">
                    <div id="printable-letter" class="bg-white p-12 shadow-2xl border border-slate-300 text-slate-800 space-y-4 ${getPaperDimensionsClass(pSize)}">
                        ${renderKopSuratHtml(state.settings)}

                        ${l.type.includes('Undangan') ? `
                            <div class="grid grid-cols-2 text-xs pt-1 pb-2">
                                <div class="space-y-0.5">
                                    <div class="flex"><span class="w-20 font-medium">Nomor</span><span class="mr-2">:</span><span class="font-mono">${l.number}</span></div>
                                    <div class="flex"><span class="w-20 font-medium">Sifat</span><span class="mr-2">:</span><span>${l.sifat || 'Penting'}</span></div>
                                    <div class="flex"><span class="w-20 font-medium">Lampiran</span><span class="mr-2">:</span><span>${l.lampiran || '-'}</span></div>
                                    <div class="flex"><span class="w-20 font-medium">Perihal</span><span class="mr-2">:</span><span class="font-semibold">Undangan Rapat</span></div>
                                </div>
                                <div class="text-right space-y-0.5">
                                    <p>${vName}, 04 Agustus 2026</p>
                                    <p class="pt-2">Kepada Yang Terhormat</p>
                                    <p>Bapak/Ibu/sdr (i)</p>
                                    <p>Di -</p>
                                    <p class="font-semibold pl-4">Tempat</p>
                                </div>
                            </div>

                            <div class="text-xs leading-relaxed space-y-3 pt-2">
                                <p class="font-semibold">Dengan Hormat,</p>
                                <p>Sehubungan dengan ${l.purpose}, oleh karena itu kami mengundang Bapak/Ibu/sdr(i) untuk hadir pada rapat persiapan kegiatan dimaksud yang Insya Allah akan dilaksanakan pada :</p>
                                
                                <div class="pl-4 space-y-1 my-2">
                                    <div class="flex"><span class="w-24">Hari / Tanggal</span><span>: Senin, 10 Agustus 2026</span></div>
                                    <div class="flex"><span class="w-24">Pukul</span><span>: 14.00 WITA s.d Selesai</span></div>
                                    <div class="flex"><span class="w-24">Tempat</span><span>: Kantor Desa ${vName}</span></div>
                                </div>

                                <p>Demikian surat undangan ini kami sampaikan, atas kehadiran dan kerjasamanya kami ucapkan terima kasih.</p>
                            </div>
                        ` : `
                            <div class="text-center pt-2 pb-1 space-y-1">
                                <h3 class="text-base font-bold uppercase underline tracking-wide">${l.type}</h3>
                                <p class="text-xs font-mono">Nomor: ${l.number}</p>
                            </div>

                            <div class="text-xs leading-relaxed space-y-3 pt-3">
                                <p>Yang bertanda tangan di bawah ini ${state.settings.headTitle}${vName} Kecamatan Paguat Kabupaten Pohuwato, menerangkan dengan sebenarnya bahwa:</p>
                                
                                <div class="pl-6 space-y-1 py-1">
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Nama Lengkap</span><span class="col-span-8">: <strong>${l.name}</strong></span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">NIK / No. KTP</span><span class="col-span-8">: <span class="font-mono">${l.nik}</span></span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Tempat / Tgl. Lahir</span><span class="col-span-8">: ${res.pob},${res.dob}</span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Jenis Kelamin</span><span class="col-span-8">: ${res.gender}</span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Agama</span><span class="col-span-8">: Islam</span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Pekerjaan</span><span class="col-span-8">: ${res.job}</span></div>
                                    <div class="grid grid-cols-12"><span class="col-span-4 font-semibold">Alamat / Domisili</span><span class="col-span-8">: ${res.address} Desa${vName}</span></div>
                                </div>

                                <p>
                                    ${l.type.includes('Domisili') ? `Berdasarkan data kependudukan dan keterangan yang ada pada kami, yang bersangkutan benar-benar merupakan penduduk yang berdomisili tetap di Desa ${vName} Kecamatan Paguat Kabupaten Pohuwato.` :
                                      l.type.includes('Usaha') ? `Berdasarkan pengamatan dan penelitian kami, yang bersangkutan benar-benar memiliki unit usaha produktif / perdagangan di wilayah Desa ${vName} Kecamatan Paguat.` :
                                      `Surat keterangan ini diberikan kepada yang bersangkutan.`}
                                </p>

                                ${shouldIncludePurpose ? `
                                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 font-medium text-slate-700 my-2">
                                        <strong>Keperluan / Perihal Surat:</strong> ${l.purpose}
                                    </div>
                                ` : ''}

                                <p>Demikian surat keterangan ini dibuat dengan sebenarnya dan diberikan kepada yang bersangkutan untuk dapat dipergunakan sebagaimana mestinya.</p>
                            </div>
                        `}

                        ${l.photo ? `
                            <div class="pt-4 border-t border-slate-200 mt-6 no-print">
                                <div class="flex items-center justify-between mb-2">
                                    <p class="text-xs font-bold text-slate-700"><i class="fa-solid fa-camera mr-1 text-emerald-600"></i> Lampiran Foto / Hasil Scan Arsip Dokumen:</p>
                                    ${l.isScanned ? '<span class="text-[10px] bg-slate-900 text-white px-2 py-0.5 rounded font-mono">Mode Scan Aktif</span>' : ''}
                                </div>
                                <img src="${l.photo}" class="w-48 h-48 object-cover rounded-xl border shadow-md ${l.isScanned ? 'scan-effect' : ''}" alt="Lampiran Foto Arsip">
                            </div>
                        ` : ''}

                        <div class="flex justify-end pt-12 text-xs">
                            <div class="text-center">
                                <p>${vName}, ${l.date}</p>
                                <p class="font-bold">${state.settings.headTitle} ${vName}</p>
                                <div class="h-16 flex items-center justify-center">
                                    <span class="text-[10px] bg-brand-50 text-brand-700 px-2 py-1 rounded font-mono border border-brand-200">[TTE / Stempel Resmi Desa]</span>
                                </div>
                                <p class="font-bold underline">${state.settings.headName}</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-6 flex justify-end space-x-3 no-print">
                    <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold hover:bg-slate-300 transition">Tutup</button>
                    <button onclick="window.print()" class="px-5 py-2 bg-brand-600 text-white rounded-xl text-xs font-semibold shadow hover:bg-brand-700 transition flex items-center space-x-2">
                        <i class="fa-solid fa-print"></i><span>Cetak Surat (${pSize})</span>
                    </button>
                </div>
            `;

            showCustomModalHtml(modalHtml);
        }

        function changeModalPaperSize(id, size) {
            state.settings.paperSize = size;
            saveSettingsToSupabase();
            previewLetter(id);
        }

        let currentModalCallback = null;

        function showModal(title, message, type = 'success', callback = null) {
            currentModalCallback = callback;
            const content = `
                <div class="text-center space-y-4 py-4">
                    <div class="w-12 h-12 mx-auto rounded-full flex items-center justify-center text-xl ${type === 'success' ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'}">
                        <i class="fa-solid ${type === 'success' ? 'fa-check' : 'fa-triangle-exclamation'}"></i>
                    </div>
                    <h3 class="font-bold text-lg text-slate-800">${title}</h3>
                    <p class="text-xs text-slate-600">${message}</p>
                    <button onclick="closeModal(); if(currentModalCallback) { const cb = currentModalCallback; currentModalCallback = null; cb(); }" class="w-full bg-slate-900 text-white py-2.5 rounded-xl text-xs font-semibold hover:bg-slate-800 transition">OK</button>
                </div>
            `;
            document.getElementById('modalContent').innerHTML = content;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function showCustomModalHtml(html) {
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        // Inisialisasi awal saat halaman dimuat
        document.addEventListener('DOMContentLoaded', async () => {
            await loadSettingsFromSupabase();
        });
    </script>
</body>
</html>
